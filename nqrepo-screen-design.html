/* 更新履歴の1行。前後の控えがそろう行は押せる（押すと中央に 変更後｜変更前 が横に並ぶ）。
   資料全体の行は仕様側の変更が多く、プロトタイプを並べても差が出ないので押せなくしてある */
function logPick(d, tm, id, i, inner){
  const pr = id && IDX[id] && IDX[id].hash && DEMO_HREF ? pairFor(d, tm) : null;
  if (!pr) return inner;
  const key = `${id}:${i}`, on = cmpKey === key, b = snapOf(pr.b), a = snapOf(pr.a);
  return `<button type="button" class="lpick${on ? ' on' : ''}" aria-pressed="${on}" data-pick="${esc(key)}"
      data-pb="${esc(pr.b)}" data-pa="${esc(pr.a)}" data-cid="${esc(id)}"
      title="${esc(`変更前 ${snapWhen(b)} ／ 変更後 ${a ? snapWhen(a) : 'いま'}`)}">
    ${inner}<span class="lchip">${on ? '表示中' : '前後を見る'}</span></button>`;
}

/* =========================================================================
   フロー（画面の遷移図）
   列は「入口からいちばん遠い距離」で決める。戻り線は数えない。
   行はグループごとのレーン。位置は自動なので、FLOW を直せば図も直る。
   ========================================================================= */
const FNODE = {w:176, h:54, gx:92, gy:14, pad:26, top:22, lanePad:34, laneGap:16};

/* ---- 帳票ごとのフロー ------------------------------------------------------
   帳票の枝（M2-n・M3-n・M4-n・M5-n・A1-n。n は帳票の番号で、1 が使用水の点検）は
   10 帳票ぶんあるので、選んだ 1 帳票だけを図に出す。骨組み（M0〜M14・A0〜A7）は共通。
   使用水（n=1）のつながりは FLOW に手で書いてあるのでそのまま使う。
   他の 9 帳票は画面の数も並びも帳票ごとに違うので、画面名から「どこから来るか」を決めて組み立てる。
   -------------------------------------------------------------------------- */
const FLOW_LEDGERS = [['water-inspection', '使用水の点検'], ...DS_LEDGERS];   /* 番号 n = 並び順 + 1 */
/* SCREEN_HIDE の画面（確認管理）へつながる線と、そこを通るユースケースもフローに出さない */
const FLOW_HIDE = SCREEN_HIDE;
const LEDGER_RE  = /^(M2|M3|M4|M5|A1)-(\d+)/;
const ledgerNo   = id => { const m = LEDGER_RE.exec(id); return m ? +m[2] : 0; };
const ledgerPre  = id => { const m = LEDGER_RE.exec(id); return m ? m[1] : ''; };
/* 「帳票名 › 画面名」の画面名の方。フロー図は 1 帳票ぶんなので帳票名を外して短く出す */
const stepName = id => { const s = IDX[id] || {}; const i = (s.name || '').indexOf('› ');
  return i < 0 ? (s.name || '') : s.name.slice(i + 2); };
/* 帳票 n の枝の画面（M5-n-1, M5-n-2 … の順） */
const ledgerSteps = (pre, n) => SCREENS.filter(s => s.id.indexOf(`${pre}-${n}-`) === 0).map(s => s.id);

/* 画面名から親（どの画面から来るか）を決める。ids は枝の画面、hub は枝の根（M5 は工場選択の次＝一覧）。
   一覧・管理・点検予定 は根から出る枝、新規登録・詳細はその一覧から、編集は詳細から、完了は直前から。
   当てはまらないものは前の画面から続く（画面の並びは「押していく順」なので、これで大体合う） */
const HUB_RE = /一覧|管理|点検予定|選択/;
/* 機械器具点検・清掃記録の「翌日分のラインの一覧」。提出完了（明日に見送る：いいえ で見送った翌日）から続ける */
const NEXTDAY_RE = /翌日分/;
function branchParent(ids, i, hub){
  const nm = k => stepName(ids[k]);
  /* 翌日分の一覧は「明日に見送る：いいえ」で提出したあとの画面なので、他の画面の親にはしない */
  const back = re => { for (let k = i - 1; k >= 0; k--) if (!NEXTDAY_RE.test(nm(k)) && re.test(nm(k))) return k; return -1; };
  const s = nm(i), prev = back(/./) < 0 ? i - 1 : back(/./), pick = (...c) => { for (const v of c) if (v >= 0) return v; return prev; };
  if (NEXTDAY_RE.test(s)){ const k = ids.findIndex(id => /提出完了/.test(stepName(id))); return k >= 0 ? k : prev; }
  if (/編集/.test(s))                  return pick(back(/詳細/));
  if (/提出完了|保存完了/.test(s))     return pick(back(/提出内容の確認/));
  if (/削除完了/.test(s))              return pick(back(/詳細|設定/));
  if (/完了/.test(s))                  return prev;
  if (/設定|確認項目/.test(s))         return pick(back(/詳細/), back(HUB_RE));
  if (/新規登録/.test(s))              return pick(back(HUB_RE));
  if (/記録の詳細|見直し/.test(s))     return pick(back(/詳細/), back(HUB_RE));
  if (/詳細/.test(s))                  return pick(back(HUB_RE));
  if (HUB_RE.test(s))                  return i > hub ? hub : prev;
  if (/提出内容の確認|見送り/.test(s)) return pick(back(/入力|の点検/));
  return prev;
}
/* 帳票管理（M5-n）とアプリ（A1-n）の枝のつながり。戻り道（修正する・一覧へ）も足す */
function branchEdges(pre, n){
  const ids = ledgerSteps(pre, n);
  if (!ids.length) return [];
  const hub = pre === 'M5' ? 1 : 0;
  const out = [[`${pre}-${n}`, ids[0], '', 'tab']];
  ids.forEach((id, i) => { if (i) out.push([ids[branchParent(ids, i, hub)], id,
    NEXTDAY_RE.test(stepName(id)) ? '明日に見送る：いいえ' : '']); });
  if (pre === 'A1'){
    const inp = roleId('input', n), cf = roleId('confirm', n), dn = roleId('done', n);
    if (cf && inp && cf !== inp) out.push([cf, inp, '修正する', 'back']);
    /* 提出完了の「○○を続ける」で一覧へ。並び順の計算には使わない（back）が、本線なので実線で描く（5 つ目の 'go'） */
    if (dn && dn !== ids[0])     out.push([dn, ids[0], `${(FLOW_LEDGERS[n - 1] || [])[1] || ''}を続ける`, 'back', 'go']);
    /* 点検見送り確認 → 提出完了（見送りも提出完了の画面を通る） */
    ids.forEach(id => { if (dn && /見送り確認/.test(stepName(id))) out.push([id, dn, '提出（見送り）']); });
  } else {
    ids.forEach((id, i) => { if (i && /完了/.test(stepName(id))){
      const h = (() => { for (let k = i - 1; k >= 0; k--) if (HUB_RE.test(stepName(ids[k]))) return ids[k]; return ''; })();
      if (h && h !== id) out.push([id, h, '一覧へ', 'back']);
    }});
  }
  return out;
}
/* 使用水の画面の「役どころ」。他の帳票は画面の並びが違うので、同じ役どころを画面名から探す */
const LEDGER_ROLE = {'A1-1-1':'list', 'A1-1-2':'input', 'A1-1-3':'confirm', 'A1-1-4':'done', 'M5-1-2':'listed'};
function roleId(role, n){
  if (role === 'listed') return `M5-${n}-2`;
  const a = ledgerSteps('A1', n), f = re => a.find(id => re.test(stepName(id)));
  if (!a.length) return '';
  if (role === 'list')    return a[0];
  if (role === 'input')   return f(/入力/) || f(/の点検/) || a[1] || a[0];
  if (role === 'confirm') return f(/提出内容の確認/) || a[2] || a[0];
  if (role === 'done')    return f(/提出完了|保存完了/) || a[a.length - 1];
  return '';
}
/* 使用水の画面ID → 選んだ帳票の画面ID */
const mapId = (id, n) => {
  if (n === 1 || !ledgerNo(id)) return id;
  return LEDGER_ROLE[id] ? roleId(LEDGER_ROLE[id], n) : id.replace(/^(M2|M3|M4|M5|A1)-1(?=-|$)/, `$1-${n}`);
};
/* 帳票 n のときの遷移。骨組みと帳票をまたぐ線は FLOW を読み替え、枝の中は組み立て直す */
function ledgerFlow(n){
  if (n === 1) return FLOW;
  const out = [];
  FLOW.forEach(([a, b, l, k]) => {
    const A = mapId(a, n), B = mapId(b, n);
    if (!A || !B || A === B || (ledgerNo(A) && !IDX[A]) || (ledgerNo(B) && !IDX[B])) return;
    if (ledgerNo(A) === n && ledgerNo(B) === n && ledgerPre(A) === ledgerPre(B)
        && (ledgerPre(A) === 'M5' || ledgerPre(A) === 'A1')) return;   /* 枝の中は下で作り直す */
    out.push([A, B, (l || '').replace(/点検場所/g, '登録したもの'), k]);
  });
  return [...out, ...branchEdges('M5', n), ...branchEdges('A1', n)];
}

/* 図の材料。出すのは画面の遷移だけ（記録の状態の図は 2026-09-25 に凡例の切替ごと外した） */
let flowCase = null, flowLedger = 1;
function flowGraph(){
  const n = flowLedger, lab = (FLOW_LEDGERS[n - 1] || [])[1] || '';
  return {lanes: [...new Set(SCREENS.map(s => s.grp))],
          nodes: SCREENS.filter(s => { const k = ledgerNo(s.id); return k ? k === n : !s.noflow; })
            .map(s => ({id:s.id, name: ledgerNo(s.id) ? stepName(s.id) : s.name, grp:s.grp,
                        sub: ledgerNo(s.id) ? `${lab}｜${s.sub || ''}` : (s.sub || ''), go:s.id, pin:!!s.pin})),
          edges: ledgerFlow(n).filter(([a, b]) => !FLOW_HIDE(a) && !FLOW_HIDE(b)), entries: FLOW_IN};
}

/* ユースケース 6 本 × 10 帳票。帳票ごとに画面が違うので、経路は帳票ごとに作り直す */
function caseList(){
  return FLOW_LEDGERS.flatMap(([slug, label], i) => {
    const n = i + 1;
    /* 「どこから来たか」。同じ帳票の枝の中の線を先に見る（帳票をまたぐ線を親にすると道が途切れる） */
    const ed = ledgerFlow(n), par = {};
    const addPar = mine => ed.forEach(([a, b, l, k]) => {
      if (k === 'back' || par[b]) return;
      const same = ledgerPre(a) === ledgerPre(b) && ledgerNo(a) === ledgerNo(b);
      if (same === mine) par[b] = a;
    });
    addPar(true); addPar(false);
    return CASES.map((c, ci) => (c.only && !c.only.includes(slug)) || c.path.some(FLOW_HIDE) ? null : (() => {
      const raw = [];
      c.path.map(id => id.replace('{n}', n)).forEach(id => { const v = mapId(id, n); if (v && IDX[v] && v !== raw[raw.length - 1]) raw.push(v); });
      /* 帳票によっては間に画面が挟まる（例：金属探知機は 一覧 → 機器の詳細 → 記録入力）。
         つながる道があれば間の画面も経路に入れて、線が切れないようにする */
      const path = [];
      raw.forEach((id, k) => {
        if (k){ const mid = []; let p = par[id];
          while (p && p !== raw[k - 1] && mid.length < 6){ mid.unshift(p); p = par[p]; }
          if (p === raw[k - 1]) path.push(...mid); }
        path.push(id);
      });
      const fill = t => (t || '').replace(/\{L\}/g, label);
      return {key:`${n}.${ci}`, n, ledger:label,
              name: fill(n === 1 ? c.name : (c.gname || c.name)),
              note: fill(n === 1 ? c.note : (c.gnote || c.note)), path};
    })()).filter(Boolean);
  });
}
const CASE_LIST = caseList();
const caseOf = key => CASE_LIST.find(c => c.key === key) || null;
function flowDepth(g, gi){
  const d = {}; g.nodes.forEach(n => d[n.id] = 0);
  /* 列は同じレーンの中だけで数える。別レーンへ渡る線まで数えると横に伸びすぎる */
  const fwd = g.edges.filter(([a,b,l,k]) =>
    k !== 'back' && gi[a] && gi[b] && gi[a].grp === gi[b].grp);
  /* 前に進む辺だけで、いちばん長い道のりを求める。節点の数だけ回せば必ず止まる */
  for (let i = 0; i < g.nodes.length; i++){
    let moved = false;
    for (const [a,b] of fwd) if (d[b] < d[a] + 1){ d[b] = d[a] + 1; moved = true; }
    if (!moved) break;
  }
  return d;
}
/* レーンごとに列へ分け、縦はつながりの重心へ寄せる。
   上から順に積むと、1つのノードに集まる線が片側へ寄って重なるため、
   隣り合うノードの平均の高さへ動かし、重なった分だけ押し広げる。
   きれいに整列はしないが、線の交差と重なりが減って追いやすくなる */
function flowLayout(g, gi){
  const d = flowDepth(g, gi);
  const GY = FNODE.h + FNODE.gy;
  const pos = {}, laneBox = [];
  /* 同じレーンの中での隣。戻り線は数えない（戻りに引かれると並びが不自然になる） */
  const near = {};
  g.nodes.forEach(n => near[n.id] = []);
  g.edges.forEach(([a, b, l, k]) => {
    if (k === 'back' || !gi[a] || !gi[b] || gi[a].grp !== gi[b].grp) return;
    near[a].push(b); near[b].push(a);
  });
  let y = FNODE.top;
  g.lanes.forEach((gp, li) => {
    const list = g.nodes.filter(n => n.grp === gp);
    if (!list.length) return;
    const cols = {};
    list.forEach(n => { (cols[d[n.id]] = cols[d[n.id]] || []).push(n.id); });
    const keys = Object.keys(cols).map(Number).sort((x, z) => x - z);
    const ly = {}, home = {};
    keys.forEach(c => cols[c].forEach((id, i) => { ly[id] = i * GY; home[id] = i * GY; }));  /* まず素直に積む */

    /* 列を左右に往復しながら、隣の平均へ寄せて重なりを解く */
    const pack = c => {
      const ids = cols[c];
      const want = {};
      ids.forEach(id => {
        const ns = near[id].filter(o => ly[o] !== undefined && d[o] !== c);
        const bary = ns.length ? ns.reduce((t, o) => t + ly[o], 0) / ns.length : ly[id];
        /* 元の並びを少し残す。つながりだけで決めると、ほぼ同点のときに順番が入れ替わる */
        /* pin のノードは並び順のまま（サイドメニューの順を保つ）。他はつながりの重心へ */
        want[id] = gi[id].pin ? home[id] : bary * 0.75 + home[id] * 0.25;
      });
      const sorted = [...ids].sort((x, z) => want[x] - want[z] || ids.indexOf(x) - ids.indexOf(z));
      const out = sorted.map(id => want[id]);
      for (let i = 1; i < out.length; i++) if (out[i] < out[i-1] + GY) out[i] = out[i-1] + GY;
      /* 押し広げた分だけ中心がずれるので、望んだ位置の中心に戻す */
      const mw = sorted.reduce((t, id) => t + want[id], 0) / sorted.length;
      const mo = out.reduce((t, v) => t + v, 0) / out.length;
      sorted.forEach((id, i) => ly[id] = out[i] - mo + mw);
    };
    for (let pass = 0; pass < 8; pass++){
      const order = pass % 2 ? [...keys].reverse() : keys;
      order.forEach(pack);
    }

    const min = Math.min(...list.map(n => ly[n.id]));
    const max = Math.max(...list.map(n => ly[n.id]));
    const top = y, hgt = FNODE.lanePad + (max - min) + FNODE.h + 16;
    list.forEach(n => {
      pos[n.id] = {x: FNODE.pad + d[n.id] * (FNODE.w + FNODE.gx),
                   y: Math.round(top + FNODE.lanePad + ly[n.id] - min), lane: li};
    });
    laneBox.push({name:gp, top, h:hgt});
    y = top + hgt + FNODE.laneGap;
  });
  const maxC = Math.max(...g.nodes.map(n => d[n.id]));
  return {pos, laneBox, d, w: FNODE.pad * 2 + maxC * (FNODE.w + FNODE.gx) + FNODE.w, h: y};
}
/* 辺の形。同じノードに何本も刺さるので付け根を縦にずらす。
   タブ・メニューの線は1本の幹にまとめて、そこから枝を出す */
function flowEdges(g, gi, L){
  const W = FNODE.w, H = FNODE.h;
  const raw = g.edges.filter(([a,b]) => gi[a] && gi[b]);
  const fwd = raw.filter(([a,b,l,k]) => k !== 'back' && k !== 'tab' && L.pos[b].x > L.pos[a].x);
  const an = {};
  const spread = (map, key) => Object.entries(map).forEach(([id, arr]) => {
    arr.sort((x, y) => L.pos[x].y - L.pos[y].y);
    arr.forEach((o, i) => {
      const k = key === 'sy' ? id + '>' + o : o + '>' + id;
      (an[k] = an[k] || {})[key] = H * (i + 1) / (arr.length + 1);
    });
  });
  const out = {}, inn = {};
  fwd.forEach(([a, b]) => { (out[a] = out[a] || []).push(b); (inn[b] = inn[b] || []).push(a); });
  spread(out, 'sy'); spread(inn, 'ty');

  const items = [], tabOf = {};
  raw.forEach(e => { if (e[3] === 'tab') (tabOf[e[0]] = tabOf[e[0]] || []).push(e[1]); });

  raw.forEach(([a, b, lb, k, st]) => {
    const pa = L.pos[a], pb = L.pos[b];
    const cross = pa.lane !== pb.lane && k !== 'back';
    if (k === 'tab' && (tabOf[a] || []).length > 1) return;
    let d, lx, ly, vert = true;
    if (k === 'back'){
      const y1 = pa.y + H, y2 = pb.y + H, dip = Math.max(y1, y2) + 18;
      d = `M${pa.x + W/2} ${y1} C${pa.x + W/2} ${dip}, ${pb.x + W/2} ${dip}, ${pb.x + W/2} ${y2}`;
      lx = (pa.x + pb.x) / 2 + W/2; ly = dip + 1;
    } else if (pb.x > pa.x){
      const key = a + '>' + b, o = an[key] || {};
      const x1 = pa.x + W, x2 = pb.x, y1 = pa.y + (o.sy || H/2), y2 = pb.y + (o.ty || H/2);
      const mid = (x1 + x2) / 2;
      d = `M${x1} ${y1} C${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
      lx = x1 + FNODE.gx / 2; ly = y1 - 8;
      vert = false;
    } else {
      const down = pb.y > pa.y;
      const y1 = pa.y + (down ? H : 0), y2 = pb.y + (down ? 0 : H), mid = (y1 + y2) / 2;
      d = `M${pa.x + W/2} ${y1} C${pa.x + W/2} ${mid}, ${pb.x + W/2} ${mid}, ${pb.x + W/2} ${y2}`;
      lx = (pa.x + pb.x) / 2 + W/2; ly = mid + 4;
      if (Math.abs(y2 - y1) < 40) ly = mid - 8;
    }
    items.push({a, b, lb: lb || '', k: k || '', go: st === 'go', cross, d, lx, ly, vert,
      /* 字が収まるかの目安。戻り線は下を回るので、縦ではなく横の距離で見る */
      gap: k === 'back' ? Math.abs(pb.x - pa.x)
         : pb.x > pa.x ? FNODE.gx : Math.abs(pb.y - pa.y)});
  });

  Object.entries(tabOf).forEach(([a, tos]) => {
    if (tos.length < 2) return;
    const pa = L.pos[a], ts = tos.map(t => L.pos[t]);
    const bx = Math.min(...ts.map(t => t.x)) - FNODE.gx / 2;
    const ys = ts.map(t => t.y + H/2).concat([pa.y + H/2]);
    items.push({a, b:'', lb:'', k:'tab bus', cross:false,
      d: `M${pa.x + W} ${pa.y + H/2} H${bx} M${bx} ${Math.min(...ys)} V${Math.max(...ys)}`, lx:0, ly:0, gap:999});
    tos.forEach(t => {
      const pt = L.pos[t];
      items.push({a, b:t, lb:'', k:'tab', cross:false,
        d: `M${bx} ${pt.y + H/2} H${pt.x}`, lx:0, ly:0, gap:999});
    });
  });
  /* ラベルがノードに重なったら、線に沿って少しずらす。逃がせなければ出さない */
  const boxes = g.nodes.map(n => L.pos[n.id]).filter(Boolean);
  const hits = (x, y, w) => boxes.some(b =>
    x + w/2 > b.x - 3 && x - w/2 < b.x + W + 3 && y + 9 > b.y - 3 && y - 9 < b.y + H + 3);
  const DX = [0, 34, -34, 68, -68, 104, -104], DY = [0, 26, -26, 52, -52, 80, -80];
  const put = [];                       /* 置いたラベル。字同士も重ねない */
  const busy = (x, y, w) => hits(x, y, w) ||
    put.some(q => x + w/2 > q.x - q.w/2 - 4 && x - w/2 < q.x + q.w/2 + 4 && Math.abs(y - q.y) < 18);
  items.forEach(e => {
    if (!e.lb || e.k.startsWith('tab')) return;
    const w = e.lb.length * 10.5 + 10;
    /* 近い所から順に、縦横へずらして空きを探す。線から離れすぎない範囲で総当たり */
    const cand = [];
    (e.vert ? DX : [0, 26, -26]).forEach(dx => DY.forEach(dy =>
      cand.push([dx, dy, Math.abs(dx) + Math.abs(dy)])));
    cand.sort((p, q) => p[2] - q[2]);
    for (const [dx, dy] of cand){
      if (!busy(e.lx + dx, e.ly + dy, w)){
        e.lx += dx; e.ly += dy; put.push({x:e.lx, y:e.ly, w}); return;
      }
    }
    e.lb = '';
  });
  return items;
}

/* 選んだユースケースの経路だけ濃く残す。key は CASE_LIST のキー（帳票の番号.何本目） */
function pickCase(key){
  const c = caseOf(key);
  flowCase = c ? c.key : null;
  const box = document.getElementById('fwrap');
  box.classList.toggle('picked', !!c);
  box.querySelectorAll('.pk').forEach(e => e.classList.remove('pk'));
  const note = box.querySelector('.fcnote');
  if (note){ note.textContent = c ? dispText(c.note) : ''; note.hidden = !c; placeNote(); }
  const inp = box.querySelector('.fcin');
  if (inp && document.activeElement !== inp) inp.value = c ? c.name : '';
  const clr = box.querySelector('.fcclr');
  if (clr) clr.hidden = !c;
  if (!c) return;
  const path = c.path, set = new Set(path);
  box.querySelectorAll('.fnode').forEach(n => { if (set.has(n.dataset.go)) n.classList.add('pk'); });
  for (let k = 0; k < path.length - 1; k++){
    box.querySelectorAll(`.fsvg [data-a="${path[k]}"][data-b="${path[k+1]}"]`).forEach(e => e.classList.add('pk'));
  }
}
/* ユースケースを選ぶ。別の帳票のものなら、その帳票へ切り替えてから経路を出す */
function goCase(key){
  const c = caseOf(key);
  if (!c) { pickCase(null); return; }
  if (c.n !== flowLedger){ flowLedger = c.n; flowCase = c.key; flowAuto = true; renderFlow(); return; }
  pickCase(c.key);
}

function renderFlow(){
  const box = document.getElementById('fwrap');
  const g = flowGraph();
  if (!g.edges.length){ box.innerHTML = '<p class="fnote">FLOW に遷移を書くと、ここに画面のつながりが出ます。</p>'; return; }
  const gi = {}; g.nodes.forEach(n => gi[n.id] = n);
  const L = flowLayout(g, gi); flowL = L;
  const edges = flowEdges(g, gi, L);
  const lbl = e => {
    if (!e.lb || e.k.startsWith('tab')) return '';
    const wd = e.lb.length * 10.5 + 10;
    if (!e.cross && wd > e.gap - 8) return '';
    return `<g class="lg${e.cross ? ' cross' : ''}${e.k === 'q' ? ' q' : ''}" data-a="${e.a}" data-b="${e.b}">
      <rect class="lbb" x="${e.lx - wd/2}" y="${e.ly - 8}" width="${wd}" height="16" rx="5"></rect>
      <text class="lb" x="${e.lx}" y="${e.ly + 4}" text-anchor="middle">${esc(e.lb)}</text></g>`;
  };
  box.innerHTML = `
    <div class="fleg">
      <label class="fsel">帳票
        <select class="fledger">${FLOW_LEDGERS.map(([sl, lb], i) =>
          `<option value="${i + 1}"${i + 1 === flowLedger ? ' selected' : ''}>${esc(lb)}</option>`).join('')}</select></label>
      <div class="fcw"><span class="fcl">ユースケース</span>
        <div class="fcbox">
          <input class="fcin" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list"
            aria-controls="fclist" placeholder="すべての線を見る" autocomplete="off"
            value="${esc((caseOf(flowCase) || {}).name || '')}">
          <button type="button" class="fcclr" aria-label="ユースケースを外す"${flowCase ? '' : ' hidden'}>×</button>
          <div class="fclist" id="fclist" role="listbox" hidden></div>
        </div></div>
      <span class="fdiv"></span>
      <span><i></i>押して進む</span>
      <span><i class="tab"></i>タブ・メニューで移動</span>
      <span><i class="back"></i>戻る・差し戻し</span>
      <span><i class="cross"></i>別の入れ物へ渡る</span><span><b style="color:var(--g-d)">入口</b> 外から入る画面</span>
    </div>
    <p class="fcnote" hidden></p>
    <div class="fmap" id="fmap" style="width:${L.w}px;height:${L.h}px">
      ${L.laneBox.map((b, i) => `<div class="flane ${i % 2 ? 'alt' : ''}" style="top:${b.top}px;height:${b.h}px;width:${L.w}px">
        <span class="ln">${esc(b.name)}</span></div>`).join('')}
      <svg class="fsvg" width="${L.w}" height="${L.h}" viewBox="0 0 ${L.w} ${L.h}">
        <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L8 4 L0 8 z" fill="var(--line-s)" stroke="none"></path></marker>
        <marker id="ahg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L8 4 L0 8 z" fill="var(--g)" stroke="none"></path></marker></defs>
        ${edges.map(e => `<path class="${e.k}${e.cross ? ' cross' : ''}${e.go ? ' go' : ''}" data-a="${e.a}" data-b="${e.b}" d="${e.d}"
          ${e.k === 'tab bus' ? '' : `marker-end="url(#${e.cross ? 'ahg' : 'ah'})"`}></path>`).join('')}
        ${edges.map(lbl).join('')}
      </svg>
      ${g.nodes.map(n => {
        const p = L.pos[n.id], tag = n.go ? 'button' : 'div';
        return `<${tag} ${n.go ? 'type="button"' : ''} class="fnode${n.go ? '' : ' flat'}" data-go="${n.id}"
          ${n.go ? `aria-current="${n.id === cur.id}"` : ''}
          style="left:${p.x}px;top:${p.y}px;width:${FNODE.w}px;height:${FNODE.h}px" title="${esc(dispText(n.sub))}">
          <span class="r"><span class="fid">${n.go ? dispId(n.id) : ''}</span>
            ${g.entries.includes(n.id) ? '<span class="fin">入口</span>' : ''}</span>
          <span class="fn">${esc(n.name)}</span></${tag}>`;
      }).join('')}
    </div>
    <div class="fzoom">
      <button type="button" data-z="out" title="縮小（⌘−ホイール）" aria-label="縮小">−</button>
      <button type="button" data-z="fit" class="pct" title="幅に合わせる">100%</button>
      <button type="button" data-z="in" title="拡大（⌘＋ホイール）" aria-label="拡大">＋</button>
    </div>`;
  box.classList.remove('picked', 'focus');   /* 前の絞り込みを持ち越さない */
  if (flowAuto) fitFlow(); else paintFlowScale();
  box.querySelectorAll('.fzoom [data-z]').forEach(b => b.onclick = () => {
    const fv = document.getElementById('flowview'), r = fv.getBoundingClientRect();
    const cx = r.x + r.width / 2, cy = r.y + r.height / 2;
    if (b.dataset.z === 'fit') fitFlow();
    else zoomFlow(flowScale * (b.dataset.z === 'in' ? 1.25 : 0.8), cx, cy);
  });
  /* 帳票を切り替える。ユースケースを選んでいたら、同じ何本目かを新しい帳票で選び直す */
  const led = box.querySelector('.fledger');
  if (led) led.onchange = () => {
    flowLedger = +led.value;
    flowCase = flowCase ? `${flowLedger}.${flowCase.split('.')[1]}` : null;
    flowAuto = true; renderFlow();
  };
  bindCaseBox(box);
  /* 押しても地図は組み直さない（見ている場所が飛ぶため）。隣のプロトタイプだけ差し替える。
     狭い画面には隣の枠が無いので、そのときだけ詳細表示へ切り替える */
  box.querySelectorAll('button[data-go]').forEach(b => {
    b.onclick = () => {
      if (narrow()){ setView('screen', {fromHash:true}); go(b.dataset.go); return; }
      go(b.dataset.go, {fromHash:true});
    };
    const on = () => focusNode(b.dataset.go), off = () => focusNode(null);
    b.addEventListener('mouseenter', on);
    b.addEventListener('focus', () => { on(); showNode(b.dataset.go); });
    b.addEventListener('mouseleave', off); b.addEventListener('blur', off);
  });
  if (flowCase) pickCase(flowCase);
}

/* ユースケースの検索つきプルダウン。帳票ごとにまとめて出し、打った字で絞り込む。
   <select> では検索できないので、入力欄＋一覧を自前で持つ */
function bindCaseBox(box){
  const inp = box.querySelector('.fcin'); if (!inp) return;
  const wrap = box.querySelector('.fcbox'), list = box.querySelector('.fclist'), clr = box.querySelector('.fcclr');
  let items = [], act = -1;
  const close = () => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); act = -1; };
  const mark = () => {
    list.querySelectorAll('.fci').forEach((b, i) => {
      const on = i === act; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on));
      if (on) b.scrollIntoView({block:'nearest'});
    });
  };
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    /* 帳票名・ユースケース名・説明のどれかに当たれば出す。いま見ている帳票を先に並べる */
    const hit = CASE_LIST.filter(c => !q || (c.ledger + ' ' + c.name + ' ' + c.note).toLowerCase().includes(q));
    items = [...hit.filter(c => c.n === flowLedger), ...hit.filter(c => c.n !== flowLedger)];
    let html = '', last = '';
    items.forEach((c, i) => {
      if (c.ledger !== last){ html += `<div class="fcg">${esc(c.ledger)}</div>`; last = c.ledger; }
      html += `<button type="button" class="fci${c.key === flowCase ? ' cur' : ''}" role="option"
        aria-selected="false" data-key="${c.key}" data-i="${i}"><b>${esc(c.name)}</b><span>${esc(dispText(c.note))}</span></button>`;
    });
    list.innerHTML = html || '<p class="fcempty">当てはまるユースケースがありません</p>';
    list.hidden = false; inp.setAttribute('aria-expanded', 'true');
    /* 画面の右端からはみ出すときは左へずらす（狭い画面では入力欄が右寄りになる） */
    list.style.left = '0px';
    const over = list.getBoundingClientRect().right - (fvBox().getBoundingClientRect().right - 10);
    if (over > 0) list.style.left = `${-over}px`;
    act = items.findIndex(c => c.key === flowCase); mark();
  };
  inp.addEventListener('focus', draw);
  inp.addEventListener('input', () => { act = -1; draw(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (list.hidden) return draw();
      if (!items.length) return;
      const down = e.key === 'ArrowDown';
      act = act < 0 ? (down ? 0 : items.length - 1) : (act + (down ? 1 : items.length - 1)) % items.length;
      mark();
    } else if (e.key === 'Enter'){
      e.preventDefault();
      if (act >= 0 && items[act]){ const k = items[act].key; close(); inp.blur(); goCase(k); }
    } else if (e.key === 'Escape'){
      e.preventDefault(); close(); inp.value = (caseOf(flowCase) || {}).name || ''; inp.blur();
    }
  });
  /* 押した瞬間に入力欄から焦点が外れないよう mousedown で拾う */
  list.addEventListener('mousedown', e => {
    const b = e.target.closest('.fci'); if (!b) return;
    e.preventDefault(); close(); inp.blur(); goCase(b.dataset.key);
  });
  wrap.addEventListener('focusout', e => {
    if (wrap.contains(e.relatedTarget)) return;
    close(); inp.value = (caseOf(flowCase) || {}).name || '';
  });
  if (clr) clr.onclick = () => { inp.value = ''; pickCase(null); close(); };
}

/* つながりだけ残して、他を薄くする */
function focusNode(id){
  const box = document.getElementById('fwrap');
  box.classList.toggle('focus', !!id);
  box.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
  if (!id) return;
  const near = new Set([id]);
  box.querySelectorAll('.fsvg [data-a]').forEach(e => {
    if (e.dataset.a === id || e.dataset.b === id){
      e.classList.add('on');
      if (e.dataset.a) near.add(e.dataset.a);

    }

/* ---------- 地図の拡大縮小と移動（Figma と同じ操作感） ----------
   地図そのものを動かす方式。スクロール量に頼らないので、幅に収まっていても必ず動く。
   ⌘（トラックパッドはピンチ）＋ホイールで拡大縮小、ホイールで上下、shift＋ホイールで左右、
   何もない所をつかんで移動。自分で動かしたら、幅に合わせる動きは止める */
let flowL = null, flowScale = 1, flowTx = 0, flowTy = 0, flowAuto = true;
const FZ = {min:.3, max:2, keep:150};   /* keep = 画面内に必ず残す地図の量 */

function fvBox(){ return document.getElementById('flowview'); }
function paintFlowScale(){
  const map = document.getElementById('fmap');
  if (!flowL || !map) return;
  map.style.transform = `translate(${Math.round(flowTx)}px, ${Math.round(flowTy)}px) scale(${flowScale})`;
  const pct = document.querySelector('.fzoom .pct');
  if (pct){ pct.textContent = Math.round(flowScale * 100) + '%'; pct.classList.toggle('auto', flowAuto); }
}
/* 端まで送りすぎて見失わないよう、必ず一部は画面内に残す */
function clampPan(){
  const fv = fvBox(), w = flowL.w * flowScale, h = flowL.h * flowScale, k = FZ.keep;
  flowTx = Math.min(fv.clientWidth - Math.min(k, w), Math.max(Math.min(k, w) - w, flowTx));
  flowTy = Math.min(fv.clientHeight - Math.min(k, h), Math.max(Math.min(k, h) - h, flowTy));
}
function flowFitScale(){
  const fv = fvBox();
  return Math.max(FZ.min, Math.min(1, (fv.clientWidth - 52) / flowL.w));
}
/* ユースケースの説明は凡例の下に置く（凡例は帳票の切替が増えて 2 段になることがある） */
function placeNote(){
  const leg = document.querySelector('.fleg'), note = document.querySelector('.fcnote');
  if (leg && note) note.style.top = (leg.offsetHeight + 20) + 'px';
}
/* 幅に合わせて、凡例（と説明）の下に置き直す */
function fitFlow(){
  if (!flowL) return;
  const fv = fvBox(), leg = document.querySelector('.fleg'), note = document.querySelector('.fcnote');
  flowAuto = true;
  placeNote();
  flowScale = flowFitScale();
  flowTx = Math.max(26, (fv.clientWidth - flowL.w * flowScale) / 2);
  flowTy = (leg ? leg.offsetHeight : 20) + (note && !note.hidden ? note.offsetHeight + 8 : 0) + 26;
  paintFlowScale();
}
/* カーソルの下の点を動かさずに倍率を変える */
function zoomFlow(next, cx, cy){
  if (!flowL) return;
  const fv = fvBox(), r = fv.getBoundingClientRect();
  const prev = flowScale, sc = Math.max(FZ.min, Math.min(FZ.max, next));
  if (Math.abs(sc - prev) < .0005) return;
  const mx = (cx - r.left - flowTx) / prev, my = (cy - r.top - flowTy) / prev;
  flowAuto = false; flowScale = sc;
  flowTx = cx - r.left - mx * sc;
  flowTy = cy - r.top - my * sc;
  clampPan(); paintFlowScale();
}
function panFlow(dx, dy){
  if (!flowL) return;
  flowAuto = false; flowTx += dx; flowTy += dy; clampPan(); paintFlowScale();
}
/* キーボードで辿ったノードが画面の外なら、見える所まで寄せる */
function showNode(id){
  if (!flowL) return;
  const fv = fvBox(), p = flowL.pos[id]; if (!p) return;
  const x = p.x * flowScale + flowTx, y = p.y * flowScale + flowTy;
  const w = FNODE.w * flowScale, h = FNODE.h * flowScale, m = 24;
  let dx = 0, dy = 0;
  if (x < m) dx = m - x; else if (x + w > fv.clientWidth - m) dx = fv.clientWidth - m - (x + w);
  if (y < m) dy = m - y; else if (y + h > fv.clientHeight - m) dy = fv.clientHeight - m - (y + h);
  if (dx || dy) panFlow(dx, dy);
}

const fvEl = document.getElementById('flowview');
/* ⌘＋ホイール／ピンチで拡大縮小。修飾なしは上下、shift は左右に移動 */
fvEl.addEventListener('wheel', e => {
  if (view !== 'flow' || !flowL) return;
  if (e.target.closest('.fclist')) return;   /* ユースケースの一覧の中はその一覧をスクロールする */
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){ zoomFlow(flowScale * Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY); return; }
  if (e.shiftKey) panFlow(-(e.deltaY || e.deltaX), 0);
  else panFlow(-e.deltaX, -e.deltaY);
}, {passive:false});
/* 何もない所をつかんで動かす。中ボタンならノードの上からでも動かせる */
fvEl.addEventListener('pointerdown', e => {
  /* 上の操作板と凡例バーの中は掴まない（切替やユースケースが押せなくなるため） */
  if (view !== 'flow' || !flowL || e.target.closest('.fzoom, .fleg')) return;
  if (e.button === 0 && e.target.closest('.fnode')) return;
  if (e.button !== 0 && e.button !== 1) return;
  e.preventDefault();
  let px = e.clientX, py = e.clientY;
  fvEl.classList.add('grab');
  try{ fvEl.setPointerCapture(e.pointerId); }catch(err){}
  const mv = ev => { panFlow(ev.clientX - px, ev.clientY - py); px = ev.clientX; py = ev.clientY; };
  const up = () => {
    fvEl.classList.remove('grab');
    fvEl.removeEventListener('pointermove', mv);
    fvEl.removeEventListener('pointerup', up);
    fvEl.removeEventListener('pointercancel', up);
  };
  fvEl.addEventListener('pointermove', mv);
  fvEl.addEventListener('pointerup', up);
  fvEl.addEventListener('pointercancel', up);
});
/* 窓やパネルの幅が変わったとき。自分で動かしていたら、その見え方を保つ */
if (window.ResizeObserver) new ResizeObserver(() => {
  if (view !== 'flow' || !flowL) return;
  if (flowAuto) fitFlow(); else { clampPan(); paintFlowScale(); }
}).observe(document.getElementById('flowview'));

    </ul></div>
    <div class="hsec"><h4>他のプロジェクトで使う</h4><ul class="steps">
      <li>この HTML を複製して、先頭の <code>PROJECT</code> を書き換える（資料名・関連資料・端末の枡）。</li>
      <li><code>SCREENS</code> に画面を並べる。並べた順がそのまま左の一覧と ← → の順番になります。</li>
      <li>プロトタイプがまだ無ければ <code>PROJECT.demo</code> を <code>null</code> に。枠に案内が出るだけで、他の機能はそのまま使えます。</li>
      <li>現行システムの調査資料が無ければ <code>PROJECT.asIs</code> を <code>null</code> に。右パネルの「現行では」が消えます。</li>
      <li>画面のつながりは <code>FLOW</code> に <code>['A0','A1','ログイン']</code> の形で書く。位置は自動で決まるので、書き足すだけで図が変わります。空なら「フロー」に案内が出ます。</li>
      <li>決まったことは <code>SCREENS</code> の <code>decide</code> に足します。<code>[問い, なぜ, 決めたこと, 日付]</code> の3つ目を書いた時点で「決まったこと」へ移り、決めることの一覧から消えます。<b>開発中の「なぜこうなったか」はここが答えになります</b>。</li>
      <li>「前提」の中身は <code>PERSONAS</code>（利用者）<code>SCALE</code>（規模）<code>ROLES</code>・<code>ACCESS</code>・<code>CRUD</code>（権限）<code>APPROVAL</code>（承認経路）<code>AUDIT</code>（操作ログ）<code>TERMS</code>（用語）。<code>CASES</code> がユースケースです（<code>STATES</code> は記録の一生。いまフローには出していません）。</li>
      <li>項目定義は <code>FIELDS</code>、プロトタイプで動く範囲は <code>BUILT</code> に画面IDごとに書きます。</li>
      <li>色と書き方の決まりは <code>NQrepo/src/index.css</code>（値）と <code>NQrepoDesignSystem</code>（デザインガイド）にあります。プロトタイプの <code>:root</code> はその写しです。</li>
      <li>画面を直したら <code>LOG</code> に1行足す。日付順に並び、その日に直した画面には左の一覧で緑の点が付きます。</li>
    </ul></div>`);
}
/* 使い方は「?」キーで開く（ヘッダー右上のボタンは 2026-09-25 に外した） */

/* ---------- 左右パネルの開け閉めと幅 ---------- */
const ROOT = document.documentElement;
/* 最小・最大と、中央に必ず残す幅 */
/* 止まる位置。下限は「畳まずに読める幅」。ドラッグはここで止まり、閉じない */
const LIM = {rail:[210,460], insp:[300,620], flow:[320,900], stage:320};
const VAR = {rail:'--wRail', insp:'--wInsp', flow:'--wFlow'};
const paneW = which => {
  const el = document.querySelector(which==='rail' ? '.rail' : which==='flow' ? '.stage' : '.insp');
  return el ? Math.round(el.getBoundingClientRect().width) : 0;
};
/* 右のつまみは、フロー表示ではプロトタイプの幅を動かす（同じ場所にある別の列なので） */
const sideOf = g => (g.dataset.side === 'insp' && view === 'flow') ? 'flow' : g.dataset.side;
/* 幅を決める。反対側と中央の取り分を先に確保してから収める */
function setWidth(which, px, save){
  const [lo, hi] = LIM[which];
  const other = which==='rail' ? 'insp' : 'rail';
  const room = innerWidth - paneW(other) - LIM.stage;
  const w = Math.round(Math.min(Math.max(px, lo), Math.max(lo, Math.min(hi, room))));
  ROOT.style.setProperty(VAR[which], w + 'px');
  if (save !== false) LS.set('w-' + which, w);
  return w;
}
/* 左パネルのたたみ。たたむと 54px の帯になり、マウスを乗せている間だけ元の幅にせり出す */
const railEl = document.querySelector('.rail');
const tgRail = document.getElementById('tgRail');
function setRail(on){
  document.body.dataset.rail = on ? '1' : '0';
  LS.set('rail', on ? 1 : 0);
  closeFly();
  tgRail.setAttribute('aria-expanded', String(on));
  tgRail.title = on ? '左パネルをたたむ（[）' : '左パネルを開く（[）';
  tgRail.setAttribute('aria-label', on ? '左パネルをたたむ' : '左パネルを開く');
  applyFit();
  buildRail();   /* 帯では両方の端末を並べ、開いたらタブの絞り込みに戻す */
}
tgRail.onclick = () => setRail(document.body.dataset.rail === '0');

/* ---------- たたんだ帯のフライアウト ----------
   カテゴリのアイコンに乗せると、そのカテゴリの画面だけを右に出す。
   隙間を通るあいだに消えないよう、離してから少し待って閉じる */
let fly = null, flyTimer = null, flyGrp = '';
const mini = () => document.body.dataset.rail === '0' && !narrow();
function closeFly(){ if (fly){ fly.remove(); fly = null; flyGrp = ''; } }
function hideFly(){ clearTimeout(flyTimer); flyTimer = setTimeout(closeFly, 110); }
function openFly(sec){
  const g = sec.querySelector('[data-g]')?.dataset.g; if (!g) return;
  clearTimeout(flyTimer);
  if (fly && flyGrp === g) return;                  /* 同じカテゴリなら出し直さない */
  closeFly();
  const list = SCREENS.filter(s => s.grp === g && railHit(s));
  if (!list.length) return;
  fly = document.createElement('div');
  fly.className = 'fly';
  fly.innerHTML = `<div class="fh">${groupIcon(g)}<span>${esc(g)}</span></div>
    <div class="slist">${treeHTML(list, true)}</div>`;
  document.body.appendChild(fly);
  flyGrp = g;
  /* カテゴリの行に頭を合わせ、下がはみ出すときだけ上へ詰める */
  const r = sec.getBoundingClientRect();
  fly.style.left = Math.round(railEl.getBoundingClientRect().right + 6) + 'px';
  fly.style.top  = Math.round(Math.max(10, Math.min(r.top, innerHeight - fly.offsetHeight - 10))) + 'px';
  fly.querySelectorAll('[data-s]').forEach(b => b.onclick = rowClick(b, closeFly));
  fly.addEventListener('mouseenter', () => clearTimeout(flyTimer));
  fly.addEventListener('mouseleave', hideFly);
}
window.addEventListener('resize', closeFly);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFly(); });

/* 覚えている幅を戻す。狭い画面では画面幅の決まりに任せる */
function applyWidths(){
  if (narrow()){ ROOT.style.removeProperty(VAR.rail); ROOT.style.removeProperty(VAR.insp); return; }
  ['rail','insp','flow'].forEach(k => { const v = LS.get('w-'+k, 0); if (v) setWidth(k, v, false); });
}

/* つまみ：ドラッグで幅を変える。矢印キーでも動かせる。閉じる操作は持たない */
document.querySelectorAll('.grip').forEach(g => {
  g.addEventListener('pointerdown', e => {
    if (narrow() || e.button) return;
    e.preventDefault();
    const side = sideOf(g);
    const put = w => setWidth(side, w);      /* 下限で止まる。閉じない */
    /* たたんだ帯のつまみを掴んだら、まず開いてから幅を変える */
    if (side === 'rail' && document.body.dataset.rail === '0') setRail(true);
    const x0 = e.clientX, w0 = paneW(side);
    try{ g.setPointerCapture(e.pointerId); }catch(err){}   /* 取れなくてもドラッグは続ける */
    g.classList.add('on'); document.body.classList.add('drag');
    const move = ev => put(side==='rail' ? w0 + (ev.clientX - x0) : w0 - (ev.clientX - x0));
    const up = () => {
      g.classList.remove('on'); document.body.classList.remove('drag');
      g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', up);
      g.removeEventListener('pointercancel', up);
      applyFit();
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up);
    g.addEventListener('pointercancel', up);
  });
  g.addEventListener('keydown', e => {
    if (narrow()) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      e.preventDefault(); e.stopPropagation();
      const side = sideOf(g);
      const d = (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 48 : 16);
      setWidth(side, paneW(side) + (side==='rail' ? d : -d));
      applyFit();
    }
  });
});

/* 枠と中身の大きさを差し替える。読み込み直さないのでプロトタイプの状態は消えない */
function setSize(w, h){
  const pf = cur.pf, d = PROJECT.platforms[pf]; if (!d) return;
  const [mnw, mnh] = d.min || [240,360], [mxw, mxh] = d.max || [2000,1400];
  w = Math.round(Math.min(Math.max(w || d.w, mnw), mxw));
  h = Math.round(Math.min(Math.max(h || d.h, mnh), mxh));
  if (w === d.w && h === d.h) delete ovs()[pf]; else ovs()[pf] = [w, h];
  LS.set('size', ovs());
  const fit = document.getElementById('fit');
  /* 比べているときは2枚とも同じ大きさにする */
  fit.querySelectorAll('iframe.live, iframe.snap').forEach(f => { f.style.width = w + 'px'; f.style.height = h + 'px'; });
  fit.querySelectorAll('.phone, .browser').forEach(box => {
    if (box.classList.contains('phone')){ box.style.width = (w+22) + 'px'; box.style.height = (h+22) + 'px'; }
    else box.style.width = w + 'px';
  });
  applyFit();
  paintSize();
}

/* 「状態」の ? で出す、それぞれの状態の説明。

/* ---------- 変更の前後を並べる（更新履歴から） ----------

const SNAP_DIR = PROJECT.snapDir || '';

let cmpB = '', cmpA = '', cmpKey = '';   /* 変更前の控え／変更後の控え（空＝いま）／押した行（画面ID:番号） */
let snapWant = '';       /* 右（変更前）に出してほしい hash（左の現在地） */
let liveWant = '';       /* 左（変更後の控え）に頼んで、まだ返事の来ていない hash */
const snapOf = f => f ? SNAPS.find(x => x.file === f) : null;
const cmpOn = () => !!snapOf(cmpB);
const snapWhen = x => `${+x.date.slice(5, 7)}/${+x.date.slice(8, 10)}${x.time ? ' ' + x.time : ''}`;
const SNAP_KIND = {daily:'その日の最初の変更の前', take:'手で取った控え', git:'コミットの時点'};
const snapDesc = x => x.name || SNAP_KIND[x.kind] || '';
const snapKey = x => `${x.date} ${x.time || '00:00'}`;
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
/* 更新履歴の1行（日付 d・時刻 tm は任意）の、変更前と変更後の控え。
   時刻あり：前＝その時刻までで最後の控え、後＝その時刻より後で最初の控え（無ければ いま）
   時刻なし：前＝その日の朝の控え（daily）、無ければ前の日までで最後のもの
             後＝次に直した日の朝の控え（＝その日の終わりの状態）、無ければその日の日中の控え（take・git）のうち最後、
                 それも無ければその後で最初の控え。今日の行は いま（今日の変更がまだ続くため）
   前が無い行（控えを取り始める前）と、前と後が同じ控えになる行は並べられない */
function pairFor(d, tm){
  if (!SNAPS.length) return null;
  const rev = [...SNAPS].reverse();
  let b, a;
  if (tm){
    const k = `${d} ${tm}`;
    b = rev.find(x => snapKey(x) <= k);
    a = SNAPS.find(x => snapKey(x) > k);
  } else {
    b = SNAPS.find(x => x.date === d && x.kind === 'daily') || rev.find(x => x.date < d);
    a = d >= todayStr() ? null
      : SNAPS.find(x => x.date > d && x.kind === 'daily') || rev.find(x => x.date === d && x.kind !== 'daily') || SNAPS.find(x => x.date > d);
  }
  if (!b || (a && a.file === b.file)) return null;
  return {b:b.file, a:a ? a.file : ''};
}
/* いまの中央が、並べる設定どおりか（違えば作り直す） */
function cmpMatches(){
  const sn = document.querySelector('#fit iframe.snap'), lv = document.querySelector('#fit iframe.live');
  if (!(cmpOn() && cur.hash)) return !sn;
  return !!sn && sn.dataset.file === cmpB && !!lv && (lv.dataset.file || '') === cmpA;
}
function snapSrc(s, x){
  const q = new URLSearchParams({frame:'1', ...stateFlags(s)});
  return `${SNAP_DIR}/${encodeURIComponent(x.file)}?${q}#${s.hash}`;
}
function compareHTML(s){
  const b = snapOf(cmpB), a = snapOf(cmpA);
  const head = (x, side, lb) => `<b>${lb} ${esc(snapWhen(x))}</b><span class="cn">${esc(snapDesc(x))}</span>
      <span class="cmpnote" hidden></span>`;
  /* 左＝変更後（操作する側）、右＝変更前（左の後を追う） */
  return `<div class="cmp">
    <div class="cmpcol"><div class="cmph now">${a ? head(a, 'now', '変更後') : '<b>いま</b><span class="cmpnote" hidden></span>'}
      <button type="button" class="cmpoff" data-cmpoff title="並べるのをやめて、いまの画面だけにする">並べるのをやめる</button></div>
      ${a ? frameHTML(s, {src:snapSrc(s, a), file:a.file, title:`${s.name}（${snapWhen(a)} の控え）`}) : frameHTML(s)}</div>
    <div class="cmpcol"><div class="cmph old">${head(b, 'old', '変更前')}</div>
      ${frameHTML(s, {cls:'snap', src:snapSrc(s, b), file:b.file, title:`${s.name}（${snapWhen(b)} の控え）`})}</div>
  </div>`;
}
/* 右（変更前）へ hash を送る。読み込み中なら覚えておき、読めたところで送る */
function toSnap(hash){
  if (hash) snapWant = hash;
  const sn = document.querySelector('#fit iframe.snap');
  if (!sn || !sn.dataset.ready || !snapWant) return;
  sn.contentWindow.postMessage({nvideo:'go', hash:snapWant, flags:stateFlags(cur)}, '*');
}
/* 頼んだ画面と違う画面が出た＝その時点にはまだ無かった画面。見出しに印を出し、無ければ true */
function markMiss(side, want, got){
  const note = document.querySelector(`#fit .cmph.${side} .cmpnote`); if (!note) return false;
  const idOf = h => ((HASH2ID_AUTO.find(([re]) => re.test(h)) || HASH2ID.find(([re]) => re.test(h))) || [])[1] || '';
  const w = idOf(want), g = idOf(got), miss = !!w && g !== w;
  note.hidden = !miss;
  if (miss) note.textContent = g && IDX[g] ? `この時点には無い画面（${g} ${IDX[g].name} が出ています）` : 'この時点には無い画面';
  return miss;
}
/* 並べる／やめる。id を渡すとその画面へ移ってから並べる */
function setPair(pr, id){
  cmpB = pr && snapOf(pr.b) ? pr.b : '';
  cmpA = cmpB && pr.a && snapOf(pr.a) ? pr.a : '';
  cmpKey = cmpB ? pr.key || '' : '';
  if (id && id !== cur.id) go(id);   /* go() が並びの違いを見て作り直す */
  else { buildFrame(cur); renderInsp(); }
}

/* 控えの一覧は <script> で読む。file:// で開いても読めるよう、JSON ではなく JS にしてある */
function loadSnaps(){
  if (!SNAP_DIR || !DEMO_HREF) return;
  const sc = document.createElement('script');
  sc.src = `${SNAP_DIR}/index.js?v=${DEMO_V}`;
  sc.onload = () => { SNAPS = (window.SNAPSHOTS || []).filter(x => x && x.file && x.date); if (inspView === 'log') renderInsp(); };

}

  const tag = document.activeElement?.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==='ArrowRight' || e.key==='j') step(1);

});

   全画面のフィードバックを新しい順に並べる。React（FeedbackWidget）と同じオリジンなので、
   保存先の localStorage（nq_feedback_v1）を直に読み書きする。枠の中の React には storage イベントで伝わる。
   形は React の src/components/feedback/feedbackStore.ts と同じ（番号の振り方・ステータスの値も合わせる） */
const FBM_KEY = 'nq_feedback_v1';

function fbmLoad(){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem(FBM_KEY) || '[]'); }catch(e){}
  if (!Array.isArray(list)) return [];
  const old = [...list].sort((a, b) => a.createdAt - b.createdAt);
  let next = old.reduce((m, e) => Math.max(m, typeof e.no === 'number' ? e.no : 0), 0);
  const no = new Map(old.map(e => [e.id, typeof e.no === 'number' ? e.no : ++next]));
  return list.map(e => Object.assign({}, e, {no:no.get(e.id), status: FB_STATUS[e.status] ? e.status : 'open', comments: Array.isArray(e.comments) ? e.comments : []}));
}

            <div class="ft"><span class="who">${esc([fbmCo(x.company), x.author, fbmTime(x.createdAt)].filter(Boolean).join(' '))}</span>
              <select data-fbmset="${esc(x.id)}" aria-label="対応状況を変える">${Object.entries(FB_STATUS).map(([k, v]) => `<option value="${k}"${x.status === k ? ' selected' : ''}>${v[0]}</option>`).join('')}</select>
              <button type="button" class="fbx del" data-fbmdel="${esc(x.id)}" title="削除する" aria-label="削除する">${FB_TRASH}</button></div></li>`;
        }).join('')}</ul>`}
    </div></div>`;
  box.querySelectorAll('[data-fbmst]').forEach(b => b.onclick = () => { FBM.status = b.dataset.fbmst; renderFbManage(); });
  box.querySelectorAll('[data-fbmkd]').forEach(b => b.onclick = () => { FBM.kind = b.dataset.fbmkd; renderFbManage(); });
  const qi = box.querySelector('#fbmQ');
  qi.oninput = () => { FBM.q = qi.value; renderFbManage(); };
  if (keep){ qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  box.querySelectorAll('[data-fbmgo]').forEach(b => b.onclick = () => { setView('screen'); go(b.dataset.fbmgo); });
  const edit = (id, f) => { let raw = []; try{ raw = JSON.parse(localStorage.getItem(FBM_KEY) || '[]'); }catch(e){} fbmSave(f(raw, id)); renderFbManage(); };
  box.querySelectorAll('[data-fbmset]').forEach(sel => sel.onchange = () =>
    edit(sel.dataset.fbmset, (raw, id) => raw.map(e => e.id === id ? Object.assign({}, e, {status:sel.value, updatedAt:Date.now()}) : e)));
  box.querySelectorAll('[data-fbmdel]').forEach(b => b.onclick = () => {
    if (confirm('このフィードバックを削除しますか？')) edit(b.dataset.fbmdel, (raw, id) => raw.filter(e => e.id !== id));
  });
}
/* 枠の中（React）で書いた・直したときも一覧を合わせる */
window.addEventListener('storage', e => { if (e.key === FBM_KEY && view === 'feedback') renderFbManage(); });

/* ---------- 起動 ---------- */
const rawHash = () => { try{ return decodeURIComponent(location.hash.replace(/^#/, '')); }catch(e){ return ''; } };
const hashId = () => rawHash().toUpperCase();
const isFlowHash = () => rawHash().toLowerCase() === 'flow';
const isRefHash  = () => rawHash().toLowerCase() === 'ref';
const isRelHash  = () => rawHash().toLowerCase() === 'release';
const isFbmHash  = () => rawHash().toLowerCase() === 'feedback';
window.addEventListener('hashchange', () => {
  if (hashLock) return;
  if (isFlowHash()){ setView('flow', {fromHash:true}); return; }
  if (isRefHash()){ setView('ref', {fromHash:true}); return; }
  if (isRelHash()){ setView('release', {fromHash:true}); return; }
  if (isFbmHash()){ setView('feedback', {fromHash:true}); return; }
  const id = hashId();
  if (!IDX[id]) return;
  if (view !== 'screen') setView('screen', {fromHash:true});
  if (id !== cur.id) go(id, {fromHash:true});
});
/* プロトタイプの右下「資料 › 画面設計」から戻ってきたとき：?role=…&state=…#admin/approvals/… の形。
   hash は画面IDではなくプロトタイプの画面なので、対応する画面IDを開き、枠にはその画面そのものを映す */
function takeReturn(){
  const q = new URLSearchParams(location.search), h = rawHash();
  if (q.get('role') && ROLE_LIST.some(r => r.key === q.get('role'))){ curRole = q.get('role'); LS.set('role', curRole); paintRole(); }
  if (q.has('state') && (PROJECT.screenStates || []).some(x => x.key === q.get('state'))) curState = q.get('state');
  let id = '';
  if (!IDX[hashId()] && /^(admin|app)(\/|$)/.test(h)){
    const hit = HASH2ID_AUTO.find(([re]) => re.test(h)) || HASH2ID.find(([re]) => re.test(h));
    if (hit){ id = hit[1]; bootLoc = h; }
  }
  if (location.search || id){ try{ history.replaceState(null, '', location.pathname + '#' + (id || rawHash())); }catch(e){} }
}
takeReturn();
pickDemo().then(() => {
  go(IDX[hashId()] ? hashId() : SCREENS[0].id, {fromHash:true});
  setView(isFlowHash() ? 'flow' : isRefHash() ? 'ref' : isRelHash() ? 'release' : isFbmHash() ? 'feedback' : 'screen', {fromHash:true});
  /* 起動時に hash が無ければ、いまの画面を書いておく（次のリロードで戻れる） */
  if (!IDX[hashId()] && !isFlowHash() && !isRefHash() && !isRelHash() && !isFbmHash()){ try{ history.replaceState(null, '', '#' + cur.id); }catch(e){} }
});
