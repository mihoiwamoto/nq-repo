  /* same のある画面は、枠に同じ画面が映る別の画面の説明を使う（帳票管理の M5-n → M5-n-1 の工場選択） */
  const ds = s.same && IDX[s.same] || s;
  const sub = dispText(noSrc(ds.sub)), note = dispText(noSrc(ds.note));
  /* React の画面説明（SCREEN_DESC）。概要を手で書いていない画面は、その summary を概要にする */
  const rd = SCREEN_DESC[ds.src];
  /* Confluence の画面仕様書から起こした概要（⑧-4 OVERVIEW）があれば、ひとことをそれに替え、本文を足す。
     手で書いた note（開発のいきさつ）はその後ろに残す */
  const ov = OVERVIEW[ds.id];
  const lead = sub || note ? [sub, note] : [rd?.summary, ''];
  if (ov?.lead) lead[0] = ov.lead;
  /* できることは React の画面上の説明（動作デモ › 画面説明）と同じ文。資料とアプリの説明を 1 か所で持つ。
     2026-10-01 から番号つきの節にせず、画面概要の中にアイコン付きの小見出しで入れる。補足（note）も箇条書きの 1 項目にする */
  /* solo の画面は、できること・補足を画面概要の箇条書きにまとめてあるので、それだけを出す（2026-10-01。データ検索のデータ一覧） */
  const solo = !!ov?.solo;
  /* merged の画面は、できることを画面概要の箇条書きにまとめ直してあるので出さない（補足は残す。2026-10-01） */
  const can = solo || ov?.merged ? [] : [...(rd?.points || []), ...(rd?.note ? rd.note.split(/(?<=。)/).map(x => x.trim()).filter(Boolean) : [])];
  if (lead[0] || lead[1] || ov?.body?.length || can.length){
    h += `<div class="sec"><h4>画面概要</h4>`;
    /* 2026-10-01 から画面概要は箇条書き 1 つで出す。ひとこと（lead）・本文（OVERVIEW の body）・手書きの note（文ごとに分ける）を並べ、
       ほかの項目の頭と同じだけの項目（「承認・コメント。」と「承認・コメントが動く。」のような重なり）は短い方を落とす */
    const sents = x => dispText(x || '').split(/(?<=。)/).map(y => y.trim()).filter(Boolean);
    const bodyList = ov?.body?.length ? ov.body.map(p => dispText(p)) : [];
    /* React の画面説明の箇条書き（元の「この画面でできること」）も、見出しを付けずに同じ箇条書きに入れる */
    const canBody = can;
    const noteList = lead[1] && !solo && !bodyList.length ? sents(lead[1]) : [];
    const key = x => x.replace(/[。．、\s]/g, '');
    /* after は箇条書きのいちばん後ろに足す行（React の画面説明の後ろに書き足したいとき。2026-10-01） */
    /* 新規と編集で同じ React の画面説明（「登録」または「保存」で確定）を使っているので、画面に合うボタンの名前だけにする（2026-10-01）。
       予定の登録（登録済みの日は「保存」）のように「削除」も書いてある文はそのまま */
    const btn = x => /「登録」または「保存」で確定/.test(x) && !/「削除」/.test(x) && !/予定/.test(s.name)
      ? x.replace('「登録」または「保存」', /編集$/.test(s.name) ? '「保存」' : /新規登録$/.test(s.name) ? '「登録」' : '「登録」または「保存」') : x;
    const all = [...(lead[0] ? [dispText(lead[0])] : []), ...bodyList, ...canBody, ...noteList, ...(ov?.after || []).map(x => dispText(x))].map(btn);
    const bul = all.filter((x, i) => !all.some((y, j) => j !== i && key(y) !== key(x) && key(y).startsWith(key(x))) && all.findIndex(y => key(y) === key(x)) === i);
    if (bul.length) h += `<ul class="bul ovbul">${bul.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    /* 注釈（OVERVIEW の notice。箇条書きの下に ※ で出す。2026-10-01） */
    if (ov?.notice) h += `<div class="ovnotice">${[].concat(ov.notice).map(x => `<p>※ ${esc(dispText(x))}</p>`).join('')}</div>`;
    /* 手書きの note（作りのいきさつ）は、要約した本文があるときは畳んでおく（2026-10-01。概要を短く見せるため） */
    if (lead[1] && !solo && bodyList.length) h += `<details class="ovmore"><summary>補足</summary><p class="lead ovnote">${esc(dispText(lead[1]))}</p></details>`;
    /* 元の Confluence ページへのリンクは出さない（2026-09-30。OVERVIEW の pages は取り直し用に残す） */
    /* 「この画面でできること」の見出しは 2026-10-01 に全画面で外した（中身は上の箇条書きに入っている） */
    h += `</div>`;
  }
  /* 管理画面の画面は、誰が使えるかを ACCESS から出す（実施者は管理画面に入らないので外す）。2026-10-01 から画面概要のすぐ下 */
  const acc = /^M/.test(s.id) && ACCESS[s.id];
  if (acc){
    const cols = ROLE_COLS.filter(i => i > 0);
    h += `<div class="sec"><h4>誰が使えるか</h4><div class="whocan" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map(i => {
      const v = acc[i] || '－';
      return `<div class="${v === '○' ? 'ok' : v === '△' ? 'mid' : ''}">${esc(ROLES[i].name)}${v === '○' ? '<i class="o" aria-label="○"></i>' : `<i>${v === '△' ? '△' : '—'}</i>`}</div>`;
    }).join('')}</div>${acc[ROLES.length] ? `<p class="whonote">${esc(acc[ROLES.length])}</p>` : ''}</div>`;
  }
  /* UI遷移仕様（2026-10-01 まで「項目定義」。画面概要・誰が使えるか の下に置く）。名前だけでは実装に入れないので、型と条件まで出す。
     手で書いた FIELDS を先に使い、無い画面は SPEC（React のコードから起こしたもの）を使う。
     画面の部分ごとに分けて出す（FPART・fpartOf） */
  const sp = SPEC[s.id] || {};
  const fl = FIELDS[s.id] || sp.fields || [];
  /* 2026-10-01 から、入力する／表示する で分けず、画面の部分（画面上部・絞り込み・表・入力欄・ダイアログ …）ごとに分ける。
     部分は fpartOf が項目の形式と説明の文から決める。外れるときは項目の行の 6 つ目に部分の名前（FPART のキー）を書く */
  const items = fItemsOf(s);
  if (items.length){
    const hasFrame = !!opLive();
    const found = n => !(opScan && opScanKey.startsWith(s.id + '|')) || !!opScan[n]?.els.length;
    const li = (it, n, inner) => `<li class="opi${it.kind === 'o' ? ' fop' : ''}${opActive === n ? ' on' : ''}" data-op="${n}" tabindex="0" role="button" aria-pressed="${opActive === n}"
        title="枠の中の画面でこの場所を赤枠で出す">
        <span class="opno${found(n) ? '' : ' miss'}" data-opno="${n}" aria-pressed="${opActive === n || (opAll && found(n))}" aria-hidden="true">${it.no}</span>
        <div class="opb">${inner}<span class="opmiss" ${opActive === n && !found(n) ? '' : 'hidden'}>中央の画面の中で場所を示せませんでした（押したあとに出るもの・条件で出るもの・文字の無いアイコンなど）</span></div></li>`;
    const fRow = ([nm, t, r, sp]) => `<div class="fl1"><span class="fnm">${esc(nm)}</span><span class="fty">${esc(t)}</span>${r && r !== '—' ? `<span class="frq${r === '必須' ? ' must' : ''}">${esc(r)}</span>` : ''}</div>
        ${sp ? `<p class="fsp">${esc(dispText(sp))}</p>` : ''}`;
    const oRow = ([op, when, res, to]) => `<div class="fl1"><span class="fnm">${esc(op)}</span><span class="fty op">操作</span></div>
        ${when ? `<p class="fwhen">${esc(dispText(when))}</p>` : ''}
        ${res ? `<p class="fsp">${esc(dispText(res))}</p>` : ''}
        ${to && IDX[to] ? `<button type="button" class="fto" data-go="${esc(to)}">→ ${esc(dispId(to))} ${esc(IDX[to].name)}</button>` : ''}`;
    /* 項目と操作をまとめたもの。項目の行の下に、操作の名前（札つき）と結果・遷移先を続ける */
    const foRow = it => fRow(it.row) + `<div class="fl1 fopl"><span class="fty op">操作</span><span class="fopn">${esc(it.op[0])}</span></div>
        ${it.op[1] ? `<p class="fwhen">${esc(dispText(it.op[1]))}</p>` : ''}
        ${it.op[2] ? `<p class="fsp">${esc(dispText(it.op[2]))}</p>` : ''}
        ${it.op[3] && IDX[it.op[3]] ? `<button type="button" class="fto" data-go="${esc(it.op[3])}">→ ${esc(dispId(it.op[3]))} ${esc(IDX[it.op[3]].name)}</button>` : ''}`;
    h += `<div class="sec" id="fsec"><h4>UI遷移仕様${hasFrame ? `<button type="button" class="opall" data-opall aria-pressed="${opAll}" title="${opAll ? '番号を消す' : '中央の画面に、すべての番号を赤枠で出す'}">すべて</button>` : ''}</h4>`;
    /* 部分へ飛ぶチップ（.fparts）は 2026-10-01 に外した */
    /* 部分の名前は枠の上に出し、ひとこと（FPART の 2 つ目）は出さない（2026-10-01） */
    /* 並び（fItemsOf）のとおり、続けて同じ部分のものを 1 つのまとまりにする */
    const blocks = [];
    items.forEach((it, n) => { const b = blocks[blocks.length - 1]; if (b && b.k === it.part) b.ns.push(n); else blocks.push({k: it.part, ns: [n]}); });
    const bcnt = ns => { const a = ns.filter(n => items[n].kind !== 'o').length, b = ns.length - a;
      return [a && `${a} 項目`, b && `${b} 操作`].filter(Boolean).join('・'); };
    h += blocks.map(({k, ns}, bi) => `<div class="fgw" data-fgrp="${esc(k)}">
      <div class="fgh" data-fsec="${bi}" data-ns="${ns.join(',')}" role="button" tabindex="0" aria-pressed="${opSec === bi}" title="中央の画面で、この部分をまとめて赤枠で囲む"><span class="fgi" aria-hidden="true"><svg viewBox="0 0 16 16">${FPART[k][0]}</svg></span>${esc(k)}<span class="fgn">${bcnt(ns)}</span></div>
      <div class="fgrp"><ul class="fli">${ns.map(n => { const it = items[n]; return li(it, n, it.kind === 'o' ? oRow(it.row) : it.kind === 'fo' ? foRow(it) : fRow(it.row)); }).join('')}</ul></div></div>`).join('');
    if (hasFrame) h += `<p class="opnote">項目や操作を押すと、中央の画面にその場所を赤枠で出します。部分の見出し（画面上部・一覧（表） など）を押すと、その部分をまとめて囲みます。もう一度押すと消えます。見出しの「すべて」で全部の番号を出します。番号が点線のものは場所を示せません</p>`;
    h += `</div>`;
  }
  /* URL は同じでも、上にポップアップが出て別の画面に見えるとき（実施者の選択など） */
  if (rd?.states?.length){
    h += `<div class="sec"><h4>ポップアップが出たとき</h4>${rd.states.map(st => `<div class="rdpop">
      <b>${esc(st.label)}</b><p>${esc(st.summary)}</p>
      ${st.points?.length ? `<ul class="bul">${st.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${st.note ? `<p class="rdnote">${esc(st.note)}</p>` : ''}</div>`).join('')}</div>`;
  }
  /* 決まったことは残す。開発中の「なぜこうなったか」はここを見れば足りる。
     decide は [問い, なぜ, 決めたこと, 日付]。3つ目が入ったら決定済みとして上に出す */
  const decided = (s.decide || []).filter(d => d[2]);
  const pending = pendingDecide(s);
  if (decided.length){
    h += `<div class="sec"><h4>決まったこと</h4><ul class="alist">${
      decided.map(([q, why, ans, date]) => `<li>
        <span class="ans">${esc(dispText(ans))}</span>
        <span class="aq">${esc(dispText(q.replace(/^★\s*/,'')))}${date ? `<span class="adt">${esc(date)}</span>` : ''}</span>
        ${why ? `<span class="why">${esc(dispText(why))}</span>` : ''}</li>`).join('')}</ul></div>`;
  }
  /* 決めることは読みものより先。打合せ中いちばん見る場所をスクロールの奥に置かない */
  if (pending.length){
    h += `<div class="sec work"><h4>この打合せで決めること</h4><ol class="qlist">${
      pending.map(([q, why], i)=>{
        const key = /^★/.test(q);
        return `<li${key?' class="key"':''}><span class="no">${i+1}</span>
        <span class="qt">${key?'<span class="tag">重点</span>':''}<span class="q">${esc(dispText(q.replace(/^★\s*/,'')))}</span>
        ${why?`<span class="why">${esc(dispText(why))}</span>`:''}</span></li>`;
      }).join('')}</ol></div>`;
  }
  if (s.open) h += `<div class="sec"><h4>資料の未確定事項</h4><p class="undec">${esc(dispText(s.open))}</p></div>`;
  /* 画面のつながり。フロー図と同じ線（帳票の枝はその帳票の、骨組みの画面はフローで選んでいる帳票の線）から出す */
  const ln = ledgerNo(s.id) || flowLedger, ed = ledgerFlow(ln);
  const link = (id, lb, back) => IDX[id] ? `<li><button type="button" class="cnx" data-go="${esc(id)}" title="${esc(IDX[id].name)}">
      <span class="id">${esc(dispId(id))}</span><span class="nm">${esc(IDX[id].name)}</span>
      ${lb || back ? `<span class="lb">${esc(lb || '戻る')}</span>` : ''}</button></li>` : '';
  const uniq = xs => xs.filter((x, i) => xs.findIndex(y => y[0] === x[0]) === i);
  const from = uniq(ed.filter(e => e[1] === s.id && e[0] !== s.id).map(([a,, l, k]) => [a, l, k === 'back']));
  const to   = uniq(ed.filter(e => e[0] === s.id && e[1] !== s.id).map(([, b, l, k]) => [b, l, k === 'back']));
  if (from.length || to.length){
    h += `<div class="sec"><h4>画面のつながり</h4>`;
    if (from.length) h += `<p class="cnxh">この画面の前</p><ul class="cnxl">${from.map(x => link(...x)).join('')}</ul>`;
    /* 骨組みの画面から帳票の枝へ進む線は、選んでいる帳票の画面名ではなく「帳票を選ぶ」とだけ出す（どの帳票へも進めるため） */
    const toBranch = ([id, lb]) => !ledgerNo(s.id) && ledgerNo(id)
      ? `<li><span class="cnx txt"><span class="nm">${esc(lb || '帳票を選ぶ')}</span></span></li>` : link(id, lb);
    if (to.length)   h += `<p class="cnxh">この画面の後</p><ul class="cnxl">${to.map(x => x[2] ? link(...x) : toBranch(x)).join('')}</ul>`;
    h += `</div>`;
  }
  /* この画面を通るユースケース。押すとフローでその経路を濃く出す */
  const cs = CASE_LIST.filter(c => c.n === ln && c.path.includes(s.id));
  if (cs.length) h += `<div class="sec"><h4>この画面を通るユースケース</h4><ul class="cnxl">${cs.map(c =>
    `<li><button type="button" class="cnx case" data-case="${esc(c.key)}" title="フローでこの経路を見る">
      <span class="nm">${esc(c.name)}</span><span class="lb">フローで見る</span></button></li>`).join('')}</ul>
    ${ledgerNo(s.id) ? '' : `<p class="cnxnote">帳票をまたぐ画面なので、フローで選んでいる帳票（${esc(FLOW_LEDGERS[ln - 1][1])}）の経路を出しています</p>`}</div>`;
  /* プロトタイプでどこまで動くか。触れるぶん「動く＝できている」と読まれやすい */
  const bt = BUILT[s.id];
  if (bt) h += `<div class="sec"><h4>プロトタイプで動く範囲</h4>
    <p class="built b-${bt[0] === '動く' ? 'ok' : bt[0] === '一部' ? 'half' : 'no'}">
      <b>${esc(bt[0])}</b>${esc(dispText(bt[1]))}</p></div>`;

  /* 現行システムの調査資料が無いプロジェクトでは、この節ごと出さない */
  if (PROJECT.asIs){
    const asIsName = PROJECT.asIs.title || '現行システム';
    const ai = AS_IS[s.id];
    h += `<div class="sec"><h4>${esc(asIsName)}では</h4>`;
    if (ai && ai[0]){
      h += `<a class="xlink" href="${esc(xhref(SURVEY_HREF, ai[0]))}">
        <span class="xi">現行</span>
        <span class="xt"><span class="xn">${esc(ai[1])}</span><span class="xs">${esc(ai[2])}</span></span>
        <span class="xa">↗</span></a>`;
    } else {
      h += `<p class="xnone"><b>${esc(NEW_ONLY[s.id]||'この画面')}</b> は${esc(asIsName)}に相当する画面がありません。今回の新規機能です。</p>`;
    }
    h += `</div>`;
  }

  return h + `</div>`;
}

/* 更新履歴の表示。この画面ぶんと資料全体を、上の切替で行き来する */
function logHTML(){
  const s = cur, lg = logOf(s.id), rows = allLog();
  const seg = (k, lb, n) => `<button type="button" class="segb" data-scope="${k}" aria-pressed="${logScope===k}">
    <span class="lb">${lb}</span><span class="n">${n}</span></button>`;
  let h = `<div class="ih">
    <div class="r1"><span class="id">${dispId(s.id)}</span>${vswHTML('log')}</div>
    <h3 class="hback"><button type="button" class="bk" data-spec title="この画面の仕様に戻る" aria-label="この画面の仕様に戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>更新履歴</h3>
    <div class="seg">${seg('screen', `${dispId(s.id)} ${esc(s.name)}`, lg.length)}${seg('all', '資料全体', rows.length)}</div>
    ${SNAPS.length && DEMO_HREF ? `<p class="lhint">「前後を見る」の付いた行を押すと、その変更の前と後の画面が中央に並びます。
      控えは ${esc(snapWhen(SNAPS[0]).split(' ')[0])} から。それより前の行は並べられません</p>` : ''}
  </div><div class="ib">`;

  if (logScope === 'screen'){
    h += `<div class="sec">${lg.length
      ? `<ul class="hist">${lg.map(([d,t,tm],i)=>
          `<li><span class="hd">${d.slice(5).replace('-','/')}</span>${logPick(d, tm, s.id, i, `<span class="ht">${esc(t)}</span>`)}</li>`).join('')}</ul>`
      : `<p class="xnone">この画面はまだ直していません。<b>LOG</b> に1行足すとここに出ます。</p>`}</div>`;
  } else {
    const days = [...new Set(rows.map(r=>r.d))];
    h += days.map(d=>`<div class="logday">
      <div class="dt">${d.replace(/-/g,'/')}</div>
      <ul>${rows.filter(r=>r.d===d).map(r=>`<li>
        ${r.id ? `<button class="who" type="button" data-go="${r.id}" title="${esc(IDX[r.id]?.name||'')}">${dispId(r.id)}</button>`
               : `<span class="who doc">資料</span>`}
        ${logPick(r.d, r.tm, r.id, r.i, `<span class="tx">${esc(r.t)}</span>`)}</li>`).join('')}</ul></div>`).join('');
  }
  return h + `</div>`;
}
/* 更新履歴の1行。前後の控えがそろう行は押せる（押すと中央に 変更後｜変更前 が横に並ぶ）。
   資料全体の行は仕様側の変更が多く、プロトタイプを並べても差が出ないので押せなくしてある */
function logPick(d, tm, id, i, inner){
  const pr = id && IDX[id] && IDX[id].hash && DEMO_HREF ? pairFor(d, tm) : null;
  if (!pr) return inner;
  const key = `${id}:${i}`, on = cmpKey === key, b = snapOf(pr.b), a = snapOf(pr.a);
  return `<button type="button" class="lpick${on ? ' on' : ''}" aria-pressed="${on}" data-pick="${esc(key)}"
      data-pb="${esc(pr.b)}" data-pa="${esc(pr.a)}" data-cid="${esc(id)}"
      title="${esc(`変更前 ${snapWhen(b)} ／ 変更後 ${a ? snapWhen(a) : 'いま'}`)}">
    ${inner}<span class="lchip">${on ? '表示中' : '前後を見る'}</span></button>`;
}

/* =========================================================================
   フロー（画面の遷移図）
   列は「入口からいちばん遠い距離」で決める。戻り線は数えない。
   行はグループごとのレーン。位置は自動なので、FLOW を直せば図も直る。
   ========================================================================= */
const FNODE = {w:176, h:54, gx:92, gy:14, pad:26, top:22, lanePad:34, laneGap:16};

/* ---- 帳票ごとのフロー ------------------------------------------------------
   帳票の枝（M2-n・M3-n・M4-n・M5-n・A1-n。n は帳票の番号で、1 が使用水の点検）は
   10 帳票ぶんあるので、選んだ 1 帳票だけを図に出す。骨組み（M0〜M14・A0〜A7）は共通。
   使用水（n=1）のつながりは FLOW に手で書いてあるのでそのまま使う。

/* 帳票管理（M5-n）とアプリ（A1-n）の枝のつながり。戻り道（修正する・一覧へ）も足す */

/* 使用水の画面の「役どころ」。他の帳票は画面の並びが違うので、同じ役どころを画面名から探す */

/* 図の材料。出すのは画面の遷移だけ（記録の状態の図は 2026-09-25 に凡例の切替ごと外した） */

/* ユースケース 6 本 × 10 帳票。帳票ごとに画面が違うので、経路は帳票ごとに作り直す */

const CASE_LIST = caseList();

/* 台本の印。終わった操作に ✓、いまの操作に色、止めている間は次にする行に「次の操作」。進み具合も合わせる */
function playMark(P){
  const note = document.querySelector('#fwrap .fcnote'), ol = note?.querySelector('.pscript'); if (!ol) return;
  const done = (k, j) => k < P.k || (k === P.k && (j < P.j || (j === P.j && !P.busy && !P.up)));
  ol.querySelectorAll('.psk').forEach(li => {
    const k = +li.dataset.k; li.classList.toggle('done', k < P.k); li.classList.toggle('now', k === P.k);
    li.querySelectorAll('li[data-j]').forEach(x => { const j = +x.dataset.j, up = !!P.up && P.up[0] === k && P.up[1] === j;
      x.classList.toggle('done', !up && done(k, j));
      x.classList.toggle('now', P.busy && k === P.k && j === P.j);
      x.classList.toggle('up', !P.busy && P.paused && up); });
  });
  const now = ol.querySelector('li[data-j].now') || ol.querySelector('li[data-j].up') || ol.querySelector('.psk.now');
  if (now){ const y = now.offsetTop; if (y < ol.scrollTop + 4 || y > ol.scrollTop + ol.clientHeight - 36) ol.scrollTop = Math.max(0, y - 40); }
  const total = P.acts.reduce((s, x) => s + x.length, 0);
  let fin = 0; P.acts.forEach((x, k) => x.forEach((_, j) => { if (done(k, j)) fin++; }));
  const bar = note.querySelector('.pbar'), i = bar?.querySelector('.ptrack i'), t = bar?.querySelector('.pnum');
  if (i) i.style.width = (total ? fin / total * 100 : 0) + '%';

function playCap(t){ const cap = document.querySelector('#fwrap .fcnote .pcap'); if (cap){ cap.hidden = false; cap.textContent = t; placeNote(); } }

  if (PLAY !== P) return false;
  if (P.paused && P.next) P.next--;

function playRate(d){

document.addEventListener('keydown', e => {

async function playCase(key, from){
  stopPlay(); const c = caseOf(key); if (!c || narrow()) return;
  const path = casePath(c); if (!path.length) return;

  const P = PLAY = {key, k:0, j:-1, paused:false, busy:false, hurry:false, next:0, up:null, tok:'p' + Date.now(), acts:caseActs(c, path),

  if (c.state || playState){ curState = c.state; playState = !!c.state; }

  const inp = box.querySelector('.fcin'); if (!inp) return;
  const wrap = box.querySelector('.fcbox'), list = box.querySelector('.fclist'), clr = box.querySelector('.fcclr');
  let items = [], act = -1, typed = false;   /* typed = 開いてから字を打ったか。打つまでは入っている名前で絞らない */
  const close = () => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); act = -1; typed = false; };
  const mark = () => {
    list.querySelectorAll('.fci').forEach((b, i) => {
      const on = i === act; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on));
      if (on) b.scrollIntoView({block:'nearest'});
    });
  };
  const draw = () => {
    const q = typed ? inp.value.trim().toLowerCase() : '';
    /* 帳票名・ユースケース名・説明のどれかに当たれば出す。いま見ている帳票を先に並べる */
    /* 打っていなければ、いま見ている帳票のユースケースだけを見出し（CASE_GROUPS）ごとに。
       打ったら、帳票名・ユースケース名・説明のどれかに当たるものを全帳票から出す（他の帳票のものは帳票名を添える） */
    const hit = CASE_LIST.filter(c => q ? (c.ledger + ' ' + c.name + ' ' + c.note).toLowerCase().includes(q) : c.n === flowLedger);
    const ord = g => { const i = CASE_GROUPS.indexOf(g); return i < 0 ? CASE_GROUPS.length : i; };
    items = [null, ...hit.map((c, i) => [c, i]).sort((x, y) =>
      (x[0].n !== flowLedger) - (y[0].n !== flowLedger) || ord(x[0].grp) - ord(y[0].grp) || x[1] - y[1]).map(x => x[0])];
    const ck = '<svg class="ck" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const row = (c, i) => `<button type="button" class="fci" role="option" aria-selected="false" aria-checked="${c ? c.key === flowCase : !flowCase}"
      data-key="${c ? c.key : ''}" data-i="${i}">${ck}<span class="tx"><b>${esc(c ? c.name : 'すべて')}</b>${c && c.n !== flowLedger ? `<span>${esc(c.ledger)}</span>` : ''}</span></button>`;
    let html = '<p class="fct">ユースケースで線を絞る</p>' + row(null, 0), last = null;
    items.forEach((c, i) => {
      if (!c) return;
      if (c.grp !== last){ html += `<div class="fcg">${esc(c.grp || 'その他')}</div>`; last = c.grp; }
      html += row(c, i);
    });
    if (q && items.length === 1) html += '<p class="fcempty">当てはまるユースケースがありません</p>';
    list.innerHTML = html;
    list.hidden = false; inp.setAttribute('aria-expanded', 'true');
    /* 画面の右端からはみ出すときは左へずらす（狭い画面では入力欄が右寄りになる） */
    list.style.left = '0px';
    const over = list.getBoundingClientRect().right - (fvBox().getBoundingClientRect().right - 10);
    if (over > 0) list.style.left = `${-over}px`;
    act = items.findIndex(c => c ? c.key === flowCase : !flowCase); mark();
  };
  /* 選んでいても、開けば全部が出る。名前は選んだ状態にしておくので、打てばそのまま検索に替わる */
  inp.addEventListener('focus', () => { typed = false; draw(); inp.select(); });
  inp.addEventListener('input', () => { typed = true; act = -1; draw(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (list.hidden) return draw();
      if (!items.length) return;
      const down = e.key === 'ArrowDown';
      act = act < 0 ? (down ? 0 : items.length - 1) : (act + (down ? 1 : items.length - 1)) % items.length;
      mark();
    } else if (e.key === 'Enter'){
      e.preventDefault();
      if (act >= 0 && act < items.length){ const c = items[act]; close(); inp.blur(); c ? goCase(c.key) : pickCase(null); }
    } else if (e.key === 'Escape'){
      e.preventDefault(); close(); inp.value = (caseOf(flowCase) || {}).name || ''; inp.blur();
    }
  });
  /* 押した瞬間に入力欄から焦点が外れないよう mousedown で拾う */
  list.addEventListener('mousedown', e => {
    const b = e.target.closest('.fci'); if (!b) return;
    e.preventDefault(); close(); inp.blur(); b.dataset.key ? goCase(b.dataset.key) : pickCase(null);
  });
  wrap.addEventListener('focusout', e => {
    if (wrap.contains(e.relatedTarget)) return;
    close(); inp.value = (caseOf(flowCase) || {}).name || '';
  });
  if (clr) clr.onclick = () => { inp.value = ''; pickCase(null); close(); };
  /* 山形。開いていれば閉じ、閉じていれば入力欄に焦点を移して一覧を開く（mousedown で拾い、焦点が外れて閉じるのを防ぐ） */
  const dd = wrap.querySelector('.fcdd');
  if (dd) dd.addEventListener('mousedown', e => {
    e.preventDefault();
    if (!list.hidden){ close(); inp.blur(); return; }
    typed = false; inp.focus(); draw();   /* 窓に焦点が無いと focus が来ないので、ここでも開く */
  });
}

/* つながりだけ残して、他を薄くする */
function focusNode(id){
  const box = document.getElementById('fwrap');
  box.classList.toggle('focus', !!id);
  box.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
  if (!id) return;
  const near = new Set([id]);
  box.querySelectorAll('.fsvg [data-a]').forEach(e => {
    if (e.dataset.a === id || e.dataset.b === id){
      e.classList.add('on');
      if (e.dataset.a) near.add(e.dataset.a);
      if (e.dataset.b) near.add(e.dataset.b);
    }
  });
  box.querySelectorAll('.fnode').forEach(n => { if (near.has(n.dataset.go)) n.classList.add('on'); });
}

/* ---------- 地図の拡大縮小と移動（Figma と同じ操作感） ----------
   地図そのものを動かす方式。スクロール量に頼らないので、幅に収まっていても必ず動く。
   ⌘（トラックパッドはピンチ）＋ホイールで拡大縮小、ホイールで上下、shift＋ホイールで左右、
   何もない所をつかんで移動。自分で動かしたら、幅に合わせる動きは止める */
let flowL = null, flowScale = 1, flowTx = 0, flowTy = 0, flowAuto = true;
const FZ = {min:.3, max:2, keep:150};   /* keep = 画面内に必ず残す地図の量 */

function fvBox(){ return document.getElementById('flowview'); }
function paintFlowScale(){
  const map = document.getElementById('fmap');
  if (!flowL || !map) return;
  map.style.transform = `translate(${Math.round(flowTx)}px, ${Math.round(flowTy)}px) scale(${flowScale})`;
  const pct = document.querySelector('.fzoom .pct');
  if (pct){ pct.textContent = Math.round(flowScale * 100) + '%'; pct.classList.toggle('auto', flowAuto); }
}
/* 端まで送りすぎて見失わないよう、必ず一部は画面内に残す */
function clampPan(){
  const fv = fvBox(), w = flowL.w * flowScale, h = flowL.h * flowScale, k = FZ.keep;
  flowTx = Math.min(fv.clientWidth - Math.min(k, w), Math.max(Math.min(k, w) - w, flowTx));
  flowTy = Math.min(fv.clientHeight - Math.min(k, h), Math.max(Math.min(k, h) - h, flowTy));
}
function flowFitScale(){
  const fv = fvBox();
  return Math.max(FZ.min, Math.min(1, (fv.clientWidth - 52) / flowL.w));
}
/* ユースケースの説明は凡例の下に置く（凡例は帳票の切替が増えて 2 段になることがある） */
function placeNote(){
  const leg = document.querySelector('.fleg'), note = document.querySelector('.fcnote');
  if (leg && note) note.style.top = (leg.offsetHeight + 20) + 'px';
}
/* 幅に合わせて、凡例（と説明）の下に置き直す。ユースケースを選んでいるときは、その経路の画面が収まるまで拡大する */
function fitFlow(){
  if (!flowL) return;
  const fv = fvBox(), leg = document.querySelector('.fleg'), note = document.querySelector('.fcnote');
  flowAuto = true;
  placeNote();
  if (fitCase(fv, leg, note)) return;
  flowScale = flowFitScale();
  flowTx = Math.max(26, (fv.clientWidth - flowL.w * flowScale) / 2);
  flowTy = (leg ? leg.offsetHeight : 20) + (note && !note.hidden ? note.offsetHeight + 8 : 0) + 26;
  paintFlowScale();
}
/* ユースケースの経路（画面と、その間の線）が凡例と説明の下にちょうど収まる倍率と位置にする。
   経路が短いときに拡大しすぎないよう、上限は 1.4 倍 */
function fitCase(fv, leg, note){
  const c = flowCase && caseOf(flowCase);
  const ps = c ? c.path.map(id => flowL.pos[id]).filter(Boolean) : [];
  if (!ps.length) return false;
  const m = 36, top = (leg ? leg.offsetHeight : 20) + (note && !note.hidden ? note.offsetHeight + 8 : 0) + 30;
  const x0 = Math.min(...ps.map(p => p.x)), x1 = Math.max(...ps.map(p => p.x + FNODE.w));
  /* 戻り線は下を回るので、その分（18px＋字）を下に足す */
  const y0 = Math.min(...ps.map(p => p.y)), y1 = Math.max(...ps.map(p => p.y + FNODE.h)) + 34;
  const aw = fv.clientWidth - m * 2, ah = fv.clientHeight - top - m;
  flowScale = Math.max(FZ.min, Math.min(1.4, aw / (x1 - x0), ah / (y1 - y0)));
  flowTx = m + (aw - (x1 - x0) * flowScale) / 2 - x0 * flowScale;
  flowTy = top + Math.max(0, (ah - (y1 - y0) * flowScale) / 2) - y0 * flowScale;
  paintFlowScale();
  return true;
}
/* 経路へ滑らかに寄る（手で動かしているときの追従は遅れると気持ち悪いので、選んだときだけ） */
function glideFit(){
  const map = document.getElementById('fmap');
  if (!map) { fitFlow(); return; }
  map.classList.add('glide');
  fitFlow();
  clearTimeout(glideFit.t);
  glideFit.t = setTimeout(() => map.classList.remove('glide'), 480);
}
/* カーソルの下の点を動かさずに倍率を変える */
function zoomFlow(next, cx, cy){
  if (!flowL) return;
  const fv = fvBox(), r = fv.getBoundingClientRect();
  const prev = flowScale, sc = Math.max(FZ.min, Math.min(FZ.max, next));
  if (Math.abs(sc - prev) < .0005) return;
  const mx = (cx - r.left - flowTx) / prev, my = (cy - r.top - flowTy) / prev;
  flowAuto = false; flowScale = sc;
  flowTx = cx - r.left - mx * sc;
  flowTy = cy - r.top - my * sc;
  clampPan(); paintFlowScale();
}
function panFlow(dx, dy){
  if (!flowL) return;
  flowAuto = false; flowTx += dx; flowTy += dy; clampPan(); paintFlowScale();
}
/* キーボードで辿ったノードが画面の外なら、見える所まで寄せる */
function showNode(id){
  if (!flowL) return;
  const fv = fvBox(), p = flowL.pos[id]; if (!p) return;
  const x = p.x * flowScale + flowTx, y = p.y * flowScale + flowTy;
  const w = FNODE.w * flowScale, h = FNODE.h * flowScale, m = 24;
  let dx = 0, dy = 0;
  if (x < m) dx = m - x; else if (x + w > fv.clientWidth - m) dx = fv.clientWidth - m - (x + w);
  if (y < m) dy = m - y; else if (y + h > fv.clientHeight - m) dy = fv.clientHeight - m - (y + h);
  if (dx || dy) panFlow(dx, dy);
}

const fvEl = document.getElementById('flowview');
/* ⌘＋ホイール／ピンチで拡大縮小。修飾なしは上下、shift は左右に移動 */
fvEl.addEventListener('wheel', e => {
  if (view !== 'flow' || !flowL) return;
  if (e.target.closest('.fclist,.nqmenu')) return;   /* ユースケースの一覧の中はその一覧をスクロールする */
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){ zoomFlow(flowScale * Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY); return; }
  if (e.shiftKey) panFlow(-(e.deltaY || e.deltaX), 0);
  else panFlow(-e.deltaX, -e.deltaY);
}, {passive:false});
/* 何もない所をつかんで動かす。中ボタンならノードの上からでも動かせる */
fvEl.addEventListener('pointerdown', e => {
  /* 上の操作板と凡例バーの中は掴まない（切替やユースケースが押せなくなるため） */
  if (view !== 'flow' || !flowL || e.target.closest('.fzoom, .fleg, .fcnote')) return;
  if (e.button === 0 && e.target.closest('.fnode')) return;
  if (e.button !== 0 && e.button !== 1) return;
  e.preventDefault();
  let px = e.clientX, py = e.clientY;
  fvEl.classList.add('grab');
  try{ fvEl.setPointerCapture(e.pointerId); }catch(err){}
  const mv = ev => { panFlow(ev.clientX - px, ev.clientY - py); px = ev.clientX; py = ev.clientY; };
  const up = () => {
    fvEl.classList.remove('grab');
    fvEl.removeEventListener('pointermove', mv);
    fvEl.removeEventListener('pointerup', up);
    fvEl.removeEventListener('pointercancel', up);
  };
  fvEl.addEventListener('pointermove', mv);
  fvEl.addEventListener('pointerup', up);
  fvEl.addEventListener('pointercancel', up);
});
/* 窓やパネルの幅が変わったとき。自分で動かしていたら、その見え方を保つ */
if (window.ResizeObserver) new ResizeObserver(() => {
  if (view !== 'flow' || !flowL) return;
  if (flowAuto) fitFlow(); else { clampPan(); paintFlowScale(); }
}).observe(document.getElementById('flowview'));

/* 前提・リリースの左のメニュー。押すと右の本文をその節へ送り、読んでいる節を濃くする */
function docNav(box){
  const main = box.querySelector('.docmain'), links = [...box.querySelectorAll('.docside [data-jump]')];
  const scroller = () => getComputedStyle(main).overflowY === 'visible' ? box : main;   /* 狭い画面は積み上げで box ごと動く */
  const mark = id => links.forEach(a => a.setAttribute('aria-current', String(a.dataset.jump === id)));
  let hold = 0;
  box.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => {   /* 左のメニューのほか、リリースの道のりからも飛ぶ */
    e.preventDefault();
    const t = document.getElementById(a.dataset.jump), sc = scroller();
    if (!t) return;
    hold = Date.now() + 400;   /* 送った直後のスクロールで印が動かないように（下のほうの Ver は一番下で止まるため） */
    sc.scrollTop += t.getBoundingClientRect().top - sc.getBoundingClientRect().top - 16;
    mark(a.dataset.jump);
    t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
  });
  const spy = () => {
    if (Date.now() < hold) return;
    const sc = scroller(), top = sc.getBoundingClientRect().top + 80;
    let id = links[0] && links[0].dataset.jump;
    links.forEach(a => { const t = document.getElementById(a.dataset.jump); if (t && t.getBoundingClientRect().top <= top) id = a.dataset.jump; });
    if (sc.scrollTop > 0 && sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2 && links.length) id = links[links.length - 1].dataset.jump;   /* いちばん下まで来たら最後の節 */
    mark(id);
  };
  main.addEventListener('scroll', spy, {passive:true});
  box.addEventListener('scroll', spy, {passive:true});
  requestAnimationFrame(spy);
}

/* 詳細 ／ フロー ／ 前提 の切り替え */
let view = 'screen';
function setView(v, opt){
  if (v !== 'flow') stopPlay();   /* フロー図から離れたら再生は止める */
  view = v;
  document.body.dataset.view = v;
  closeFly();
  document.getElementById('flowview').hidden = v !== 'flow';

/* ---------- 左右パネルの開け閉めと幅 ---------- */
const ROOT = document.documentElement;
/* 最小・最大と、中央に必ず残す幅 */
/* 止まる位置。下限は「畳まずに読める幅」。ドラッグはここで止まり、閉じない */
/* フローのプロトタイプの幅は上限を置かず、左のフロー図が 240px 残るところまで自由に動かせる（2026-10-02） */
const LIM = {rail:[210,460], insp:[300,620], flow:[240,Infinity], stage:320, map:240};
const VAR = {rail:'--wRail', insp:'--wInsp', flow:'--wFlow'};
const paneW = which => {
  const el = document.querySelector(which==='rail' ? '.rail' : which==='flow' ? '.stage' : '.insp');
  return el ? Math.round(el.getBoundingClientRect().width) : 0;
};
/* 右のつまみは、フロー表示ではプロトタイプの幅を動かす（同じ場所にある別の列なので） */
const sideOf = g => (g.dataset.side === 'insp' && view === 'flow') ? 'flow' : g.dataset.side;
/* 幅を決める。反対側と中央の取り分を先に確保してから収める */
function setWidth(which, px, save){
  const [lo, hi] = LIM[which];
  const other = which==='rail' ? 'insp' : 'rail';
  const room = innerWidth - paneW(other) - (which==='flow' ? LIM.map : LIM.stage);
  const w = Math.round(Math.min(Math.max(px, lo), Math.max(lo, Math.min(hi, room))));
  ROOT.style.setProperty(VAR[which], w + 'px');
  if (save !== false) LS.set('w-' + which, w);
  return w;
}

/* ---------- たたんだ帯のフライアウト ----------
   カテゴリのアイコンに乗せると、そのカテゴリの画面だけを右に出す。
   隙間を通るあいだに消えないよう、離してから少し待って閉じる */
let fly = null, flyTimer = null, flyGrp = '';
const mini = () => document.body.dataset.rail === '0' && !narrow();
function closeFly(){ if (fly){ fly.remove(); fly = null; flyGrp = ''; } }
function hideFly(){ clearTimeout(flyTimer); flyTimer = setTimeout(closeFly, 110); }
function openFly(sec){
  const g = sec.querySelector('[data-g]')?.dataset.g; if (!g) return;
  clearTimeout(flyTimer);

  if (narrow()){ ROOT.style.removeProperty(VAR.rail); ROOT.style.removeProperty(VAR.insp); return; }

/* つまみ：ドラッグで幅を変える。矢印キーでも動かせる。閉じる操作は持たない */
document.querySelectorAll('.grip').forEach(g => {
  g.addEventListener('pointerdown', e => {
    if (narrow() || e.button) return;
    e.preventDefault();
    const side = sideOf(g);
    const put = w => setWidth(side, w);      /* 下限で止まる。閉じない */
    /* たたんだ帯のつまみを掴んだら、まず開いてから幅を変える */
    if (side === 'rail' && document.body.dataset.rail === '0') setRail(true);
    const x0 = e.clientX, w0 = paneW(side);
    try{ g.setPointerCapture(e.pointerId); }catch(err){}   /* 取れなくてもドラッグは続ける */
    g.classList.add('on'); document.body.classList.add('drag');
    /* 離したのを取りこぼすと body.drag が残り、枠（.live）が押せないままになる（2026-10-02）。
       ボタンが離れた move・捕まえ直し損ね・窓の外で離した・タブを離れた、のどれでも終える */
    const move = ev => { if (!ev.buttons){ up(); return; } put(side==='rail' ? w0 + (ev.clientX - x0) : w0 - (ev.clientX - x0)); };
    const evs = [[g, 'pointermove', move], [g, 'pointerup'], [g, 'pointercancel'], [g, 'lostpointercapture'],
                 [window, 'pointerup'], [window, 'blur']];
    let done = false;
    function up(){
      if (done) return; done = true;
      g.classList.remove('on'); document.body.classList.remove('drag');
      evs.forEach(([t, n, f]) => t.removeEventListener(n, f || up));
      applyFit();
    }
    evs.forEach(([t, n, f]) => t.addEventListener(n, f || up));
  });
  g.addEventListener('keydown', e => {
    if (narrow()) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      e.preventDefault(); e.stopPropagation();
      const side = sideOf(g);
      const d = (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 48 : 16);
      setWidth(side, paneW(side) + (side==='rail' ? d : -d));
      applyFit();
    }
  });
});

/* ---------- 変更の前後を並べる（更新履歴から） ----------
   控えは .claude/snapshot.py がプロトタイプを丸ごとコピーしたもの（snapshots/）。同じ約束（?frame=1・go・loc）で
   動くので、iframe を2枚置いて同じ hash を送れば「その時点の同じ画面」が並ぶ。
   更新履歴の行を押すと、左に変更後（その後の控えが無ければ いま）・右に変更前を横に並べて出す。
   操作するのは左。右は左の後を追う。右パネルの説明も左を追う */
const SNAP_DIR = PROJECT.snapDir || '';
let SNAPS = [];          /* snapshots/index.js の window.SNAPSHOTS。古い順 */
let cmpB = '', cmpA = '', cmpKey = '';   /* 変更前の控え／変更後の控え（空＝いま）／押した行（画面ID:番号） */
let snapWant = '';       /* 右（変更前）に出してほしい hash（左の現在地） */
let liveWant = '';       /* 左（変更後の控え）に頼んで、まだ返事の来ていない hash */
const snapOf = f => f ? SNAPS.find(x => x.file === f) : null;
const cmpOn = () => !!snapOf(cmpB);
const snapWhen = x => `${+x.date.slice(5, 7)}/${+x.date.slice(8, 10)}${x.time ? ' ' + x.time : ''}`;
const SNAP_KIND = {daily:'その日の最初の変更の前', take:'手で取った控え', git:'コミットの時点'};
const snapDesc = x => x.name || SNAP_KIND[x.kind] || '';
const snapKey = x => `${x.date} ${x.time || '00:00'}`;
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
/* 更新履歴の1行（日付 d・時刻 tm は任意）の、変更前と変更後の控え。
   時刻あり：前＝その時刻までで最後の控え、後＝その時刻より後で最初の控え（無ければ いま）
   時刻なし：前＝その日の朝の控え（daily）、無ければ前の日までで最後のもの
             後＝次に直した日の朝の控え（＝その日の終わりの状態）、無ければその日の日中の控え（take・git）のうち最後、
                 それも無ければその後で最初の控え。今日の行は いま（今日の変更がまだ続くため）
   前が無い行（控えを取り始める前）と、前と後が同じ控えになる行は並べられない */
function pairFor(d, tm){
  if (!SNAPS.length) return null;
  const rev = [...SNAPS].reverse();
  let b, a;
  if (tm){
    const k = `${d} ${tm}`;
    b = rev.find(x => snapKey(x) <= k);
    a = SNAPS.find(x => snapKey(x) > k);
  } else {
    b = SNAPS.find(x => x.date === d && x.kind === 'daily') || rev.find(x => x.date < d);
    a = d >= todayStr() ? null
      : SNAPS.find(x => x.date > d && x.kind === 'daily') || rev.find(x => x.date === d && x.kind !== 'daily') || SNAPS.find(x => x.date > d);
  }
  if (!b || (a && a.file === b.file)) return null;
  return {b:b.file, a:a ? a.file : ''};
}
/* いまの中央が、並べる設定どおりか（違えば作り直す） */
function cmpMatches(){
  const sn = document.querySelector('#fit iframe.snap'), lv = document.querySelector('#fit iframe.live');
  if (!(cmpOn() && cur.hash)) return !sn;
  return !!sn && sn.dataset.file === cmpB && !!lv && (lv.dataset.file || '') === cmpA;
}
function snapSrc(s, x){
  const q = new URLSearchParams({frame:'1', ...stateFlags(s)});
  return `${SNAP_DIR}/${encodeURIComponent(x.file)}?${q}#${s.hash}`;
}
function compareHTML(s){
  const b = snapOf(cmpB), a = snapOf(cmpA);
  const head = (x, side, lb) => `<b>${lb} ${esc(snapWhen(x))}</b><span class="cn">${esc(snapDesc(x))}</span>
      <span class="cmpnote" hidden></span>`;
  /* 左＝変更後（操作する側）、右＝変更前（左の後を追う） */
  return `<div class="cmp">
    <div class="cmpcol"><div class="cmph now">${a ? head(a, 'now', '変更後') : '<b>いま</b><span class="cmpnote" hidden></span>'}
      <button type="button" class="cmpoff" data-cmpoff title="並べるのをやめて、いまの画面だけにする">並べるのをやめる</button></div>
      ${a ? frameHTML(s, {src:snapSrc(s, a), file:a.file, title:`${s.name}（${snapWhen(a)} の控え）`}) : frameHTML(s)}</div>
    <div class="cmpcol"><div class="cmph old">${head(b, 'old', '変更前')}</div>
      ${frameHTML(s, {cls:'snap', src:snapSrc(s, b), file:b.file, title:`${s.name}（${snapWhen(b)} の控え）`})}</div>
  </div>`;
}
/* 右（変更前）へ hash を送る。読み込み中なら覚えておき、読めたところで送る */
function toSnap(hash){
  if (hash) snapWant = hash;
  const sn = document.querySelector('#fit iframe.snap');
  if (!sn || !sn.dataset.ready || !snapWant) return;
  sn.contentWindow.postMessage({nvideo:'go', hash:snapWant, flags:stateFlags(cur)}, '*');
}
/* 頼んだ画面と違う画面が出た＝その時点にはまだ無かった画面。見出しに印を出し、無ければ true */
function markMiss(side, want, got){
  const note = document.querySelector(`#fit .cmph.${side} .cmpnote`); if (!note) return false;
  const idOf = h => ((HASH2ID_AUTO.find(([re]) => re.test(h)) || HASH2ID.find(([re]) => re.test(h))) || [])[1] || '';
  const w = idOf(want), g = idOf(got), miss = !!w && g !== w;
  note.hidden = !miss;
  if (miss) note.textContent = g && IDX[g] ? `この時点には無い画面（${g} ${IDX[g].name} が出ています）` : 'この時点には無い画面';
  return miss;
}
/* 並べる／やめる。id を渡すとその画面へ移ってから並べる */
function setPair(pr, id){
  cmpB = pr && snapOf(pr.b) ? pr.b : '';
  cmpA = cmpB && pr.a && snapOf(pr.a) ? pr.a : '';
  cmpKey = cmpB ? pr.key || '' : '';
  if (id && id !== cur.id) go(id);   /* go() が並びの違いを見て作り直す */
  else { buildFrame(cur); renderInsp(); }
}

/* 控えの一覧は <script> で読む。file:// で開いても読めるよう、JSON ではなく JS にしてある */
function loadSnaps(){
  if (!SNAP_DIR || !DEMO_HREF) return;
  const sc = document.createElement('script');

  sc.onerror = () => { SNAPS = []; };

}

/* ---------- リリース（開発 Ver）の表示 ----------
   前提と同じ器。左のメニューに Ver、右に Ver ごとの節を新しい順に書き、追加した帳票から画面設計へ飛べる */
function renderRelease(){

  const STC = {'予定':'', 'デザイン中':'design', '開発中':'dev', 'リリース済み':'done'};
  const relId = v => 'rel-' + v.replace(/[^0-9]/g, '-');

const FBM_KEY = 'nq_feedback_v1';

  const no = new Map(old.map(e => [e.id, typeof e.no === 'number' ? e.no : ++next]));
  return list.map(e => Object.assign({}, e, {no:no.get(e.id), status: FB_STATUS[e.status] ? e.status : FB_STATUS_OLD[e.status] || 'open', comments: Array.isArray(e.comments) ? e.comments : []}));

const fbmCo = k => (FB_COMPANY.find(c => c[0] === k) || [])[1] || '';

const fbmScreen = path => { const h = (path || '').replace(/^\//, ''); return ((HASH2ID_AUTO.find(([re]) => re.test(h)) || HASH2ID.find(([re]) => re.test(h))) || [])[1] || ''; };
/* プルダウン（React の Pulldown と同じ見た目）。opts は [値, 表示, 点の色?]。fbmPdBind で選んだときの処理をつなぐ */

}
function fbmPdClose(pd, focus){
  if (!pd || !pd.classList.contains('open')) return;

  const t = pd.querySelector('.fbmpd-t'), m = pd.querySelector('.fbmpd-m'), items = () => [...m.querySelectorAll('[role=option]')];
  const open = () => {

    pd.classList.add('open'); m.hidden = false; t.setAttribute('aria-expanded', 'true');

const fbmLs = (k, v) => { try{ if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); }catch(e){} return ''; };
function fbmEdit(id, f){
  let raw = []; try{ raw = JSON.parse(localStorage.getItem(FBM_KEY) || '[]'); }catch(e){}
  fbmSave(raw.map(e => e.id === id ? f(e) : e));
}
function fbmOpen(id){
  FBM_DLG.id = id; FBM_DLG.draft = ''; FBM_DLG.author = '';   /* 名前は開くたびに空欄から */
  let dlg = document.getElementById('fbmDlg');
  if (!dlg){
    dlg = document.createElement('dialog'); dlg.id = 'fbmDlg'; dlg.className = 'fbmdlg';
    dlg.setAttribute('aria-labelledby', 'fbmDlgT');
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });   /* 外側（暗いところ）を押すと閉じる */
    dlg.addEventListener('close', () => { FBM_DLG.id = null; });
    document.body.appendChild(dlg);
  }
  fbmPaintDlg(true);
  if (!dlg.open) dlg.showModal();
  dlg.querySelector('#fbmRe').focus();
}
function fbmPaintDlg(scrollEnd){
  const dlg = document.getElementById('fbmDlg'); if (!dlg) return;
  const x = fbmLoad().find(e => e.id === FBM_DLG.id);
  if (!x){ dlg.close(); return; }
  const st = FB_STATUS[x.status], kd = FB_KIND.find(k => k[0] === x.kind) || FB_KIND[3], d = fbmBody(x), sid = fbmScreen(x.pathname);
  const me = FBM_DLG.author, myCo = fbmLs('nq_feedback_company') || 'lanstech';
  const keepFocus = document.activeElement && dlg.contains(document.activeElement) ? document.activeElement.id : '';
  dlg.innerHTML = `
    <div class="dh"><div class="tt">
        <div class="tp"><span class="no">No.${x.no}</span><span class="chip" style="background:${kd[2]};color:${kd[3]}">${esc(kd[1])}</span><span class="chip" style="background:${st[1]};color:${st[2]}">${esc(st[0])}</span></div>
        <h3 id="fbmDlgT">${esc(fbmHead(x))}</h3></div>
      <button type="button" class="cls" data-fbmclose aria-label="閉じる">${FB_X}</button></div>
    <div class="db" id="fbmDlgB">
      <div class="org">
        ${d ? `<p class="d">${esc(d)}</p>` : ''}
        <span class="w">${esc([fbmCo(x.company), x.author || '名前なし', fbmTime(x.createdAt)].filter(Boolean).join('　'))}</span>
        <dl class="meta"><dt>画面</dt><dd>${sid ? esc(sid) + ' ' : ''}${esc(x.screenCategory)} › ${esc(x.screenTitle)}</dd>
          ${x.spot ? `<dt>場所</dt><dd>${esc(x.spot.text ? '「' + x.spot.text + '」' : '画面上で選んだ場所')}</dd>` : ''}</dl>
      </div>
      <h4>コメント ${x.comments.length} 件</h4>
      ${x.comments.length ? `<ul class="th">${x.comments.map((c, i) => `<li${c.company === 'lanstech' ? ' class="lt"' : ''}>
          <div class="w"><span>${esc([fbmCo(c.company), c.author || '名前なし'].filter(Boolean).join('　'))}</span><time>${fbmTime(c.createdAt)}</time>
            <button type="button" data-fbmcdel="${i}" aria-label="このコメントを削除する">削除</button></div>
          <p>${esc(c.body)}</p></li>`).join('')}</ul>` : '<p class="none">まだコメントはありません。下の欄から返信できます。</p>'}
    </div>
    <div class="df">
      <div class="nm">
        ${fbmPd('id="fbmReCo"', myCo, FB_COMPANY, '所属', 'cof')}
        <input id="fbmReAu" type="text" placeholder="名前（未入力可）" aria-label="名前" value="${esc(me)}"></div>
      <textarea id="fbmRe" placeholder="返信を書く" aria-label="返信の内容">${esc(FBM_DLG.draft)}</textarea>
      <div class="ac"><button type="button" class="send" id="fbmReSend"${FBM_DLG.draft.trim() ? '' : ' disabled'}>返信する</button></div>
    </div>`;
  const body = dlg.querySelector('#fbmDlgB'); if (scrollEnd) body.scrollTop = body.scrollHeight;
  const ta = dlg.querySelector('#fbmRe'), send = dlg.querySelector('#fbmReSend'), au = dlg.querySelector('#fbmReAu'), co = dlg.querySelector('#fbmReCo');
  dlg.querySelector('[data-fbmclose]').onclick = () => dlg.close();
  ta.oninput = () => { FBM_DLG.draft = ta.value; send.disabled = !ta.value.trim(); };
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); send.click(); } };
  au.oninput = () => { FBM_DLG.author = au.value; };
  fbmPdBind(co, v => fbmLs('nq_feedback_company', v));
  send.onclick = () => {
    const text = ta.value.trim(); if (!text) return;
    const now = Date.now(), author = au.value.trim();
    fbmLs('nq_feedback_company', co.dataset.value);
    const c = {id:`fb_${now.toString(36)}_${Math.random().toString(36).slice(2, 7)}`, author, company:co.dataset.value, body:text, createdAt:now};
    fbmEdit(x.id, e => Object.assign({}, e, {comments:[...(Array.isArray(e.comments) ? e.comments : []), c], updatedAt:now}));
    FBM_DLG.draft = ''; fbmPaintDlg(true); renderFbManage();
    dlg.querySelector('#fbmRe').focus();
  };
  dlg.querySelectorAll('[data-fbmcdel]').forEach(b => b.onclick = () => {
    if (!confirm('このコメントを削除しますか？\n削除すると元に戻せません。')) return;
    const i = +b.dataset.fbmcdel;
    fbmEdit(x.id, e => Object.assign({}, e, {comments:(e.comments || []).filter((_, j) => j !== i), updatedAt:Date.now()}));
    fbmPaintDlg(false); renderFbManage();
  });
  if (keepFocus && dlg.querySelector('#' + keepFocus)) dlg.querySelector('#' + keepFocus).focus();
}
/* 枠の中（React）で書いた・直したときも一覧を合わせる */
window.addEventListener('storage', e => { if (e.key === FBM_KEY && view === 'feedback'){ renderFbManage(); if (FBM_DLG.id) fbmPaintDlg(false); } });

/* ---------- 起動 ---------- */
const rawHash = () => { try{ return decodeURIComponent(location.hash.replace(/^#/, '')); }catch(e){ return ''; } };
const hashId = () => rawHash().toUpperCase();
const isFlowHash = () => rawHash().toLowerCase() === 'flow';
const isRefHash  = () => rawHash().toLowerCase() === 'ref';
const isRelHash  = () => rawHash().toLowerCase() === 'release';
const isFbmHash  = () => rawHash().toLowerCase() === 'feedback';
window.addEventListener('hashchange', () => {
  if (hashLock) return;
  if (isFlowHash()){ setView('flow', {fromHash:true}); return; }
  if (isRefHash()){ setView('ref', {fromHash:true}); return; }
  if (isRelHash()){ setView('release', {fromHash:true}); return; }
  if (isFbmHash()){ setView('feedback', {fromHash:true}); return; }
  const id = hashId();
  if (!IDX[id]) return;
  if (view !== 'screen') setView('screen', {fromHash:true});
  if (id !== cur.id) go(id, {fromHash:true});
});
/* プロトタイプの右下「資料 › 画面設計」から戻ってきたとき：?role=…&state=…#admin/approvals/… の形。
   hash は画面IDではなくプロトタイプの画面なので、対応する画面IDを開き、枠にはその画面そのものを映す */
function takeReturn(){
  const q = new URLSearchParams(location.search), h = rawHash();
  if (q.get('role') && ROLE_LIST.some(r => r.key === q.get('role'))){ curRole = q.get('role'); LS.set('role', curRole); paintRole(); }
  if (q.has('state') && (PROJECT.screenStates || []).some(x => x.key === q.get('state'))) curState = q.get('state');
  let id = '';
  if (!IDX[hashId()] && /^(admin|app)(\/|$)/.test(h)){
    const hit = HASH2ID_AUTO.find(([re]) => re.test(h)) || HASH2ID.find(([re]) => re.test(h));
    if (hit){ id = hit[1]; bootLoc = h; }
  }
  if (location.search || id){ try{ history.replaceState(null, '', location.pathname + '#' + (id || rawHash())); }catch(e){} }
}
takeReturn();
pickDemo().then(() => {
  go(IDX[hashId()] ? hashId() : SCREENS[0].id, {fromHash:true});
  setView(isFlowHash() ? 'flow' : isRefHash() ? 'ref' : isRelHash() ? 'release' : isFbmHash() ? 'feedback' : 'screen', {fromHash:true});
  /* 起動時に hash が無ければ、いまの画面を書いておく（次のリロードで戻れる） */
  if (!IDX[hashId()] && !isFlowHash() && !isRefHash() && !isRelHash() && !isFbmHash()){ try{ history.replaceState(null, '', '#' + cur.id); }catch(e){} }
});
</script>
