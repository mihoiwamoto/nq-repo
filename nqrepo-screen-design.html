<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NQリポ（食品工場管理システム）の画面設計。画面はプロトタイプと同じ HTML を表示して常に同期。管理画面とアプリの画面をクリックしながら Ver.4.0 の要件を詰める。">
<title>NQリポ 画面設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* ===========================================================
   画面設計ボード — 打合せしながら画面を詰めるための資料
   中央にプロトタイプ、左に画面一覧、右にその画面の仕様と決めること。
   色を変えるのは下の :root の8つだけ。--g は面に、--g-d は文字に使う
   （--g をそのまま文字にすると白地でコントラストが足りない）。
   =========================================================== */
:root{
  --g:#009944; --g-d:#00853C; --g-l:#DDF3E7; --g-line:#9FD4BC;
  --ink:#333333; --mute:#666E6B;
  --bg:#F1EFEA; --surface:#FFFFFF; --surface-2:#F7F8F7; --surface-3:#ECEEEB;
  --line:#E2E5E7; --line-s:#CBD1D4;
  --dark:#1C2226;
  --warn:#C2410C; --warn-l:#FDEAD9; --danger:#B3261E; --danger-l:#FBE6E4;
  --sh-1:0 1px 2px rgba(28,34,38,.06);
  --sh-2:0 2px 6px rgba(28,34,38,.07), 0 10px 26px -14px rgba(28,34,38,.30);
  --sh-3:0 10px 26px rgba(28,34,38,.13), 0 40px 70px -34px rgba(28,34,38,.40);
  --r:8px; --r-l:14px;
  --wRail:274px; --wInsp:384px; --wFlow:480px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1214; --surface:#171D20; --surface-2:#1E2528; --surface-3:#272F33;
    --line:#2A3236; --line-s:#3B4549; --ink:#E7EBEC; --mute:#98A2A7;
    --g:#2FBF71; --g-d:#8FDCBB; --g-l:#12312A; --g-line:#2C5F4B;
    --warn:#E8A06A; --warn-l:#33210F; --danger:#E4796F; --danger-l:#331816;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 2px 6px rgba(0,0,0,.45), 0 12px 28px -16px rgba(0,0,0,.9);
    --sh-3:0 12px 28px rgba(0,0,0,.6), 0 50px 80px -34px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1214; --surface:#171D20; --surface-2:#1E2528; --surface-3:#272F33;
  --line:#2A3236; --line-s:#3B4549; --ink:#E7EBEC; --mute:#98A2A7;
  --g:#2FBF71; --g-d:#8FDCBB; --g-l:#12312A; --g-line:#2C5F4B;
  --warn:#E8A06A; --warn-l:#33210F; --danger:#E4796F; --danger-l:#331816;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 6px rgba(0,0,0,.45), 0 12px 28px -16px rgba(0,0,0,.9);
  --sh-3:0 12px 28px rgba(0,0,0,.6), 0 50px 80px -34px rgba(0,0,0,1);
}
html{color-scheme:light dark}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:700;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:5px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-s);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--wRail) minmax(0,1fr) var(--wInsp);grid-template-rows:58px minmax(0,1fr);height:100vh;height:100dvh;position:relative}

/* ---------- パネルの境目（つかんで幅を変える） ---------- */
.grip{position:absolute;top:58px;bottom:0;width:11px;z-index:6;cursor:col-resize;touch-action:none;
  display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0}
.grip::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:transparent;transition:background .12s}
.grip:hover::before,.grip.on::before,.grip:focus-visible::before{background:var(--g)}
.grip:focus-visible{outline:none}
.grip i{width:4px;height:30px;border-radius:99px;background:var(--line-s);opacity:0;transition:opacity .12s}
.grip:hover i,.grip.on i{opacity:1;background:var(--g)}
.g-rail{left:var(--wRail);margin-left:-5px}
.g-insp{right:var(--wInsp);margin-right:-5px}
/* ドラッグ中は中のプロトタイプにポインタを取られないようにする */
body.drag{cursor:col-resize;user-select:none}
body.drag .live{pointer-events:none}
.topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:20px;padding:0 18px 0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.wm{display:flex;align-items:center;gap:11px;min-width:0}
.wm .mk{width:27px;height:27px;border-radius:8px;background:var(--g);display:grid;place-items:center;flex:none}
.wm .mk svg{color:#fff}
.wm h1{font-size:16.5px;font-weight:900;white-space:nowrap}
.topbar .grow{flex:1}
.fact{display:flex;align-items:baseline;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mute);white-space:nowrap}
.fact b{font-weight:500;color:var(--ink);font-size:12.5px}
.kbtn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px 6px 12px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.kbtn:hover{border-color:var(--line-s);color:var(--ink)}
/* ヘルプは文字1つなので正方形にする */
kbd{font-size:10.5px;line-height:1;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--mute)}

/* ---------- rail ---------- */
.rail{grid-column:1;grid-row:2;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
/* 上端の 管理画面／アプリ の切り替え。ヘッダーの表示切替（.vsw）と同じ見た目 */
.ptabs{flex:none;display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:2px;margin:12px 12px 0}
.ptab{flex:1;font-size:12.5px;padding:6px 10px;border-radius:7px;color:var(--mute);text-align:center}
.ptab:hover{color:var(--ink)}
.ptab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--sh-1)}
/* 一覧だけがスクロールする。検索は下端に固定 */
#railScreens{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 12px}
/* 検索はレールの一番下に固定。一覧が短くても長くても位置が変わらない */
.rsearch{flex:none;background:var(--surface);padding:10px 12px 14px;display:flex;align-items:center;gap:7px;border-top:1px solid var(--line)}
.rsearch svg{color:var(--mute);flex:none}
.rsearch input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13.5px;padding:4px 0;color:var(--ink)}
.rsearch input:focus{outline:none}
.rsearch input::placeholder{color:var(--mute)}
.rsearch input::-webkit-search-cancel-button{-webkit-appearance:none}
.rsearch kbd{font:inherit;font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex:none}
.rsearch:focus-within{border-top-color:var(--g)}
.rsearch:focus-within > svg{color:var(--g)}
.rsearch:focus-within kbd{display:none}
/* たたんだ帯でカテゴリにマウスを乗せたとき、その中身だけを右に出す。
   パネルごとせり出すと中央が隠れるので、出すのは触っているカテゴリの1枚だけ */
.fly{position:fixed;z-index:200;min-width:196px;max-width:300px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-3);
  padding:4px 0 6px;max-height:72vh;overflow-y:auto;overscroll-behavior:contain}
.fly .fh{display:flex;align-items:center;gap:8px;padding:8px 14px 9px;margin-bottom:4px;
  border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:500}
.fly .fh .gi{flex:none;width:14px;height:14px;display:grid;place-items:center}
.fly .slist{padding:0 6px}

/* 左パネルをたたむ・開くボタン。たたむと帯の先頭に残り、これが戻す口になる */
.rtg{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--mute)}
.rtg:hover{background:var(--surface-3);color:var(--ink)}
.rempty{font-size:12.5px;color:var(--mute);line-height:1.8;padding:18px 6px}
.rail section:first-child{margin-top:12px}
/* 開閉のアイコンは行の右端に置く。見出しは押せる場所を広く取りたいので幅いっぱい */
.rh{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:3px 6px;margin:0 0 6px;
  font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:500;border-radius:6px}
.rh:hover{color:var(--ink);background:var(--surface-2)}
.rh .gi{flex:none;width:14px;height:14px;display:grid;place-items:center;margin-right:1px}
.rh .cv{flex:none;margin-left:auto;transition:transform .15s}
.rh[aria-expanded="true"] .cv{transform:rotate(180deg)}
.logwrap .fact{display:flex!important}
.rail section+section{margin-top:20px}
.slist{display:flex;flex-direction:column;gap:2px}
.slist button{display:grid;grid-template-columns:minmax(27px,max-content) 1fr auto;gap:6px;align-items:center;text-align:left;border-radius:var(--r);padding:7px 9px;transition:background .12s}
.slist button:hover{background:var(--surface-2)}
.slist button[aria-current="true"]{background:var(--g-l);box-shadow:inset 0 0 0 1px var(--g-line)}
/* 画面番号はラベルの形にする。行の背景（通常・ホバー・現在地）のどれに乗っても
   輪郭が残るよう、面と縁の両方を持たせる */
.slist .sid{font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.02em;text-align:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 3px;line-height:1.6;white-space:nowrap}
.slist button[aria-current="true"] .sid{color:var(--g-d);background:var(--surface);border-color:var(--g-line)}
.slist .sn{font-size:13.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist button[aria-current="true"] .sn{font-weight:500}
.slist .rt{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.slist .rt:empty{display:none}
/* 枝の画面（M2-1 など）は親の行の下に入れ、親の右端の山形で開閉する */
.slist .sub{display:flex;flex-direction:column;gap:2px;margin:0 0 2px 13px;padding-left:8px;border-left:1px solid var(--line)}
.slist .sub[hidden]{display:none}
.slist .tg{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;color:var(--mute);transition:transform .15s}
.slist .tg:hover{background:var(--surface-3);color:var(--ink)}
.slist button[aria-expanded="true"] .tg{transform:rotate(180deg)}

/* 更新履歴 */
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.hist li{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:baseline}
.hist .hd{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.hist .ht{font-size:12.5px;line-height:1.7;color:var(--ink)}
.logwrap{position:fixed;inset:0;z-index:70;background:rgba(8,12,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:9vh 20px 20px}
.logwrap .box{width:min(680px,100%);max-height:78vh;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-3);overflow:hidden;display:flex;flex-direction:column}
.logwrap .bh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.logwrap .bh h3{font-size:15px;flex:1}
.logwrap .bb{overflow-y:auto;padding:6px 18px 18px}
.logday{margin-top:16px}
.logday:first-child{margin-top:8px}
.logday .dt{font-size:12px;font-weight:700;color:var(--mute);padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.logday ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.logday li{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:baseline}
.logday .who{font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 0;text-align:center}
.logday .who.doc{color:var(--g-d);border-color:var(--g-line);background:var(--g-l)}
.logday button.who:hover{border-color:var(--g);color:var(--g-d)}
.logday .tx{font-size:13px;line-height:1.7}
/* 更新履歴の行を押すと、その変更の前と後の控えが中央に並ぶ。控えが無い行（控えを取り始める前）はただの文 */
.lpick{display:flex;align-items:flex-start;gap:8px;width:calc(100% + 12px);margin:-4px -6px;padding:4px 6px;text-align:left;
  font:inherit;color:inherit;background:none;border:0;border-radius:8px;cursor:pointer}
.lpick:hover{background:var(--surface-2)}
.lpick .ht,.lpick .tx{flex:1;min-width:0}
.lchip{flex:none;margin-top:2px;font-size:11px;line-height:1.7;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap;background:var(--surface)}
.lpick:hover .lchip{color:var(--g-d);border-color:var(--g-line)}
.lpick.on{background:var(--g-l)}
.lpick.on .lchip{color:var(--g-d);border-color:var(--g-line)}
.lhint{font-size:11.5px;line-height:1.6;color:var(--mute);margin:10px 0 0}

/* 履歴は右パネルごと切り替えて出す。仕様の下に積むと画面ごとに伸び続けるため */
.insp .seg{display:flex;gap:3px;margin-top:12px;background:var(--surface-2);border-radius:999px;padding:3px}
.insp .segb{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;padding:6px 10px;border-radius:999px;color:var(--mute);white-space:nowrap;overflow:hidden}
.insp .segb .lb{overflow:hidden;text-overflow:ellipsis}
.insp .segb .n{font-size:11px;font-variant-numeric:tabular-nums}
.insp .segb:hover{color:var(--ink)}
.insp .segb[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.pill.back{padding-left:8px}


/* ---------- stage ---------- */
.stage{grid-column:2;grid-row:2;display:grid;grid-template-rows:minmax(0,1fr);min-width:0;overflow:hidden;position:relative;
  container-type:inline-size;container-name:stage}
/* 下に浮かべる道具立て。画面名は左の一覧と右パネルが持つので、ここには出さない */
.tbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;
  display:flex;align-items:center;gap:3px;padding:5px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2);max-width:calc(100% - 28px)}
.tbar .sep{width:1px;height:18px;background:var(--line);flex:none;margin:0 3px}
/* 画面の状態を開いたまま切り替える */
.stw{display:inline-flex;align-items:center;gap:7px;padding:4px 9px 4px 10px;border-radius:9px;flex:none}
.stw .sl{font-size:11px;letter-spacing:.1em;color:var(--mute)}
.stw select{font:inherit;font-size:11.5px;color:var(--ink);background:none;border:0;padding:2px 0;max-width:140px;cursor:pointer}
.stw select:focus{outline:none}
.stw:hover{background:var(--surface-2)}
.stw.on{background:var(--warn-l)}
.stw.on .sl,.stw.on select{color:var(--warn)}
/* 枠の大きさは、枠のすぐ上（中央の画面バー）に置く。右パネルには出さない */
.dim{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);white-space:nowrap;flex:none;
  font-variant-numeric:tabular-nums;border:0;border-radius:9px;padding:6px 10px}
.dim:hover{background:var(--surface-2);color:var(--ink)}
.dim[aria-expanded="true"]{background:var(--g-l);color:var(--g-d)}
.dim.chg{color:var(--g-d)}
.dim svg{flex:none;opacity:.75}

/* 枠の大きさを変えるパネル。stage は overflow を切ってあるので body 直下に出す */
.sizepop{position:fixed;z-index:60;width:262px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh-3);padding:13px 14px 14px}
.sizepop .ttl{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:500;margin-bottom:9px}
.sizepop .presets{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:13px}
.sizepop .presets button{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;color:var(--ink);text-align:left;line-height:1.45}
.sizepop .presets button:hover{border-color:var(--g)}
.sizepop .presets button[aria-pressed="true"]{background:var(--g-l);border-color:var(--g-line);color:var(--g-d)}
.sizepop .presets .px{display:block;font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.sizepop .presets button[aria-pressed="true"] .px{color:var(--g-d)}
.sizerow{display:grid;grid-template-columns:26px 1fr 62px;gap:8px;align-items:center;margin-top:8px}
.sizerow label{font-size:12px;color:var(--mute)}
.sizerow input[type=range]{width:100%;accent-color:var(--g)}
.sizerow input[type=number]{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;
  font-size:12px;background:var(--surface);font-variant-numeric:tabular-nums}
.sizerow input[type=number]:focus{outline:none;border-color:var(--g)}
.sizefoot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.sizefoot .note{font-size:11px;color:var(--mute);line-height:1.6}
.sizefoot button{margin-left:auto;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:5px 10px;color:var(--mute);white-space:nowrap}
.sizefoot button:hover{border-color:var(--g);color:var(--g-d)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--mute);white-space:nowrap}
.pill.g{background:var(--g-l);color:var(--g-d)}
.pill.w{background:var(--warn-l);color:var(--warn)}
button.pill{border:1px solid var(--line);background:var(--surface);transition:border-color .14s,color .14s}
button.pill:hover{border-color:var(--g);color:var(--g-d)}
button.pill.g{border-color:var(--g-line)}
button.pill.g:hover{border-color:var(--g)}
.hist{margin-top:2px}
.hist li+li{opacity:.92}

/* 枠は縦にも中央へ。safe を付けておくと、はみ出したとき上が切れて掴めなくなるのを防げる */
.canvas{overflow:auto;padding:28px 28px 84px;display:flex;justify-content:center;background:var(--bg);
  align-items:center;align-items:safe center}
.fitwrap{transform-origin:top left;flex:none}

/* ---------- device frames ---------- */
.phone{background:#fff;border-radius:44px;box-shadow:var(--sh-3);border:11px solid #14181A;overflow:hidden;position:relative;color:#333}
.phone.tablet{border-radius:26px}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:132px;height:30px;background:#14181A;border-radius:0 0 18px 18px;z-index:9}
.browser{background:#fff;border-radius:12px;box-shadow:var(--sh-3);overflow:hidden;color:#333}
.browser .chrome{height:38px;background:#E9EBEC;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid #D8DCDE}
.browser .dot{width:11px;height:11px;border-radius:99px;background:#C9CED1}
.browser .url{flex:1;height:23px;background:#fff;border-radius:6px;display:flex;align-items:center;padding:0 11px;font-size:11.5px;color:#7A828A;margin-left:8px}
/* 画面はプロトタイプ（nqrepo-demo.html?frame=1#…）そのものを iframe で表示する。
   デザインの実体はデモ側にだけあり、この資料は説明と決定事項を持つ。枡（端末・ブラウザ）だけここで描く。 */
.live,.snap{display:block;border:0;background:#fff}
/* 変更の前後：左に変更後（後の控えが無ければ いま）、右に変更前。常に横並び（縦には積まない）。見出しは縮めずに読めるよう、全体を縮めた分だけ逆に拡げる（--inv＝1/倍率）。
   見出しは枠の外（上）に浮かべて場所を取らない。場所を取ると倍率の計算が合わなくなる */
.canvas.cmpmode{padding-top:60px}
.cmp{display:flex;gap:var(--cg,44px);align-items:flex-start}
.cmpcol{position:relative;flex:none}
.cmph{position:absolute;left:0;bottom:calc(100% + 8px * var(--inv,1));width:calc(100% / var(--inv,1));
  transform:scale(var(--inv,1));transform-origin:bottom left;
  display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.5;color:var(--mute);white-space:nowrap}
.cmph b{flex:none;font-size:12px;font-weight:700;color:var(--ink);padding:2px 10px;border-radius:999px;
  border:1px dashed var(--line-s);background:var(--surface-2);font-variant-numeric:tabular-nums}
.cmph.now b{color:var(--g-d);border:1px solid var(--g-line);background:var(--g-l)}
.cmph .cmpnote[hidden]{display:none}
.cmph .cn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cmph .cmpnote{flex:none;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-l);border-radius:6px;padding:2px 8px}
.cmph .cmpoff{margin-left:auto;flex:none;font:inherit;font-size:11.5px;color:var(--mute);background:none;border:0;padding:2px 4px;cursor:pointer}
.cmph .cmpoff:hover{color:var(--g-d)}
/* 画面バーでいちばん押してほしい操作なので、ほかの項目と高さ・文字の大きさを揃えたうえで緑の面にする */
.demolink{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;line-height:1;height:32px;padding:0 10px 0 11px;
  border-radius:9px;border:0;margin-left:2px;color:var(--g-d);background:var(--g-l);text-decoration:none;
  white-space:nowrap;flex:none;transition:background .14s,color .14s}
.demolink svg{flex:none}
/* 中央の列が狭くなったら、画面バーの飾りから順に落とす。
   列の幅で効かせたいので画面幅ではなくコンテナクエリで判定する */
@container stage (max-width:520px){ .demolink .dlt{display:none} .demolink{padding:0 9px} .dim .nm{display:none} .stw .sl{display:none} }
@container stage (max-width:360px){ .tbar{gap:0;padding:4px} .tbar .sep{margin:0} }
.demolink:hover{background:var(--g);color:#fff}

/* ---------- フロー（画面の遷移図） ---------- */
.vsw{display:flex;gap:2px;background:var(--surface-2);border-radius:9px;padding:2px;margin-left:18px}
.vsw button{font-size:12.5px;padding:5px 14px;border-radius:7px;color:var(--mute)}
.vsw button:hover{color:var(--ink)}
.vsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--sh-1)}

.flowview{grid-column:2/4;grid-row:2;background:var(--bg);overflow:hidden;position:relative;touch-action:none;cursor:grab}
/* フロー表示は 地図＋プロトタイプ の2枚。地図で押した画面が、そのまま隣に出る。
   右の列は仕様パネルの場所を借りるので、幅だけ別に持つ（--wFlow） */
body[data-view="flow"] .insp{display:none}
body[data-view="flow"] .flowview{grid-column:2}
body[data-view="flow"] .stage{grid-column:3;border-left:1px solid var(--line)}
/* 左の一覧は地図と同じものを小さく繰り返すだけなので、フロー表示のあいだは消して幅を地図に渡す。
   たたんである／開いているの状態はそのまま残り、詳細表示に戻ると元どおりになる */
body[data-view="flow"] .rail,body[data-view="flow"] .g-rail{display:none}
body[data-view="screen"] .flowview{display:none}

/* ---------- 前提（利用者・規模・権限・用語） ---------- */
.refview{grid-column:1/4;grid-row:2;background:var(--bg);overflow:auto;overscroll-behavior:contain}
body[data-view="ref"] .rail,body[data-view="ref"] .g-rail,body[data-view="ref"] .g-insp,
body[data-view="ref"] .stage,body[data-view="ref"] .insp,
body[data-view="release"] .rail,body[data-view="release"] .g-rail,body[data-view="release"] .g-insp,
body[data-view="release"] .stage,body[data-view="release"] .insp{display:none}
/* リリース（開発 Ver）。前提と同じ器（.refview）に、Ver ごとのカードを新しい順に並べる */
.relhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vchip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--surface-2);color:var(--vf,var(--ink));font-variant-numeric:tabular-nums}
.vchip i{width:8px;height:8px;border-radius:99px;background:var(--vf,var(--ink))}
.vst{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--surface)}
.vst.design{background:var(--g);color:#fff;border-color:var(--g)}
.vst.dev{background:#2F7FD4;color:#fff;border-color:#2F7FD4}
.vst.done{background:var(--surface-3);color:var(--mute);border-color:transparent}
.relhd .when{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-left:auto}
.relaim{margin:0;font-size:12.5px;line-height:1.85}
.rellist{margin:0;padding:0;list-style:none}
.rellist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.rellist li i{width:8px;height:8px;border-radius:99px;background:var(--vf,var(--ink));flex:none}
.rellist .go{margin-left:auto;flex:none;font:inherit;font-size:11.5px;color:var(--g-d);background:none;border:1px solid var(--g-line);border-radius:999px;padding:2px 9px;cursor:pointer}
.rellist .go:hover{background:var(--g-l)}
.refsec.relcur{border-color:var(--g-line);box-shadow:0 0 0 2px var(--g-l)}
.refwrap{max-width:900px;margin:0 auto;padding:26px 26px 60px;display:flex;flex-direction:column;gap:26px}
.refsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px}
.refsec h3{font-size:14.5px;margin-bottom:13px}
.refnote{margin:11px 0 0;font-size:11.5px;color:var(--mute);line-height:1.75}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.pcard b{display:block;font-size:13.5px}
.pcard .pw{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.pcard p{margin:8px 0 0;font-size:12.5px;line-height:1.75}
.dlist{margin:0;display:grid;grid-template-columns:132px 1fr;gap:9px 14px}
.dlist dt{font-size:12.5px;font-weight:500;color:var(--ink)}
.dlist dd{margin:0;font-size:12.5px;color:var(--ink2,var(--ink));line-height:1.75}
.rolerow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.rchip{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;font-size:12.5px;line-height:1.75;color:var(--mute)}
.rchip b{font-size:13.5px;color:var(--ink)}
@media (max-width:640px){.rolerow{grid-template-columns:1fr}}
.tblwrap{overflow-x:auto}
.rtbl{border-collapse:collapse;width:100%;font-size:12.5px}
.rtbl th,.rtbl td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:center;white-space:nowrap}
.rtbl thead th{font-size:11px;letter-spacing:.1em;color:var(--mute);font-weight:500}
.rtbl tbody th{text-align:left;font-weight:400}
.rtbl tbody th .sid{font-size:10.5px;font-weight:700;color:var(--mute);margin-right:8px}
.rtbl tbody tr.kid th{padding-left:calc(30px + 20px * var(--d,1))}
.rtbl .rtg{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;color:var(--mute);vertical-align:-4px;margin-right:2px;transition:transform .15s}
.rtbl .rtg:hover{background:var(--surface-2);color:var(--ink)}
.rtbl .rtg[aria-expanded="true"]{transform:rotate(180deg)}
.rtbl th:has(.rtg){padding-left:10px}
.rtbl tbody tr.kid th:has(.rtg){padding-left:calc(10px + 20px * var(--d,1))}
.rtbl .ok{color:var(--g-d)}
.rtbl .mid{color:var(--warn)}
.rtbl .no{color:var(--line-s)}
.rtbl .nt{text-align:left;white-space:normal;font-size:11.5px;color:var(--mute);min-width:180px}
.rtbl tbody tr:hover{background:var(--surface-2)}
.rtbl.lft th,.rtbl.lft td{text-align:left}
.rtbl .ops{letter-spacing:.35em;white-space:nowrap}
.rtbl .ops .ok{color:var(--g-d)}
.rtbl .ops .mid{color:var(--warn)}
.rtbl .ops .no{color:var(--line-s)}
.refsub{font-size:12.5px;margin:18px 0 9px;color:var(--ink)}
.refline{margin:0 0 11px;font-size:12.5px;line-height:1.85}
.refline b{display:inline-block;min-width:78px;font-size:11px;letter-spacing:.1em;color:var(--mute);font-weight:500}
.refline.plan{background:var(--g-l);border-radius:9px;padding:10px 13px;color:var(--g-d)}
.refline.plan b{color:var(--g-d)}
.refline code{font-size:11.5px;background:var(--surface-2);border-radius:4px;padding:1px 6px}
.refnav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px;padding:10px 0 12px;background:var(--bg)}
.refnav a{font-size:12px;color:var(--mute);text-decoration:none;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;background:var(--surface)}
.refnav a:hover{border-color:var(--g);color:var(--g-d)}

/* 右パネルの項目定義とプロトタイプの範囲 */
.ftbl{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:fixed}
.ftbl th,.ftbl td{text-align:left;vertical-align:top;padding:6px 0}
.ftbl thead th{font-size:10.5px;letter-spacing:.08em;color:var(--mute);font-weight:500;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.ftbl thead th:nth-child(2){width:76px}
.ftbl thead th:nth-child(3){width:44px}
.ftbl tr.hd th{font-weight:500;padding-top:9px;overflow-wrap:anywhere}
.ftbl tr.hd td{color:var(--mute);padding-top:9px}
.ftbl .rq.must{color:var(--warn)}
.ftbl tr.dt td{padding:0 0 9px;border-bottom:1px solid var(--line)}
.ftbl .sp{display:block;font-size:11.5px;color:var(--mute);line-height:1.75}
.ftbl .src{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.ftbl .src::before{content:"";display:inline-block;width:5px;height:5px;border-radius:9px;
  background:var(--line-s);margin-right:6px;vertical-align:middle}
.built{margin:0;font-size:12.5px;line-height:1.8;border-radius:9px;padding:9px 12px}
.built b{display:inline-block;margin-right:9px;font-size:11px;border-radius:5px;padding:2px 8px}
.built.b-ok{background:var(--g-l);color:var(--g-d)}
.built.b-ok b{background:var(--g);color:#fff}
.built.b-half{background:var(--warn-l);color:var(--warn)}
.built.b-half b{background:var(--warn);color:#fff}
.built.b-no{background:var(--surface-2);color:var(--mute)}
.built.b-no b{background:var(--line-s);color:#fff}

/* ---------- 決まったこと ---------- */
.alist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.alist li{border-left:3px solid var(--g);padding-left:11px}
.alist .ans{display:block;font-size:13.5px;font-weight:500;line-height:1.7;color:var(--ink)}
.alist .aq{display:block;font-size:11.5px;color:var(--mute);line-height:1.7;margin-top:2px}
.alist .adt{margin-left:8px;font-variant-numeric:tabular-nums}
.alist .why{display:block;font-size:12px;color:var(--mute);line-height:1.7;margin-top:3px}
.fwrap{position:absolute;inset:0;overflow:hidden}
.flane{position:absolute;left:0;border-radius:12px}
.flane.alt{background:var(--surface-2)}
.flane .ln{position:absolute;top:9px;left:14px;font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:500}
.fsvg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.fsvg path{fill:none;stroke:var(--line-s);stroke-width:1.6}
.fsvg path.tab{stroke-dasharray:3 4;stroke:var(--line)}
.fsvg path.q{stroke:var(--warn);stroke-dasharray:5 4}
.fsvg .lg.q .lb{fill:var(--warn)}
.fsvg .lg.q .lbb{stroke:var(--warn-l)}
.fsvg path.back{stroke-dasharray:3 4;stroke:var(--line)}
.fsvg path.cross{stroke:var(--g);stroke-width:2}
.fsvg path.bus{stroke:var(--line);stroke-dasharray:3 4}
.fsvg .lb{font-size:10.5px;fill:var(--mute)}
.fsvg .lbb{fill:var(--surface);stroke:var(--line);stroke-width:.8}
.fsvg .lg.cross .lb{fill:var(--g-d);font-weight:500}
.fsvg .lg.cross .lbb{stroke:var(--g-line)}

/* 幅に合わせて縮める入れ物 */
.fmap{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.flowview.grab{cursor:grabbing;user-select:none}
.fnode{cursor:pointer}
.flowview.grab .fnode{pointer-events:none}
/* 倍率の操作板。地図を動かしても左下に残る */
.fzoom{position:absolute;left:14px;bottom:14px;z-index:9;
  display:flex;align-items:center;gap:2px;padding:3px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2)}
.fzoom button{font-size:12.5px;color:var(--mute);border-radius:8px;padding:5px 0;min-width:32px;text-align:center}
.fzoom button:hover{background:var(--surface-2);color:var(--ink)}
.fzoom .pct{min-width:58px;font-variant-numeric:tabular-nums}
.fzoom .pct.auto{color:var(--g-d)}

/* ノードに乗せている間は、つながりだけ残す */
.fwrap .fsvg path,.fwrap .fsvg .lg,.fwrap .fnode{transition:opacity .12s}
.fwrap.focus .fsvg path,.fwrap.focus .fsvg .lg{opacity:.13}
.fwrap.focus .fsvg path.on,.fwrap.focus .fsvg .lg.on{opacity:1}
.fwrap.focus .fnode{opacity:.4}
.fwrap.focus .fnode.on{opacity:1}
@media (prefers-reduced-motion:reduce){.fwrap .fsvg path,.fwrap .fsvg .lg,.fwrap .fnode{transition:none}}
/* 高さは決め打ちなので、中身を縦に中央寄せして上下の余白をそろえる */
.fnode{position:absolute;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:6px 11px;box-shadow:var(--sh-1);transition:border-color .14s,box-shadow .14s;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:3px}
.fnode:hover{border-color:var(--g);box-shadow:var(--sh-2)}
.fnode[aria-current="true"]{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}
.fnode .r{display:flex;align-items:center;gap:6px;line-height:1}
.fnode .fid{font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.04em;line-height:1}
.fnode .fn{display:block;font-size:13px;line-height:1.25;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnode .fin{font-size:9.5px;line-height:1.35;color:var(--g-d);background:var(--g-l);border-radius:4px;padding:1px 5px}
.fnode.flat{cursor:default;background:var(--surface-2)}
.fnode.flat:hover{border-color:var(--line);box-shadow:var(--sh-1)}
/* ユースケースを選んだとき、その経路だけ残す */
.fwrap.picked:not(.focus) .fsvg path:not(.pk),.fwrap.picked:not(.focus) .fsvg .lg:not(.pk){opacity:.1}
.fwrap.picked:not(.focus) .fnode:not(.pk){opacity:.32}
.fwrap.picked:not(.focus) .fnode.pk{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.fwrap.picked:not(.focus) .fsvg path.pk{stroke:var(--g);stroke-width:2.4}
/* 地図を動かすと下を通るので、凡例には下敷きを敷く */
.fleg{position:absolute;top:12px;left:16px;z-index:8;width:max-content;max-width:calc(100% - 32px);
  display:flex;flex-wrap:wrap;gap:14px;padding:7px 12px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);
  font-size:11.5px;color:var(--mute);pointer-events:none}
.fleg span{display:inline-flex;align-items:center;gap:6px}
.fleg i{width:22px;height:0;border-top:1.6px solid var(--line-s)}
.fleg i.tab,.fleg i.back{border-top-style:dashed;border-color:var(--line)}
.fleg i.q{border-top-style:dashed;border-color:var(--warn)}
.fleg .fdiv{width:1px;height:16px;background:var(--line)}
/* 図の種類とユースケース */
.fcw,.fsel{display:flex;align-items:center;gap:7px;pointer-events:auto}
.fledger{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface);color:var(--ink);max-width:190px}
.fledger:focus{outline:none;border-color:var(--g)}
/* ユースケースの検索つきプルダウン。帳票ごとにまとめて出す */
.fcbox{position:relative}
.fcin{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:4px 22px 4px 8px;
  background:var(--surface);color:var(--ink);width:210px}
.fcin:focus{outline:none;border-color:var(--g)}
.fcin::placeholder{color:var(--mute)}
.fcclr{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  border-radius:5px;font-size:12px;line-height:1;color:var(--mute)}
.fcclr:hover{background:var(--surface-2);color:var(--ink)}
.fcclr[hidden]{display:none}
.fclist{position:absolute;top:calc(100% + 5px);left:0;z-index:12;width:min(320px,80vw);max-height:46vh;overflow-y:auto;
  overscroll-behavior:contain;padding:4px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh-3)}
.fclist[hidden]{display:none}
.fcg{padding:7px 8px 3px;font-size:10.5px;font-weight:700;color:var(--g-d);letter-spacing:.03em}
.fci{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px}
.fci b{display:block;font-size:12px;font-weight:500;color:var(--ink);line-height:1.45}
.fci span{display:block;font-size:10.5px;color:var(--mute);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fci:hover,.fci.on{background:var(--surface-2)}
.fci.cur b{color:var(--g-d);font-weight:700}
.fcempty{margin:0;padding:10px 9px;font-size:11.5px;color:var(--mute)}
.fcnote{position:absolute;top:60px;left:16px;z-index:8;max-width:min(520px,calc(100% - 32px));margin:0;
  padding:7px 12px;border-radius:9px;background:var(--g-l);color:var(--g-d);
  font-size:11.5px;line-height:1.7;pointer-events:none}
.fleg i.cross{border-color:var(--g);border-top-width:2px}
.fnote{margin:16px 0 0 2px;font-size:11.5px;color:var(--mute);line-height:1.7}

/* ---------- inspector ---------- */
.insp{grid-column:3;grid-row:2;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.ih{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:17px 22px 14px}
.ih .r1{display:flex;align-items:center;gap:8px;margin-bottom:4px;min-height:26px}
.ih .r1 .loglink{margin-left:auto;flex:none}   /* 更新履歴は右端に寄せる */
.ih h3{font-size:19px;line-height:1.4}
.ih .id{font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.04em}
/* 節は細い線で区切る。余白だけだと全部が1本の長い柱に見えて、どこが変わったか追えない */
.ib{padding:0 22px 34px}
.sec{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.ib > .sec:first-child{margin-top:0;padding-top:16px;border-top:0}
.sec>h4{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:500;margin-bottom:10px}
.lead{margin:0;font-size:13.5px;line-height:1.85;color:var(--ink)}
.lead.top{font-size:14px;font-weight:500}
.lead + .lead{margin-top:9px}
ul.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
ul.bul li{font-size:13px;line-height:1.7;padding-left:15px;position:relative;color:var(--ink)}
ul.bul li::before{content:"";position:absolute;left:2px;top:.75em;width:5px;height:1.5px;border-radius:1px;background:var(--line-s)}
/* 要件IDは参照用の符号。色は「これから動かすもの」に取っておきたいので、面ではなく縁で示す */
.fchips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--mute);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:5px}
.links button,.links a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);text-decoration:none}
.links button:hover,.links a:hover{border-color:var(--g);color:var(--g-d)}

/* ---------- 決めること ----------
   この資料の主役。読みものと同じ見た目だと埋もれるので、面を持たせて他の節と分ける。
   番号を振るのは「あと何本残っているか」が打合せ中に見えるようにするため。
   入力欄は置かない（保存先が要るため）。 */
.sec.work{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px 16px;border-top:1px solid var(--line)}
.qlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px}
.qlist li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:9px;align-items:start}
.qlist .no{width:20px;height:20px;border-radius:99px;background:var(--surface-3);color:var(--mute);
  font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums}
.qlist li.key .no{background:var(--warn-l);color:var(--warn)}
.qlist .qt{display:block;min-width:0}
.qlist .q{font-size:13.5px;line-height:1.75;font-weight:500;color:var(--ink)}
.qlist .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--warn);background:var(--warn-l);border-radius:4px;padding:1px 6px;margin-right:7px;transform:translateY(-1px)}
.qlist .why{display:block;font-size:12px;color:var(--mute);line-height:1.75;margin-top:4px}

.xlink{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;text-decoration:none;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .14s;
}
.xlink:hover{border-color:var(--g)}
.xlink .xi{
  width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--g-l);color:var(--g-d);font-size:11px;font-weight:700;
}
.xlink .xt{flex:1;min-width:0}
.xlink .xn{display:block;font-size:13.5px;color:var(--ink);line-height:1.5}
.xlink .xs{display:block;font-size:11.5px;color:var(--mute);line-height:1.6}
.xlink .xa{color:var(--mute);flex:none}
.xnone{font-size:12.5px;color:var(--mute);line-height:1.75;background:var(--surface-2);border-radius:10px;padding:11px 13px}
/* 未確定は「まだ答えが無い」という状態。印は付けるが、面をオレンジで塗ると
   決めることより先に目が行ってしまうので、左の線だけで示す */
.undec{margin:0;font-size:12.5px;line-height:1.8;color:var(--ink);
  background:var(--surface-2);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;padding:11px 13px}

/* ---------- 右下の切替（3資料 共通） ---------- */
.nvsw{position:fixed;right:20px;bottom:20px;z-index:200;
  --nb:#fff;--nl:#E2E5E7;--nt:#2B3134;--nm:#7A828A;--na:#009E5E;--nad:#1E7A4C;--nal:#DFF3E9;--ns:#F4F5F6;
  --nsh:0 4px 14px rgba(20,26,30,.10), 0 18px 44px -18px rgba(20,26,30,.36);
  font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .nvsw{
  --nb:#171D20;--nl:#2A3236;--nt:#E7EBEC;--nm:#98A2A7;--na:#35BE84;--nad:#8FDCBB;--nal:#12312A;--ns:#1E2528;
  --nsh:0 4px 14px rgba(0,0,0,.5), 0 20px 50px -18px rgba(0,0,0,.95)} }
:root[data-theme="dark"] .nvsw{
  --nb:#171D20;--nl:#2A3236;--nt:#E7EBEC;--nm:#98A2A7;--na:#35BE84;--nad:#8FDCBB;--nal:#12312A;--ns:#1E2528;
  --nsh:0 4px 14px rgba(0,0,0,.5), 0 20px 50px -18px rgba(0,0,0,.95)}

.nvfab{display:flex;align-items:center;gap:9px;background:var(--nb);color:var(--nt);
  border:1px solid var(--nl);border-radius:999px;padding:9px 15px 9px 13px;box-shadow:var(--nsh);
  font-size:13px;line-height:1.5;cursor:pointer;transition:transform .14s,box-shadow .14s}
.nvfab:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,26,30,.14), 0 22px 50px -18px rgba(20,26,30,.42)}
.nvfab .dt{width:8px;height:8px;border-radius:99px;background:var(--na);flex:none}
.nvfab .lb{font-weight:700;white-space:nowrap}
.nvfab .sb{color:var(--nm);white-space:nowrap;border-left:1px solid var(--nl);padding-left:9px}
.nvfab .cr{color:var(--nm);transition:transform .18s}
.nvsw.open .nvfab .cr{transform:rotate(180deg)}
.nvpanel{position:absolute;right:0;bottom:calc(100% + 10px);width:312px;background:var(--nb);
  border:1px solid var(--nl);border-radius:16px;box-shadow:var(--nsh);padding:14px;
  animation:nvup .18s cubic-bezier(.2,1,.3,1)}
/* display を指定しているので、hidden 属性だけでは消えない。明示的に閉じる */
.nvpanel[hidden]{display:none}
@keyframes nvup{from{transform:translateY(8px)}to{transform:none}}
.nvh{margin:0 0 7px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--nm);font-weight:500}
.nvsec+.nvsec{margin-top:15px;padding-top:14px;border-top:1px solid var(--nl)}
.nvit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;text-decoration:none;
  border-radius:10px;padding:9px 11px;color:var(--nt);border:0;background:none;cursor:pointer;font:inherit}
.nvit:hover{background:var(--ns)}
.nvit[aria-current="true"]{background:var(--nal)}
.nvit .nvr{width:16px;height:16px;border-radius:99px;flex:none;box-shadow:inset 0 0 0 1.5px var(--nl)}
.nvit[aria-current="true"] .nvr{background:var(--na);box-shadow:inset 0 0 0 3px var(--nb)}
.nvit .tx{min-width:0;flex:1}
.nvit .t1{display:block;font-size:13.5px;line-height:1.45;font-weight:500}
.nvit .t2{display:block;font-size:11px;color:var(--nm);line-height:1.5}
.nvgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.nvgrid .nvit{padding:8px 10px}
.nvgrid .nvit .t1{font-size:12.5px}
.nvflow{margin:9px 4px 0;font-size:11px;color:var(--nm);line-height:1.65}
.nvflow b{color:var(--nt);font-weight:500}
.nvfoot{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--nl)}
.nvbtn{font-size:12px;border:1px solid var(--nl);border-radius:8px;padding:6px 12px;color:var(--nm);background:none;cursor:pointer;font-family:inherit}
.nvbtn:hover{border-color:var(--na);color:var(--nad)}
.nvkey{margin-left:auto;font-size:10.5px;color:var(--nm);text-align:right;line-height:1.6}
@media (max-width:700px){ .nvfab .sb{display:none} .nvpanel{width:min(300px,calc(100vw - 40px))} }
@media (prefers-reduced-motion:reduce){.nvfab,.nvpanel,.nvfab .cr{transition:none!important;animation:none!important}}



/* ---------- 左右パネルの開閉・前後移動 ---------- */

/* ---------- プロトタイプが無いときの枡 ---------- */
.nodemo{width:min(560px,100%);background:var(--surface);border:1px dashed var(--line-s);border-radius:var(--r-l);
  padding:38px 30px;text-align:center;color:var(--mute);font-size:13px;line-height:1.9}
.nodemo b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:6px}
.nodemo code{font-size:12px;background:var(--surface-2);border-radius:4px;padding:1px 6px}

/* ---------- 使い方シート ---------- */
.hsec{margin-top:18px}
.hsec:first-child{margin-top:6px}
.hsec h4{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:500;margin-bottom:9px}
.krow{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)}
.krow:first-of-type{border-top:0}
.krow .kk{display:flex;gap:4px;flex-wrap:wrap}
.krow .kt{font-size:13px;line-height:1.7;overflow-wrap:anywhere}
@media (max-width:520px){ .krow{grid-template-columns:84px 1fr;gap:8px} }
.steps{margin:0;padding-left:1.35em;display:flex;flex-direction:column;gap:7px}
.steps li{font-size:13px;line-height:1.8}
.steps code{font-size:12px;background:var(--surface-2);border-radius:4px;padding:1px 6px}
.steps b{color:var(--g-d)}

/* ---------- 画面幅に合わせる ---------- */
.panetabs{display:none}
@media (max-width:1400px){ :root{--wRail:244px;--wInsp:352px;--wFlow:430px} }
@media (max-width:1180px){ :root{--wRail:214px;--wInsp:312px;--wFlow:380px} }

@media (min-width:1001px){
  /* たたんだ左パネル。消さずにアイコンだけの帯にして、
     マウスを乗せている間（.peek）だけ元の幅で手前にせり出す。中央の枠は動かさない */
  body[data-rail="0"]{--wRail:54px}
  /* 帯の見た目は「.rail の中だけ」に効かせる。ここを広く書くと、
     body 直下に出すフライアウトの中身まで消える */
  body[data-rail="0"] .rail{overflow:hidden}
  body[data-rail="0"] .rail .ptabs{display:none}   /* 帯のときはタブを出さず、両方のカテゴリを並べる */
  body[data-rail="0"] .rail #railScreens{padding:0 8px;overflow:hidden}
  body[data-rail="0"] .rail .rsearch{justify-content:center;padding:6px 0 20px}
  body[data-rail="0"] .rail .rsearch > svg,
  body[data-rail="0"] .rail .rsearch input,
  body[data-rail="0"] .rail .rsearch kbd{display:none}
  body[data-rail="0"] .rail .rh{justify-content:center;padding:7px 0;margin-bottom:2px}
  body[data-rail="0"] .rail .rh .gname,
  body[data-rail="0"] .rail .rh .cv{display:none}
  body[data-rail="0"] .rail .rh .gi{width:17px;height:17px;margin:0}
  body[data-rail="0"] .rail .rh .gi svg{width:17px;height:17px}
  body[data-rail="0"] .rail section+section{margin-top:12px}
  /* 帯に残すのは、いま見ている画面の番号だけ。どこにいるかは見えるようにしておく */
  body[data-rail="0"] .rail .slist button:not([aria-current="true"]){display:none}
  body[data-rail="0"] .rail .slist button{display:block;padding:2px 0;background:none;box-shadow:none}
  body[data-rail="0"] .rail .slist .sn,
  body[data-rail="0"] .rail .slist .rt{display:none}
  body[data-rail="0"] .rail .slist .sid{display:block;width:max-content;min-width:27px;margin:0 auto}
  body[data-rail="0"] .rail .slist .sub{margin:0;padding:0;border:0}
  body[data-rail="0"] .rail .slist .tg{display:none}
  /* フロー表示では左の列を畳み、右の列はプロトタイプの幅にする
     （帯の 54px や畳んだ仕様パネルの 0px より後に書いて上書きする） */
  body[data-view="flow"]{--wRail:0px;--wInsp:var(--wFlow)}
}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}
  .topbar{height:auto;padding:11px 14px;flex-wrap:wrap;gap:10px;grid-column:1;grid-row:1}
  .fact{display:none}
  /* 画面をまず見せて、一覧と仕様はタブで切り替える */
  .grip{display:none}   /* 積み上げのときは境目が無い */
  /* 上の body[data-view="flow"] .flowview と詳細度を合わせないと、
     狭い画面でも2列目に置かれて段組みが壊れる */
  .flowview,body[data-view="flow"] .flowview{grid-column:1;grid-row:3;height:calc(100dvh - 58px)}
  .refview{grid-column:1;grid-row:3}
  body[data-view="ref"] .panetabs,body[data-view="release"] .panetabs{display:none}
  .refwrap{padding:16px 14px 40px;gap:18px}
  .dlist{grid-template-columns:1fr;gap:2px 0}
  .dlist dd{margin-bottom:8px}
  body[data-view="flow"] .panetabs,body[data-view="flow"] .rail,body[data-view="flow"] .stage{display:none}
  .panetabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px;grid-column:1;grid-row:2;
    background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .panetabs button{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--mute)}
  .panetabs button[aria-selected="true"]{background:var(--g-l);border-color:var(--g-line);color:var(--g-d);font-weight:500}
  .stage{grid-column:1;grid-row:3}
  .rail{grid-column:1;grid-row:4;border-right:0;border-top:1px solid var(--line);max-height:62vh}
  .insp{grid-column:1;grid-row:4;border-left:0;border-top:1px solid var(--line)}
  body[data-pane="rail"] .insp{display:none}
  body[data-pane="insp"] .rail{display:none}
  .ih{position:static}
  .canvas{padding:16px 16px 76px}   /* 下はツールバーのぶんを空ける */
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 印刷（いま開いている画面を1枚に） ---------- */
@media print{
  @page{margin:12mm}
  html,body{background:#fff}
  .shell{display:block;height:auto}
  .rail,.panetabs,.grip,.nvsw,.tbar,.sizepop,.fzoom,.vsw,.pill.loglink,.pill.back,.insp .seg,.links{display:none!important}
  .topbar{border-bottom:1px solid #ccc;padding:0 0 8px}
  .stage,.insp{display:block;border:0;overflow:visible}
  .canvas{overflow:visible;padding:0;background:#fff}
  .insp{border-top:1px solid #ccc;margin-top:10mm}
  .ih{position:static;padding:0 0 10px}
  .ib{padding:0}
  .sec{break-inside:avoid;page-break-inside:avoid}
  .live{border:1px solid #ddd}
}
</style>

</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="wm">
      <span class="mk"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
      <h1 id="pjTitle">画面設計</h1>
    </div>
    <div class="vsw" role="group" aria-label="表示の切り替え">
      <button type="button" data-view="screen" aria-pressed="true">詳細</button>
      <button type="button" data-view="flow" aria-pressed="false">フロー</button>
      <button type="button" data-view="ref" aria-pressed="false">前提</button>
      <button type="button" data-view="release" aria-pressed="false">リリース</button>
    </div>
    <div class="grow"></div>
  </header>

  <div class="panetabs" role="tablist" aria-label="表示する情報">
    <button type="button" role="tab" data-pane="rail" aria-selected="false">画面一覧</button>
    <button type="button" role="tab" data-pane="insp" aria-selected="true">この画面の仕様</button>
  </div>

  <nav class="rail">
    <div class="ptabs" role="tablist" aria-label="端末の切り替え">
      <button class="ptab" type="button" role="tab" data-pf="admin" aria-selected="true">管理画面</button>
      <button class="ptab" type="button" role="tab" data-pf="app" aria-selected="false">アプリ</button>
    </div>
    <div id="railScreens"></div>
    <div class="rsearch">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="search" id="railQ" placeholder="画面を検索" aria-label="画面を検索" autocomplete="off">
      <kbd>⌘K</kbd>
      <button class="rtg" id="tgRail" type="button" aria-expanded="true" title="左パネルをたたむ（[）" aria-label="左パネルをたたむ">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    </div>
  </nav>

  <main class="stage">
    <div class="canvas" id="canvas"><div class="fitwrap" id="fit"></div></div>
    <div class="tbar">
      <button class="dim" id="stSize" type="button" aria-expanded="false" title="枠の大きさを変える"></button>
      <span class="sep"></span>
      <label class="stw" id="stStateWrap"><span class="sl">状態</span>
        <select id="stState" aria-label="画面の状態を切り替える"></select></label>
      <span class="sep" id="stSep2"></span>
      <a class="demolink" id="openDemo" href="nqrepo-demo.html" target="_blank" rel="noopener" title="この画面をプロトタイプ本体で開く"><span class="dlt">プロトタイプで開く</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
    </div>
  </main>

  <aside class="insp" id="insp"></aside>
  <section class="flowview" id="flowview" hidden><div class="fwrap" id="fwrap"></div></section>
  <section class="refview" id="refview" hidden></section>
  <section class="refview relview" id="relview" hidden></section>

  <button class="grip g-rail" type="button" data-side="rail" aria-label="画面一覧の幅を変える（←→で調整）" title="ドラッグで幅を変える（下限で止まります）"><i></i></button>
  <button class="grip g-insp" type="button" data-side="insp" aria-label="仕様パネルの幅を変える（←→で調整）" title="ドラッグで幅を変える（下限で止まります）"><i></i></button>
<div class="nvsw" id="nvSw">
  <div class="nvpanel" id="nvPanel" hidden>
    <div class="nvsec" id="nvDocs"><p class="nvh">資料</p></div>
    <div class="nvsec" id="nvRoleSec" hidden><p class="nvh">権限（管理画面のロール）</p><div id="nvRole"></div></div>
    <div class="nvfoot"><span class="nvkey" style="margin-left:0"><b>Esc</b> で閉じる</span></div>
  </div>
  <button class="nvfab" id="nvFab" type="button" aria-expanded="false" aria-controls="nvPanel">
    <span class="dt"></span><span class="lb">画面設計</span>
    <svg class="cr" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>
  </button>
</div>

<script>
/* =========================================================================
   ■ この資料を別のプロジェクトで使うとき
     書き換えるのはここに並ぶものだけ。描画・検索・履歴・印刷はそのまま動く。
       ① PROJECT   資料の名前／関連資料／端末の枡
       ② SCREENS   画面の定義
       ③ FLOW・FLOW_IN  画面の遷移（「フロー」の矢印。空でもよい）
       ④ ROLES・ACCESS  役割と権限 ／ ⑤ STATES 記録の一生（いまは図に出さない）／ ⑥ CASES ユースケース
       ⑦ PERSONAS・SCALE・TERMS  利用者・規模・用語（「前提」に出る）
       ⑧ FIELDS 項目定義 ／ ⑨ BUILT プロトタイプで動く範囲
       ⑩ ACCESS_POLICY・CRUD・AUDIT・APPROVAL  権限の方針・操作ログ・承認経路
       ⑪ LOG・LOG_DOC   更新履歴
       ⑫ AS_IS・NEW_ONLY 現行システムとの対応（無ければ {} のままでよい）
       ⑬ RELEASES       リリース（開発 Ver ごとの状態・期間・ねらい・追加した帳票）。ヘッダーの「リリース」で出す
     プロトタイプがまだ無いプロジェクトは PROJECT.demo を null にすると、
     枡の代わりに案内が出て、他の機能はそのまま使える。
   ========================================================================= */
const PROJECT = {
  key:  'nqrepo',                      /* 表示状態の保存キー。プロジェクトごとに変える */
