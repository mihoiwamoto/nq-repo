<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NQリポ（食品工場管理システム）のプロトタイプ。アプリで点検して提出 → 管理画面で確認 → 承認 → データ検索、がひとつの状態でつながって動く。">
<title>NQリポ プロトタイプ</title>
<style>
/* ===========================================================
   NQリポ プロトタイプ（管理画面＝PC 1280×760 ／ アプリ＝タブレット 768×1024）
   見た目は NQrepo（React 実装）の Tailwind クラスをそのまま CSS に写している。
   色は src/index.css の --semantic-* と同じ値。文字は body で bold（React の body と同じ）。
   =========================================================== */
:root{
  --g:#009944; --dn:#f34949; --page:#f1efea; --sf:#ffffff;
  --ink:#333333; --mute:#808080; --dis:#b5b5b5;
  --caution:#dcaa14; --done:#4b9ff8; --err:#f85c5c; --ok:#19c95f;
  --line:#d0d0d0;
  --s1:0 2px 2px rgba(51,51,51,.16); --s2:0 2px 2px rgba(51,51,51,.24); --s3:0 2px 3px rgba(51,51,51,.24);
  --s4:0 2px 4px rgba(51,51,51,.16); --s5:0 2px 4px rgba(51,51,51,.24); --s6:0 2px 6px rgba(51,51,51,.24);
  --t-ui:.14s;
}
*{box-sizing:border-box;border-width:0;border-style:solid;border-color:var(--line)}
html,body{margin:0;height:100%}
body{background:#dfe3e8;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px;line-height:1.5;font-weight:700;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,dl,dd,dt,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;padding:0;text-align:center}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
input::placeholder,textarea::placeholder{color:var(--mute);font-weight:400}
img{max-width:100%;display:block}
input,textarea{outline:none;background:#fff}

/* ---------- Tailwind と同じ寸法のユーティリティ（使う分だけ） ---------- */
.f{display:flex}.fc{flex-direction:column}.ic{align-items:center}.is{align-items:flex-start}.ie{align-items:flex-end}.ib{align-items:baseline}
.jb{justify-content:space-between}.jc{justify-content:center}.je{justify-content:flex-end}
.f1{flex:1 1 0%;min-width:0}.mn0{min-width:0}.sh0{flex-shrink:0}.wrap{flex-wrap:wrap}.wf{width:100%}.hf{height:100%}.wfit{width:fit-content}
.rel{position:relative}.abs{position:absolute}.ovh{overflow:hidden}.ovy{overflow-y:auto;overflow-x:hidden}.ovx{overflow-x:auto}
.g0{gap:0}.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g5{gap:20px}.g6{gap:24px}.g8{gap:32px}.g10{gap:40px}.g20{gap:80px}
.p2{padding:8px}.p3{padding:12px}.p4{padding:16px}.p6{padding:24px}
.px2{padding-left:8px;padding-right:8px}.px3{padding-left:12px;padding-right:12px}.px4{padding-left:16px;padding-right:16px}.px6{padding-left:24px;padding-right:24px}.px8{padding-left:32px;padding-right:32px}
.py1{padding-top:4px;padding-bottom:4px}.py2{padding-top:8px;padding-bottom:8px}.py3{padding-top:12px;padding-bottom:12px}.py4{padding-top:16px;padding-bottom:16px}.py6{padding-top:24px;padding-bottom:24px}.py8{padding-top:32px;padding-bottom:32px}.py10{padding-top:40px;padding-bottom:40px}
.tx{font-size:12px;line-height:16px}.ts{font-size:14px;line-height:20px}.tb{font-size:16px;line-height:24px}.tl{font-size:18px;line-height:28px}.txl{font-size:20px;line-height:28px}.t2xl{font-size:24px;line-height:32px}
.w3{font-weight:300}.w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.ci{color:var(--ink)}.cm{color:var(--mute)}.cg{color:var(--g)}.cd{color:var(--dn)}.cw{color:#fff}.cok{color:var(--ok)}.cerr{color:var(--err)}
.bw{background:#fff}.bg{background:var(--g)}.bp{background:var(--page)}.bdn{background:var(--dn)}.bline{background:var(--line)}
.r8{border-radius:8px}.rf{border-radius:9999px}.r6{border-radius:6px}.r4{border-radius:4px}
.s1{box-shadow:var(--s1)}.s2{box-shadow:var(--s2)}.s3{box-shadow:var(--s3)}.s4{box-shadow:var(--s4)}.s5{box-shadow:var(--s5)}.s6{box-shadow:var(--s6)}
.bd{border-width:1px}.bd2{border-width:2px}.bt{border-top-width:1px}.bb{border-bottom-width:1px}.bb2{border-bottom-width:2px}
.bcg{border-color:var(--g)}.bci{border-color:var(--ink)}.bcm{border-color:var(--mute)}.bcd{border-color:var(--dn)}.bcerr{border-color:var(--err)}.bct{border-color:transparent}
.tc{text-align:center}.tr{text-align:right}.tlf{text-align:left}.nw{white-space:nowrap}.tr1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv:hover{background:rgba(255,255,255,.1)}
.pe{pointer-events:none}
.mask{display:inline-block;flex:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.sq{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ln1{line-height:1}.ln14{line-height:1.4}.ln16{line-height:1.6}

/* ---------- 置き場（端末の枡） ---------- */
.rig{min-height:100%;display:flex;flex-direction:column}
.hold{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 20px 90px;min-height:100vh}
.hold.wide{align-items:flex-start}
/* タブレット枡。中の座標は常に 768×1024（React 側の .app-viewport-frame と同じ） */
.tab{width:768px;height:1024px;background:var(--g);border-radius:26px;border:11px solid #1c2226;box-shadow:0 26px 60px rgba(0,0,0,.30);overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none}
/* PC 枡（ブラウザ風） */
.win{width:1280px;height:760px;background:var(--page);border-radius:12px;box-shadow:0 26px 60px rgba(0,0,0,.24);overflow:hidden;position:relative;display:flex;flex:none}
/* ---- 画面設計（nqrepo-screen-design.html）から ?frame=1 で呼ばれるとき ----
   枡は呼び出し側が描くので、中身だけを iframe いっぱいに出す */
html.frame body{background:var(--page)}
html.frame .hold{padding:0;align-items:stretch;min-height:100vh}
html.frame .tab,html.frame .win{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}
html.frame .nvsw{display:none}

/* ---------- 管理画面（AdminLayout / AdminSidebar / AdminHeader） ---------- */
.ad{display:flex;width:100%;height:100%;background:var(--page)}
.snav{width:256px;flex:none;background:var(--g);box-shadow:var(--s3);padding:0 8px;display:flex;flex-direction:column;justify-content:space-between;height:100%;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:transparent transparent}
.snav:hover{scrollbar-color:rgba(255,255,255,.4) transparent}
.nvi{display:flex;align-items:center;gap:12px;height:48px;padding:8px 24px;border-radius:8px;width:100%}
.nvi:hover{background:rgba(255,255,255,.1)}
.nvi.on{background:#fff}
.nvi.sub{padding:8px 16px 8px 40px;gap:8px}
.nvi span{text-align:left}
.cbadge{height:20px;min-width:30px;padding:0 6px;border-radius:9999px;background:var(--dn);color:#fff;font-size:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cbadge.cp{min-width:20px}
.admain{flex:1;min-width:0;display:flex;flex-direction:column;width:100%}
.ahd{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;height:64px;background:var(--g);box-shadow:var(--s4);flex:none;z-index:5}
.logo{width:40px;height:40px;border-radius:6.4px;background:#fff;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.acct{height:40px;padding:0 80px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:var(--ink);box-shadow:var(--s5)}
.umenu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:50;background:#fff;box-shadow:var(--s6);border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;padding:8px 0}
.umenu button{width:100%;padding:12px 24px;font-size:18px;line-height:28px;color:var(--g);text-align:left}
.umenu button:hover{background:var(--page)}
.mbk{position:fixed;inset:0;z-index:4}
.abody{flex:1;min-height:0;overflow:auto;width:100%}
.ptb{background:var(--page);box-shadow:var(--s1);display:flex;align-items:center;justify-content:space-between;padding:32px 24px}
.ptb.p6{padding:24px}
.h28{font-size:28px;line-height:1.4;font-weight:600;color:var(--ink)}
/* ボタン（React の className をそのまま） */
.bp1{background:var(--g);box-shadow:var(--s2);height:40px;width:120px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:16px;line-height:24px}
.bo1{background:#fff;border:1px solid var(--g);box-shadow:var(--s2);height:40px;width:80px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:var(--g)}
.brs{background:#fff;border:1px solid var(--mute);height:40px;width:80px;border-radius:8px;font-size:14px;line-height:20px;color:var(--mute)}
.inp{background:#fff;border:1px solid var(--line);height:48px;padding:0 16px;border-radius:8px;font-size:16px;line-height:24px;color:var(--ink)}
.chip6{height:24px;width:80px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:#fff;flex:none}
.chip8{height:32px;width:80px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:#fff;flex:none}
.stag{height:28px;width:88px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:#fff;flex:none}
.tabs2{display:flex;align-items:center;border-bottom:2px solid var(--line);width:100%}
.tabs2 button{position:relative;height:48px;width:156px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:20px;line-height:28px;color:var(--mute)}
.tabs2 button[aria-selected="true"]{border-color:var(--g);color:var(--g)}
.tabs2 .cbadge{position:absolute;top:-8px;left:122px}
/* 一覧の表（flex で組む。React と同じ） */
.thd{background:#f6f6f6;display:flex;height:40px;align-items:center;width:100%}
.thd.h50{height:50px}.thd.h14{height:56px}
.trw{display:flex;height:56px;align-items:center;width:100%}
.trw.alt{background:#ddf3e7}.trw.wh{background:#fff}
.tcl{height:100%;display:flex;align-items:center;padding:0 8px}
.tcl p{font-size:14px;line-height:20px}
.tcc{display:flex;align-items:center;justify-content:center;padding:8px;height:100%;flex:none;font-size:14px;line-height:20px;color:var(--ink);text-align:center}
.tcc.ng{background:#f85c5c}
.pgb{background:#fff;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:var(--ink)}
.pgb:disabled{opacity:.4}
.pgb.on{background:var(--g);color:#fff}
/* プルダウン（Pulldown.tsx） */
.pdw{position:relative}
.pdb{display:flex;align-items:center;gap:8px}
.pdb:disabled{cursor:not-allowed}
.pdl{position:absolute;top:100%;left:0;margin-top:4px;background:#fff;box-shadow:0 0 3px rgba(51,51,51,.24);border-radius:8px;padding:8px;min-width:100%;width:max-content;max-height:290px;overflow-y:auto;z-index:50}
.pdl button{display:flex;height:42px;align-items:center;padding:0 8px;border-radius:8px;width:100%;text-align:left;font-size:16px;line-height:24px;white-space:nowrap;color:var(--ink)}
.pdl button:hover{background:var(--page)}
.pdl button.on,.pdl button.on:hover{background:var(--g);color:#fff}
/* 日付（DateFilterInput.tsx） */
.dtw{position:relative;width:200px}
.dtw .ph{position:absolute;left:16px;font-weight:700;font-size:16px;line-height:24px;color:var(--mute);pointer-events:none}
.dtw input{background:#fff;border:1px solid var(--line);height:48px;padding:0 48px 0 16px;border-radius:8px;font-size:16px;line-height:24px;color:var(--ink);width:100%;cursor:pointer}
.dtw .cal{position:absolute;right:16px;width:20px;height:20px;cursor:pointer}
.dtp{position:absolute;top:100%;left:0;margin-top:8px;background:#fff;border-radius:8px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);z-index:50;padding:16px;width:280px}
.dtp .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dtp .dy{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;border-radius:9999px;color:var(--ink)}
.dtp .dy:hover{background:var(--g);color:#fff}
.dtp .dy.on{background:var(--g);color:#fff}
.dtp .dy:disabled{color:#d1d5db;background:none}
.mpk{position:absolute;top:100%;margin-top:8px;left:50%;transform:translateX(-50%);z-index:50;background:#fff;box-shadow:var(--s6);border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:16px;width:392px}
.mpk .mo{height:48px;width:120px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:var(--ink)}
.mpk .mo.on{background:var(--g);color:#fff}
.mnb{background:#fff;border:1px solid var(--g);box-shadow:var(--s2);width:40px;height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
/* ダイアログ */
.ov{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.ov .bg40{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.ov .bg50{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.ov .bg33{position:absolute;inset:0;background:rgba(51,51,51,.5)}
.dlg{position:relative;background:var(--page);box-shadow:var(--s3);border-radius:8px;display:flex;flex-direction:column;gap:40px;align-items:center;padding:40px 24px;width:640px;max-width:100%}
.dlgw{position:relative;background:#fff;box-shadow:var(--s3);border-radius:8px;display:flex;flex-direction:column;gap:24px;align-items:center;padding:32px}
.b48{height:48px;width:200px;border-radius:8px;font-size:16px;line-height:24px;display:inline-flex;align-items:center;justify-content:center}
.b64{height:64px;width:240px;border-radius:8px;font-size:20px;line-height:28px;display:inline-flex;align-items:center;justify-content:center}
.toast{position:absolute;bottom:24px;right:0;z-index:50}
.toast .in{color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;max-width:384px;background:#22c55e;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:190;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;line-height:1.6;font-weight:400;box-shadow:var(--s6);max-width:380px;animation:up .22s cubic-bezier(.2,1,.3,1)}
.tst b{color:#7fe0b2;font-weight:600}
@keyframes up{from{transform:translateY(10px)}to{transform:none}}
/* チェックボックス（accent） */
.ckb{width:16px;height:16px;accent-color:var(--g);margin:0}
/* ログイン（AdminLoginPage） */
.lg-ad{min-height:100%;width:100%;background:var(--page);overflow:auto}
.lg-ad header{height:64px;display:flex;align-items:center;background:var(--g);box-shadow:var(--s2);width:100%}
.lg-ad .fm{display:flex;justify-content:center;padding:144px 24px 40px}
.lg-ad .inp0{background:#fff;height:48px;padding:0 16px;border-radius:8px;font-size:16px;line-height:24px;color:var(--ink);width:100%}
.lg-ad .inp0.err{border:1px solid var(--err)}
/* ガイド › 変更履歴。画面設計（nqrepo-screen-design.html）の「更新履歴」と同じ形：
   日付ごとに区切り、行は 画面 ID の印＋変更内容＋Ver の印。左の一覧か ID の印で 1 画面に絞る */
.chg{display:flex;align-items:flex-start;gap:24px;padding:16px 24px 40px}
.chg aside{width:280px;flex:none;display:flex;flex-direction:column;gap:2px}
.chg aside .grp{font-size:11px;color:var(--mute);padding:12px 10px 4px}
.chsc{width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-align:left;color:var(--ink)}
.chsc:hover{background:rgba(255,255,255,.7)}
.chsc.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chsc .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chsc .n{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.who{display:inline-flex;align-items:center;justify-content:center;min-width:54px;font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px;line-height:1.5;white-space:nowrap}
.who.doc{color:var(--g);border-color:#9fd4bc;background:#e6f4ec}
button.who:hover{border-color:var(--g);color:var(--g)}
.chseg{display:flex;gap:3px;background:#ececec;border-radius:9999px;padding:3px}
.chseg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:9999px;color:var(--mute);white-space:nowrap;overflow:hidden}
.chseg button .lb{overflow:hidden;text-overflow:ellipsis}
.chseg button .n{font-size:11px;font-variant-numeric:tabular-nums}
.chseg button:hover{color:var(--ink)}
.chseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--s1)}
.lhint{font-size:11.5px;line-height:1.6;color:var(--mute);font-weight:400}
.logday{margin-top:16px}
.logday:first-child{margin-top:0}
.logday .dt{font-size:12px;font-weight:700;color:var(--mute);padding:6px 0;border-bottom:1px solid #ececec;font-variant-numeric:tabular-nums}
.logday ul{margin:8px 0 0;display:flex;flex-direction:column;gap:7px}
.logday li{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:baseline}
.logrow{display:flex;align-items:flex-start;gap:8px;min-width:0}
.logrow .tx{flex:1;min-width:0;font-size:13px;line-height:1.7;font-weight:400;color:var(--ink)}
.logrow .vchip{margin-top:1px;height:20px;font-size:11px;padding:0 7px}
.hist{display:flex;flex-direction:column;gap:9px}
.hist li{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:baseline}
.hist .hd{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
/* 開発Ver管理 */
.vchip{display:inline-flex;align-items:center;gap:6px;border-radius:9999px;font-weight:700;padding:0 8px;height:24px;font-size:12px}
.vchip.lg{padding:0 12px;height:32px;font-size:15px}
.vchip i{display:inline-block;width:8px;height:8px;border-radius:9999px}
.sbadge{display:inline-flex;align-items:center;gap:6px;padding:0 8px;height:24px;border-radius:9999px;font-size:11px;font-weight:700}
.sbadge i{display:inline-block;width:6px;height:6px;border-radius:9999px;background:#fff}
.vli{width:100%;text-align:left;border-radius:8px;border:1px solid #dcdcdc;padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.7)}
.vli.on{background:#fff;border-color:var(--g);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.vsec{background:#fff;border-radius:8px;border:1px solid #dcdcdc;padding:24px;display:flex;flex-direction:column;gap:16px}
/* ヘルプ */
.faq{background:#fff;box-shadow:var(--s5);border-radius:8px;overflow:hidden;width:100%}

/* ---------- アプリ（AppLayout / AppRail / AppHeader） ---------- */
.ap{display:flex;width:100%;height:100%;background:var(--g)}
.rail{width:64px;flex:none;background:var(--g);display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0}
.rail .grp{display:flex;flex-direction:column;gap:20px;align-items:center;width:100%}
.rail .it{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.rail .it .bx{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center}

  const arrow = (d, ic) => `<button type="button" class="mnb" onclick="S.ad.ym=ymShift(S.ad.ym,${d});render()" aria-label="${d<0?'前の月':'次の月'}">${mk(`common/${ic}.svg`,20,'var(--g)')}</button>`;
  if (kind==='appr') return `<div class="f ic jb wf">${arrow(-1,'arrow-left')}<p class="txl ci">${y}年${M}月_使用水の点検</p>${arrow(1,'arrow-right')}</div>`;
  return `<div class="rel f ic jb">${arrow(-1,'arrow-left')}
    <button type="button" class="f ic g1 txl ci" onclick="event.stopPropagation();S.ad.mp=S.ad.mp?null:{y:${y}};render()">${y}年${M}月${mk('common/pulldown.svg',12,'currentColor')}</button>${arrow(1,'arrow-right')}
    ${S.ad.mp ? `<div class="mpk" onclick="event.stopPropagation()"><div class="f ic jb py2 wf">
        <button type="button" class="ci txl" onclick="S.ad.mp.y--;render()">${mk('common/arrow-left.svg',20,'currentColor')}</button><p class="txl ci">${S.ad.mp.y}</p><button type="button" class="ci txl" onclick="S.ad.mp.y++;render()">${mk('common/arrow-right.svg',20,'currentColor')}</button></div>
      <div class="f wrap" style="width:360px">${Array.from({length:12},(_,i)=>`<button type="button" class="mo ${S.ad.mp.y===Number(y)&&i+1===M?'on':''}" onclick="S.ad.ym='${S.ad.mp.y}-'+pad2(${i+1});S.ad.mp=null;render()">${i+1}月</button>`).join('')}</div></div>` : ''}</div>`;
}
function adRecordList(kind){
  const K = KIND[kind];
  const ym = S.ad.ym;
  const rows = listOf().filter(K.filter).filter(r => ymOf(r.date)===ym && (!S.ad.fDate || r.date===S.ad.fDate) && (!S.ad.fPoint || r.location===S.ad.fPoint)
      && (kind!=='search' || r.location===S.ad.pt) && (kind!=='conf' || !S.ad.fSt || r.st===S.ad.fSt)
      && (kind!=='appr' || !S.ad.fRej || r.st==='rejected') && (kind==='appr' || !S.ad.fAbn || hasNG(r)))
    .sort((a,b)=> (a.date+a.time) < (b.date+b.time) ? 1 : -1);
  const cols = [...K.cols, ...COLS_REST];
  const cell = (w, inner, cls='', style='') => `<div class="tcc ${cls}" style="width:${w}px;${style}">${inner}</div>`;
  const check = (r,k) => r.checks[k]==='ng'
    ? cell(48, im('common/x-mark.svg',20,'異常あり'), 'ng', kind==='appr'?'':'padding:0')
    : cell(48, kind==='appr' ? `<span class="cg">${CHECK_PATH(24,'currentColor')}</span>` : im('common/checkmark.svg',20,'正常'));
  const chl = r => r.chlorineRep
    ? `<div class="f fc ic jc g1 p2 hf sh0" style="width:100px;background:#f85c5c"><span class="tb w7 cw">${r.chlorine}</span><span class="f ic g1 tx cw">${kind==='appr' ? CHECK_PATH(14,'#fff') : kind==='conf' ? mk('common/checkmark.svg',12,'#fff') : CBOX_SVG}補充</span></div>`
    : cell(100, r.chlorine);
  let lastDate = '', g = -1;
  const reset = kind==='appr' ? "S.ad.fDate='';S.ad.fPoint='';S.ad.fRej=false;render()" : "S.ad.fSt='';S.ad.fDate='';S.ad.fPoint='';S.ad.fAbn=false;render()";
  const ptOpts = [...new Set(listOf().filter(K.filter).map(r=>r.location))].map(n=>[n,n]);
  const filt = `<div class="bw f fc g4 is p4 r8 wf">
    <button type="button" class="f ic g2 tb cg" onclick="S.ad.fo['${kind}']=!${fo(kind,true)};render()"><span>絞り込み検索</span>${fo(kind,true) ? mk('common/minus.svg', kind==='appr'?16:20, 'var(--g)') : '<span>+</span>'}</button>
    ${fo(kind,true) ? `<div class="f g6 ${kind==='appr'?'ie jb':'ic je'} wf"><div class="f fc g4 f1"><div class="f g4 ic">
        ${kind==='conf' ? pulldown('fSt', S.ad.fSt, Object.entries(CF_ST).map(([k,[l]])=>[k,l]), 'ステータス', v=>{S.ad.fSt=v;}) : ''}
        ${dateInput('fDate', S.ad.fDate, v=>{S.ad.fDate=v;})}
        ${pulldown('fPoint', S.ad.fPoint, ptOpts, '点検場所', v=>{S.ad.fPoint=v;})}</div>
      <label class="f g2 ic tb cm"><input type="checkbox" class="ckb" ${(kind==='appr'?S.ad.fRej:S.ad.fAbn)?'checked':''} onchange="S.ad.${kind==='appr'?'fRej':'fAbn'}=this.checked;render()">${kind==='appr'?'差し戻しのものだけ表示':'異常があるものだけ表示'}</label></div>
      ${filtBtns(kind, reset)}</div>` : ''}</div>`;
  const table = `<div class="wf r8 ovx"><div class="f fc" style="min-width:${K.minW}px">
    <div class="thd h50">${cols.map(([l,w],i)=>`<div class="tcc cg ${i===cols.length-1&&kind==='search'?'':''}" style="width:${w}px;${i===cols.length-1&&kind==='search'?'padding-right:24px':''}">${l}</div>`).join('')}</div>
    ${rows.length ? rows.map(r=>{ if (r.date!==lastDate){ g++; lastDate = r.date; }
      return `<div class="trw ${g%2===1?'alt':'wh'}">
        ${cell(96, `<button type="button" class="bo1" style="width:${kind==='appr'?80:64}px" onclick="adGo('${K.detail}',{rid:'${r.id}'})">詳細</button>`)}
        ${K.st ? cell(K.cols[1][1], K.st(r)) : ''}
        ${cell(80, shortDate(r.date))}${cell(72, r.time)}${cell(K.cols[K.cols.length-1][1], esc(r.location))}
        ${CHECKS.map(([k])=>check(r,k)).join('')}
        ${cell(48, r.ph, '', 'white-space:nowrap')}${chl(r)}${cell(100, r.uvHours)}
        ${cell(100, r.uvLight, r.uvLight==='消灯'?'cd':'')}${cell(100, r.abnLight, r.abnLight==='点灯'?'cd':'')}
        ${cell(100, esc(r.implementer))}${cell(100, esc(r.confirmer||''), '', 'padding-right:24px')}</div>`; }).join('')
    : `<p class="bw p6 tb cm">該当するデータがありません</p>`}</div></div>`;
  const dlBtn = `<button type="button" class="mnb cg" title="CSVダウンロード" onclick="S.ad.dl=true;render()">${mk('common/download.svg',20,'currentColor')}</button>`;
  if (kind==='appr'){
    return ptb('データ一覧',{back:`adGo('approvals')`}) + crumbs([K.root, ['データ一覧']]) + `<div class="f fc ic g6 p6"><div class="f fc g6 is wf">
      <div class="bw f ic r8 wfit" style="padding:8px 16px"><p class="txl ci">${esc(FACTORY)}</p></div>${filt}
      <div class="f fc g2 is wf">${monthNav('appr', ym)}${table}</div></div>
      <button type="button" class="bg s2 r8 txl cw" style="height:48px;width:400px" ${canApprove()&&rows.some(r=>r.st==='pending')?'':'disabled'} onclick="S.ad.dlg={k:'approveAll'};render()">承認する</button></div>`;
  }
  if (kind==='conf'){
    return ptb('データ一覧',{back:`adGo('confFactories')`}) + crumbs([K.root, ['工場選択',`adGo('confFactories')`], ['データ一覧']]) + `<div class="f fc g10 p6">
      <div class="bw f ic r8 wfit" style="padding:8px 16px"><p class="txl ci">${esc(FACTORY)}</p></div>${filt}${monthNav('conf', ym)}${table}</div>`;
  }
  return ptb('データ一覧',{back:`adGo('searchPoints')`, action:dlBtn}) + crumbs([K.root, ['工場選択',`adGo('searchFactories')`], ['点検場所選択',`adGo('searchPoints')`], ['データ一覧']]) + `<div class="f fc g10 p6">
    <div class="f ic g4">${fchip(FACTORY)}${fchip(S.ad.pt)}</div>${filt}${monthNav('search', ym)}${table}</div>`;
}
</script>
<script>
/* ---- 記録の詳細（approvals / confirmations / data-search の RecordDetailPage.tsx。操作だけ違う） ---- */
function adDetail(kind){
  const K = KIND[kind];
  const r = recOf(S.ad.rid) || S.records[0];
  const ts = `${jpDate(r.date)} ${r.time}`;
  const stamp = `<p class="tsr">${esc(r.implementer)} ${ts}</p>`;
  const sep = `<div class="bt wf"></div>`;
  const kv = (k,v,cls='') => `<div class="f ic jb wf"><p class="txl ci">${k}</p><p class="txl ${cls||'ci'}">${v}</p></div>`;
  const checkRow = ([k,l]) => { const ng = r.checks[k]==='ng'; const d = r.ng[k]||{};
    return `<div class="f fc ${kind==='appr'?'g1':'g2'} is wf"><div class="f ic jb wf"><p class="txl ci">${l}</p><span class="stag" style="background:${ng?'#f85c5c':'#19c95f'}">${ng?'異常あり':'正常'}</span></div>
      ${ng ? `<div class="f fc g1 is px2 tb cm wf"><p>原因：${esc(d.cause||'不明')}</p><p>対応：${esc(d.action||'記録なし')}</p></div>` : ''}${stamp}</div>${sep}`; };
  const flag = (on, lb) => on ? `<span class="f ic g1 tb" style="color:#19c95f">${im('common/checkmark.svg',16)}${lb}</span>` : '';
  const stOpts = kind==='appr' ? Object.entries(AP_ST).map(([k,[l]])=>[k,l]) : Object.entries(CF_ST).map(([k,[l]])=>[k,l]);
  const stColor = kind==='appr' ? AP_ST[r.st][1] : (CF_ST[r.st]||CF_ST.pending)[1];
  const top = kind==='search'
    ? `<div class="f ic g4">${fchip(FACTORY)}${fchip(r.location)}</div>`
    : `<div class="f ic jb wf">${fchip(FACTORY)}${pulldown('st', r.st, stOpts, '', v=>adStatus(kind, r.id, v), {cls:'bd r8 tb cw', style:`width:240px;background-color:${stColor}`, white:true, disabled: kind==='appr' && r.st!=='pending'})}</div>`;
  const back = kind==='appr' ? `adGo('apprList')` : kind==='conf' ? `adGo('confList')` : `adGo('searchList')`;
  const cr = kind==='appr' ? [K.root, ['データ一覧', back], ['詳細']]
    : kind==='conf' ? [K.root, ['工場選択',`adGo('confFactories')`], ['データ一覧', back], ['詳細']]
    : [K.root, ['工場選択',`adGo('searchFactories')`], ['点検場所選択',`adGo('searchPoints')`], ['データ一覧', back], ['詳細']];
  return ptb('詳細',{back}) + crumbs(cr) + `<div class="f fc g4 p6">${top}
    <div class="bw f fc g3 is r8 wf px4 py6">
      ${kv('実施者', esc(r.implementer))}${sep}${kv('確認者', esc(r.confirmer||''))}${sep}${kv('点検場所', esc(r.location))}${sep}${kv('実施日', ts)}${sep}
      ${CHECKS.map(checkRow).join('')}
      <div class="f fc g1 is wf">${kv('ph値', r.ph)}${stamp}</div>${sep}
      <div class="f fc g2 ie wf">${kv('残留塩素濃度（mg/ℓ）', r.chlorine)}${flag(r.chlorineRep,'塩素補充')}${stamp}</div>${sep}
      <div class="f fc g2 ie wf">${kv('UV殺菌灯稼働時間（h）', r.uvHours)}${flag(r.uvRep,'UV殺菌灯交換')}${stamp}</div>${sep}
      <div class="f fc g1 is wf">${kv('UV表示灯', r.uvLight, r.uvLight==='消灯'?'cd':'')}${stamp}</div>${sep}
      <div class="f fc g1 is wf">${kv('異常検出灯', r.abnLight, r.abnLight==='点灯'?'cd':'')}${stamp}</div>
    </div>
    <div class="f fc g2 is wf"><p class="txl ci">コメント</p>${commentsHTML(r.comments)}
      ${kind==='search' ? '' : `<div class="bw r8 wf p2"><textarea id="cmtIn" rows="3" class="wf tb w3 ci" style="resize:none;border:0;padding:0;display:block" placeholder="ここにテキストを入力" oninput="cmtInput(this)">${esc(S.ad.cmt)}</textarea></div>
      <button type="button" id="cmtBtn" class="b48 s2 cw tb" style="background:${S.ad.cmt.trim()?'var(--g)':'#d0d0d0'}" ${S.ad.cmt.trim()?'':'disabled'} onclick="adComment('${r.id}')">コメントを残す</button>`}</div></div>`;
}
/* Comments.tsx */
function commentsHTML(list){
  return `<div class="bw r8 wf">${list.length ? list.map((c,i)=>`<div><div class="f fc g2 p4"><div class="f fc g1"><p class="w7 cg" style="font-size:20px;line-height:28px">${esc(c.who)}</p><p class="ts cm">${esc(c.at)}</p></div><p class="ci" style="font-size:18px;line-height:28px">${esc(c.text)}</p></div>${i<list.length-1?'<div class="bt" style="margin:0 16px"></div>':''}</div>`).join('')
    : `<p class="tb cm" style="padding:24px 16px">コメントはありません</p>`}</div>`;
}
function cmtInput(el){ S.ad.cmt = el.value; const b = document.getElementById('cmtBtn'); if (!b) return; const ok = !!el.value.trim(); b.disabled = !ok; b.style.background = ok ? 'var(--g)' : '#d0d0d0'; }
function adComment(id){
  const t = S.ad.cmt.trim(); if (!t) return;
  recOf(id).comments.push({who:ACCOUNT.name, at:`${jpDate(today())} ${nowHM()}`, text:t}); S.ad.cmt = ''; render();
}
function adStatus(kind, id, v){
  const r = recOf(id);
  if (kind==='conf'){ r.st = v; if (v==='pending') r.confirmer = r.confirmer || '田村康平'; render(); return; }
  if (v==='approved'){ if (!canApprove()){ say('確認者は承認できません'); return; } S.ad.dlg = {k:'approve', id}; render(); return; }
  if (v==='rejected'){ S.ad.dlg = {k:'reject', id}; render(); return; }
  r.st = v; render();
}
function doApprove(id){ const r = recOf(id); r.st = 'approved'; S.ad.dlg = null; render(); adToast('承認ステータスを更新しました。'); }
function doApproveAll(){ (S.ad.sc==='rxList' ? rxRows(S.ad.rx.slug) : S.records).filter(r=>r.st==='pending').forEach(r=>r.st='approved'); S.ad.dlg = null; adGo('approvals',{tab:'approved'}); adToast('承認しました。'); }
function doReject(id){
  const t = (document.getElementById('rjIn')?.value||'').trim(); if (!t) return;
  const r = recOf(id); r.st = 'rejected'; r.comments.push({who:ACCOUNT.name, at:`${jpDate(today())} ${nowHM()}`, text:t});
  S.ad.dlg = null; render(); adToast('承認ステータスを更新しました。');
}

/* ---- 帳票管理 › 使用水の点検 › 点検場所選択（water-inspection/PointSelectionPage.tsx） ---- */
function adPoints(){
  const tab = S.ad.ptTab;
  const list = tab==='visible' ? S.points : [];
  return ptb('使用水の点検',{back:`adGo('ledgerFactories')`, action:actBtn('+ 新規登録', "S.ad.dlg='addPoint';render()")})
    + crumbs([['帳票管理',`adGo('ledgers')`],['工場選択',`adGo('ledgerFactories')`],['点検場所選択']]) + `<div class="f fc g6 p6">
    ${fchip(FACTORY)}
    <div class="tabs2">${[['visible','アプリ表示中'],['hidden','アプリ非表示']].map(([k,l])=>`<button type="button" aria-selected="${tab===k}" onclick="S.ad.ptTab='${k}';render()">${l}${k==='visible'&&S.points.length?`<span class="cbadge cp" style="height:auto;padding:2px 6px">${S.points.length}</span>`:''}</button>`).join('')}</div>
    <div class="f wrap g6">${list.length ? list.map(([id,n])=>`<button type="button" class="bw s3 r8 f ic txl ci tlf" style="height:80px;width:270px;padding:0 16px" onclick="adGo('ledgerPoint',{pid:'${id}'})">${esc(n)}</button>`).join('') : `<p class="tb cm">該当する点検場所がありません</p>`}</div></div>`;
}
/* ---- 点検場所の詳細（water-inspection/PointDetailPage.tsx） ---- */
const POINT_FIELDS = [['味','記録する'],['臭い','記録する'],['色','記録する'],['濁り','記録する'],['異物','記録する'],['ph','記録する'],['残留塩素濃度','記録する'],['UV殺菌灯稼働時間（h）','記録する'],['UV殺菌灯表示アラート時間(h)','8,000'],['UV表示灯','記録する'],['異常検出灯','記録する']];
function adPointDetail(){
  const p = S.points.find(x=>x[0]===S.ad.pid) || S.points[0];
  const row = (k,v) => `<div class="f g4 ic wf"><div class="sh0 txl cg" style="width:160px">${k}</div><div class="f1 txl ci">${v}</div></div>`;
  const sep = `<div class="bt wf"></div>`;
  return ptb('使用水の点検',{back:`adGo('ledgerPoints')`}) + crumbs([['帳票管理',`adGo('ledgers')`],['工場選択',`adGo('ledgerFactories')`],['点検場所選択',`adGo('ledgerPoints')`],['詳細']]) + `<div class="f fc g4 p6">
    ${fchip(FACTORY)}
    <div class="f ic je wf g2"><button type="button" class="bo1 g1" onclick="adGo('ledgerPointEdit',{pid:'${p[0]}'})">${im('common/edit.svg',20)}編集</button>
      <button type="button" class="bw bd bcd s2 r8 sq" style="height:40px;width:40px" onclick="S.ad.dlg={k:'delPoint',id:'${p[0]}'};render()" aria-label="削除">${im('common/trash.svg',24)}</button></div>
    <div class="bw f fc g6 is r8 wf px4 py6">${row('点検場所', esc(p[1]))}${sep}${row('アプリ表示期間', '指定なし（常に表示）')}${sep}
      ${POINT_FIELDS.map(([k,v],i)=>`<div class="f fc g6 wf">${row(k,v)}${i<POINT_FIELDS.length-1?sep:''}</div>`).join('')}</div></div>`;
}
function doAddPoint(){
  const n = (document.getElementById('ptIn')?.value||'').trim(); if (!n){ say('点検場所名を入力してください'); return; }
  S.points.push(['wp'+uid(), n]); S.ad.dlg = null; adGo('ledgerPointDone');
}
function delPoint(id){
  if (recsOf(id).length){ S.ad.dlg = null; say('記録のある点検場所は削除できません（<b>要確認</b>：仕様として正しいか）'); render(); return; }
  S.points = S.points.filter(p=>p[0]!==id); S.ad.dlg = null; adGo('ledgerPoints'); adToast('削除されました。');
}

/* ---- 一覧の共通部品（絞り込みの箱・flex の表・ページ送り） ---- */
function filtBox(k, def, inner){
  const open = fo(k, def);
  return `<div class="bw f fc g4 is p4 r8 wf"><button type="button" class="f g2 ic tb cg" onclick="S.ad.fo['${k}']=!${open};render()">絞り込み検索 ${open?'−':'+'}</button>${open ? inner : ''}</div>`;
}
/* 列：[見出し, 幅（px か 'f1' か 'f15'）, 見出しの寄せ] */
function ftable(cols, rows, emptyMsg){
  const w = c => c==='f1' ? 'flex:1 1 0%' : c==='f15' ? 'flex:1.5 1 0%' : `width:${c}px;flex:none`;
  return `<div class="f fc is wf r8 ovh">
    <div class="thd">${cols.map(([l,c,al])=>`<div class="tcl" style="${w(c)}"><p class="ts cg ${al==='c'?'tc wf':al==='l'?'tlf wf':''}">${l}</p></div>`).join('')}</div>
    ${rows.length ? rows.map((r,i)=>`<div class="trw ${i%2===1?'alt':'wh'}">${r.map((v,j)=>`<div class="tcl" style="${w(cols[j][1])}">${typeof v==='string' && !v.startsWith('<') ? `<p class="ts ci tr1">${v}</p>` : v}</div>`).join('')}</div>`).join('')
      : `<div class="bw f ic wf px2" style="height:56px"><p class="ts cm">${emptyMsg}</p></div>`}</div>`;
}
function pager(k, total, per){
  const pages = Math.max(1, Math.ceil(total/per)); const pg = Math.min(S.ad.pg[k]||1, pages);
  if (pages<=1) return '';
  const ar = (d, ic) => `<button type="button" class="pgb" ${d<0&&pg<=1||d>0&&pg>=pages?'disabled':''} onclick="S.ad.pg['${k}']=${pg+d};render()">${mk(`common/${ic}.svg`,16,'var(--g)')}</button>`;
  return `<div class="f g2 ic">${ar(-1,'arrow-left')}${Array.from({length:pages},(_,i)=>`<button type="button" class="pgb ${i+1===pg?'on':''}" onclick="S.ad.pg['${k}']=${i+1};render()">${i+1}</button>`).join('')}${ar(1,'arrow-right')}</div>`;
}
const pageOf = (k, list, per) => { const pages = Math.max(1, Math.ceil(list.length/per)); const pg = Math.min(S.ad.pg[k]||1, pages); return list.slice((pg-1)*per, pg*per); };
const opDetail = what => `<button type="button" class="bo1" onclick="noop('${what}')">詳細</button>`;
const qInp = (ph, onin, w) => `<input class="inp sh0" style="width:${w}px" placeholder="${ph}" value="${esc(S.ad.q)}" oninput="${onin}">`;
const facPd = (id, w) => pulldown(id, S.ad.qFac, FACTORIES.map(f=>[f,f]), '工場選択', v=>{S.ad.qFac=v;}, {style:`width:${w||200}px`});
const resetQ = "S.ad.q='';S.ad.qFac='';S.ad.logType='';S.ad.staffRole='';render()";
const roleChip = k => { const [l,bg,tx] = STAFF_ROLE[k]; return `<span class="chip6" style="background:${bg};color:${tx}">${l}</span>`; };

/* ---- 職員管理（StaffListPage.tsx） ---- */
function adStaff(){
  const q = S.ad.q.trim(), role = S.ad.staffRole;
  const rows = S.staff.filter(s => (!q || s.name.includes(q)) && (!role || s.role===role) && (!S.ad.qFac || s.fac===S.ad.qFac));

<script>

const RAIL = [['ledgers','帳票','ledger'],['progress','進捗','progress'],['pending','確認待ち','pending-review'],['schedule','点検予定','schedule'],['size','サイズ','font-size'],['help','ヘルプ','help'],['settings','設定','settings']];
function apGo(sc, extra={}){ Object.assign(S.app, {sc, picker:null, dlg:null, ngDlg:null, panel:false, tip:null, filt:false}, extra); render(); }
/* ---- 左のレール（AppRail.tsx） ---- */
function apRail(){
  const cur = S.app.sc;
  const on = k => k==='ledgers' ? ['ledgers','points','record','confirm','complete'].includes(cur) && !S.app.fromProg
             : k==='progress' ? cur==='progress' || (S.app.fromProg && ['record','confirm','complete'].includes(cur)) : cur===k;
  const badge = k => k==='progress' ? nNotInspected() : k==='pending' ? nPendingApp() : null;
  return `<nav class="rail" aria-label="メニュー">${logo('app')}<div class="grp">
    ${RAIL.map(([k,lb,i])=>`<button type="button" class="it ${on(k)?'on':''}" onclick="${['ledgers','progress','pending','settings'].includes(k)?`apGo('${k}',{fromProg:false})`:`noop('${lb}')`}">
      <span class="bx">${im(`rail/${i}.svg`,24)}</span><span class="lb">${lb}</span>${badge(k)!==null?`<span class="bdg">${pad2(badge(k))}</span>`:''}</button>`).join('')}</div></nav>`;
}
/* ---- 見出し（AppHeader.tsx） ---- */
function apHead(title, action){ return `<header class="aphd"><h1>${esc(title)}</h1>${action||''}</header>`; }
/* ---- 上の帯（AnnouncementBar.tsx）。オフラインそのものの帯は出さない ---- */
function band(){
  const b = S.app.band || (S.app.unsent ? 'unsent' : null); if (!b || S.app.errDlg) return '';
  const att = mk('common/attention.svg',20,'#fff');
  if (b==='success') return `<div class="band" style="background:var(--ok)">${im('common/check.svg',20)}<p>データの送信が完了しました。</p></div>`;
  if (b==='failed')  return `<div class="band" style="background:var(--err)">${att}<p>データの送信ができませんでした。オンライン状態で再度お試しください。</p></div>`;
  return `<div class="band jb" style="background:var(--err)"><div class="f ic g1">${att}<p>未送信のデータがあります。送信ボタンを押してください。</p></div><button type="button" class="send" onclick="apSend()">送信</button></div>`;
}
function apSend(){
  if (S.off || S.err){ S.app.band = 'failed'; render(); return; }
  S.records.forEach(r=>r.unsent=false); S.app.unsent = false; S.app.band = 'success'; render();
  setTimeout(()=>{ if (S.app.band==='success'){ S.app.band = null; render(); } }, 3000);
}
function appView(){
  if (!S.auth.app) return apLogin();
  const sc = S.app.sc;
  const body = ({ledgers:apLedgers, points:apPoints, record:apRecord, confirm:apConfirm, complete:apComplete, progress:apProgress, pending:apPending, settings:apSettings}[sc] || apLedgers)();
  return `<div class="ap">${apRail()}<div class="apbody"><div class="apane">${band()}${body}</div></div></div>${apDlg()}${S.session ? sessionDlg() : ''}`;
}

/* 記録画面を開く。直近の記録があれば、その内容を入れた状態で開く（React の fill=full と同じ） */
function openPoint(id, fromProg){
  const latest = S.empty ? null : recsOf(id)[0];
  const f = {point:id, editId: latest && ['inspected','rejected'].includes(latest.st) ? latest.id : null, date: latest ? latest.date : today(), checks:{}, ng:{}, ts:{},
    ph:latest?.ph||'', chlorine:latest?.chlorine||'', chlorineRep:!!latest?.chlorineRep, uvHours:latest?.uvHours||'', uvRep:!!latest?.uvRep,
    uvLight:latest ? latest.uvLight==='点灯' : true, abnLight:latest ? latest.abnLight==='消灯' : true};
  CHECKS.forEach(([k])=>{ f.checks[k] = latest ? latest.checks[k] : null; if (latest){ f.ts[k] = `${jpDate(latest.date)} ${latest.time}`; if (latest.ng[k]) f.ng[k] = latest.ng[k]; } });
  if (latest){ ['ph','chlorine','uvHours','uvLight','abnLight'].forEach(k=>{ f.ts[k] = `${jpDate(latest.date)} ${latest.time}`; }); }
  S.app.form = f; S.app.point = id; apGo('record', {fromProg:!!fromProg});
}
function stamp(k){ S.app.form.ts[k] = `${jpDate(today())} ${nowHM()}`; }
function setCheck(k, v){ const f = S.app.form; if (v==='ng'){ S.app.ngDlg = {k, st:'ng', cause:f.ng[k]?.cause||'', action:f.ng[k]?.action||null, other:''}; render(); return; } f.checks[k]='ok'; delete f.ng[k]; stamp(k); render(); }

/* 見出し＋値の並び（詳細画面の白いカードの中身） */
function lxKv(rows){
  const row = (k,v) => `<div class="f g4 ic wf"><div class="sh0 txl cg" style="width:200px">${k}</div><div class="f1 txl ci">${v}</div></div>`;
  return rows.map((r,i)=>`${row(r[0], r[1])}${i<rows.length-1?'<div class="bt wf"></div>':''}`).join('');
}
function lxMiniTable(cols, rows){
  return `<div class="f fc is wf r8 ovh bd"><div class="thd">${cols.map(c=>`<div class="tcl f1"><p class="ts cg">${c}</p></div>`).join('')}</div>
    ${rows.length ? rows.map((r,i)=>`<div class="trw ${i%2?'alt':'wh'}">${r.map(v=>`<div class="tcl f1"><p class="ts ci tr1">${esc(v)}</p></div>`).join('')}</div>`).join('') : `<div class="bw f ic wf px2" style="height:56px"><p class="ts cm">設定がありません</p></div>`}</div>`;
}

  if (!seg || seg==='main' || seg===L.main.seg) return Object.assign({key:'main', isMain:true}, L.main);
  const e = [...(L.subs||[]), ...(L.extra||[])].find(x=>x.seg===seg);
  return e ? Object.assign({key:seg, isMain:false, isExtra:(L.extra||[]).includes(e)}, e) : null;
}
const lxL = () => LX[S.ad.lx.slug];
const lxE = () => lxEnt(lxL(), S.ad.lx.ent);

function lxList(E){ S.lxItems = S.lxItems || {}; const k = `${S.ad.lx.slug}/${E.store||E.seg}`; if (!S.lxItems[k]) S.lxItems[k] = E.items.map(x=>Object.assign({}, x)); return S.lxItems[k]; }
function lxSched(){ S.lxSched = S.lxSched || {}; const k = S.ad.lx.slug; if (!S.lxSched[k]) S.lxSched[k] = JSON.parse(JSON.stringify(lxL().sched.entries)); return S.lxSched[k]; }

/* hash → 状態（applyHash から） */
function lxApplyHash(slug, rest){
  const L = LX[slug]; const x = {slug, ent:'main', page:'fac', id:null};
  if (rest[0]==='factories'){
    x.page = 'list'; const [seg, a, b] = rest.slice(2);
    if (seg==='schedule') x.page = !a ? 'sched' : (b==='complete' || a==='registered') ? 'schedDone' : 'schedNew';
    else if (seg==='checklist-settings') x.page = a==='deleted' ? 'checkDel' : 'check';
    else if (seg){ const E = lxEnt(L, seg); if (E){ x.ent = E.key;
      if (!a) x.page = 'list';
      else if (a==='new') x.page = b==='complete' ? 'done' : 'new';
      else if (a==='registered') x.page = 'done'; else if (a==='deleted') x.page = 'deleted'; else if (a==='check-items') x.page = 'check';
      else { x.page = b==='edit' ? 'edit' : 'detail'; const list = lxListOf(slug, E); x.id = list.some(i=>i.id===a) ? a : (list[0]||{}).id; } } }
  }
  S.ad.sc = 'lx';
  S.ad.lx = Object.assign({ym:'2026-08', day:'2026-08-25', sel:[], date:'', tab:'visible', freq:'毎日'}, S.ad.lx||{}, x);
}
function lxListOf(slug, E){ S.lxItems = S.lxItems || {}; const k = `${slug}/${E.store||E.seg}`; if (!S.lxItems[k]) S.lxItems[k] = E.items.map(x=>Object.assign({}, x)); return S.lxItems[k]; }
/* 状態 → hash（locHash から） */
function lxHash(){
  const x = S.ad.lx, L = LX[x.slug], E = lxEnt(L, x.ent); let h = `admin/ledger-management/${x.slug}`;
  if (x.page==='fac') return h; h += `/${FAC}`;
  const p = x.page;
  if (p==='sched') return `${h}/schedule`; if (p==='schedNew') return `${h}/schedule/register`; if (p==='schedDone') return `${h}/schedule/${L.sched.doneSeg}`;
  if (E.isMain && p==='check') return `${h}/checklist-settings`; if (p==='checkDel') return `${h}/checklist-settings/deleted`;
  if (p==='list') return E.isMain ? h : `${h}/${E.seg}`;
  h += `/${E.seg}`;
  return p==='new' ? `${h}/new` : p==='done' ? `${h}/${E.doneSeg||'registered'}` : p==='deleted' ? `${h}/${E.delSeg}` : p==='check' ? `${h}/check-items`
    : p==='edit' ? `${h}/${x.id||'x'}/edit` : `${h}/${x.id||'x'}`;
}

<script>
/* =========================================================================
   画面設計（nqrepo-screen-design.html）との約束 — CLAUDE.md §3 の5つ

     3-2 hash で画面が決まる（applyHash / locHash）。hash は React のルートと同じ形

const QS = new URLSearchParams(location.search);
const FRAME = QS.has('frame');

function applyFlags(f){
  S.off = !!f.off; S.empty = !!f.empty; S.err = !!f.err; S.session = !!f.session;
  if (f.role && ROLES[f.role]) S.role = f.role;
  S.app.unsent = !!f.unsent; S.app.band = null; S.app.errDlg = false; S.app.offShown = false;
  if (f.unsent) S.records.filter(r=>r.st==='inspected').forEach(r=>r.unsent=true);
  /* 提出完了の画面で「送信エラー」を試すと、SubmitOutcome と同じくエラーのポップアップに差し替わる */
  if (f.err && S.dev==='app' && S.app.sc==='complete'){ S.app.errDlg = true; S.app.unsent = true; }
}
window.addEventListener('message', e => {

});
const SS = 'nqrepo-demo-state';
/* サンプルデータの版。SEED の中身を変えたらここを上げる（古い保存を捨てるため） */

    return sc==='home' ? 'admin/home'
      : sc==='approvals' ? 'admin/approvals' : sc==='apprList' ? `admin/approvals/${W}` : sc==='apprDetail' ? `admin/approvals/${W}${rid}`
      : sc==='confirms' ? 'admin/confirmations' : sc==='confFactories' ? `admin/confirmations/${W}` : sc==='confList' ? `admin/confirmations/${W}/${FAC}` : sc==='confDetail' ? `admin/confirmations/${W}/${FAC}${rid}`
      : sc==='search' ? 'admin/data-search' : sc==='searchFactories' ? `admin/data-search/${W}` : sc==='searchPoints' ? `admin/data-search/${W}/${FAC}`
      : sc==='searchList' ? `admin/data-search/${W}/${FAC}/points/${pt}` : sc==='searchDetail' ? `admin/data-search/${W}/${FAC}/points/${pt}${rid}`
      : sc==='ledgers' ? 'admin/ledger-management' : sc==='ledgerFactories' ? `admin/ledger-management/${W}` : sc==='ledgerPoints' ? `admin/ledger-management/${W}/${FAC}` : sc==='ledgerPoint' ? `admin/ledger-management/${W}/${FAC}/points/${S.ad.pid||'wp1'}`
      : sc==='staff' ? 'admin/staff' : sc==='account' ? 'admin/account' : sc==='logoutDone' ? 'admin/logout'

let hashLock = false;
function syncHash(){
  const h = '#' + locHash();
  if (FRAME){   /* 画面設計の中：親の履歴を汚さず、現在地だけ知らせる */
    if (location.hash !== h){ try{ history.replaceState(null, '', h); }catch(e){} }

/* 詳細画面で記録IDが無いときは「その状態の最初の1件」を選ぶ（空のまま出すと画面設計で真っ白に見える） */
function pickFirst(sc){
  const first = S.records.find(r => sc==='apprDetail' ? r.st==='pending' : sc==='confDetail' ? r.st==='inspected' : r.st==='approved');
  return first ? first.id : S.records[0].id;
}
function applyHash(){
  const parts = location.hash.replace(/^#/,'').split('/').map(x=>{ try{ return decodeURIComponent(x); }catch(e){ return x; } });
  const [d, a, b, ...rest] = parts;
  if (!['admin','app','states'].includes(d)) return false;

  const seg = k => { const i = rest.indexOf(k); return i>=0 ? rest[i+1] : null; };
  const rid = seg('records') && recOf(seg('records')) ? seg('records') : null;
  const ptName = seg('points');
  const hasFac = rest.includes('factories');
  if (d==='admin'){
    S.ad.menu = false; S.ad.dlg = null; S.ad.pd = null; S.ad.cal = null; S.ad.mp = null; S.ad.dl = false;
    if (a==='login'){ S.auth.admin = false; }
    else if (a==='logout'){ S.ad.sc = 'logoutDone'; }
    else if (['approvals','confirmations','data-search'].includes(a) && b && b!==W && RX[b]) rxApplyHash(a, b, rest);
    else if (a==='ledger-management' && b && b!==W && LX[b]) lxApplyHash(b, rest);
    else {
      S.ad.sc = a==='approvals' ? (b===W ? (rid || rest.includes('records') ? 'apprDetail' : 'apprList') : 'approvals')
        : a==='confirmations' ? (b===W ? (rid || rest.includes('records') ? 'confDetail' : hasFac ? 'confList' : 'confFactories') : 'confirms')
        : a==='data-search' ? (b===W ? (rid || rest.includes('records') ? 'searchDetail' : ptName ? 'searchList' : hasFac ? 'searchPoints' : 'searchFactories') : 'search')
        : a==='ledger-management' ? (b===W ? (ptName ? 'ledgerPoint' : hasFac ? 'ledgerPoints' : 'ledgerFactories') : 'ledgers')
        : a==='staff' ? 'staff' : a==='account' ? 'account'
        : ['products','company','factory','storage','logs','devices'].includes(a) ? a
        : a==='guide' ? 'guide' : a==='help' ? 'help' : 'home';
      if (a==='guide') S.ad.guideTab = GUIDE_TABS.some(g=>g[0]===b) ? b : 'versions';
      if (a==='data-search' && ptName) S.ad.pt = S.points.some(p=>p[1]===ptName) ? ptName : S.points[0][1];
      if (a==='ledger-management' && ptName) S.ad.pid = S.points.some(p=>p[0]===ptName) ? ptName : S.points[0][0];

      if (['apprDetail','confDetail','searchDetail'].includes(S.ad.sc) && !S.ad.rid) S.ad.rid = pickFirst(S.ad.sc);
      if (S.ad.sc==='searchDetail' && !ptName){ const r = recOf(S.ad.rid); if (r) S.ad.pt = r.location; }

      } else S.app.sc = rest.includes('complete') ? 'complete' : 'points';
    }
    else S.app.sc = a==='progress' ? 'progress' : a==='pending-review' ? 'pending' : a==='settings' ? 'settings' : 'ledgers';

function loadState(){

    const raw = sessionStorage.getItem(SS); if (!raw) return false;
    const o = JSON.parse(raw);
    if (!o || o._v !== SEED_V || !Array.isArray(o.records)) return false;
    S = Object.assign(SEED(), o);
    for (const k of ['ad','app']) S[k] = Object.assign(SEED()[k], o[k]||{});
    S.session = false; S.ad.dlg = null; S.ad.pd = null; S.ad.cal = null; S.ad.mp = null; S.app.dlg = null; S.app.picker = null; S.app.ngDlg = null; S.ad.toast = '';
    return true;
  }catch(e){ return false; }
}
window.addEventListener('hashchange', ()=>{ if (hashLock) return; if (applyHash()) render(); });

function render(opt={}){
  const hold = document.getElementById('hold');
  hold.classList.toggle('wide', S.dev!=='app');
  hold.innerHTML = S.dev==='app' ? `<div class="tab">${appView()}</div>` : `<div class="win">${S.dev==='states' ? statesView() : adView()}</div>`;
  if (opt.keep && opt.keep.value !== undefined){
    /* 入力中の欄を描き直しても焦点が飛ばないように、同じ位置の input を探す */
    const inputs = [...hold.querySelectorAll('input')]; const same = inputs.find(i => i.value===opt.keep.value && i.placeholder===opt.keep.placeholder);
    if (same){ same.focus(); const n = same.value.length; try{ same.setSelectionRange(n,n); }catch(e){} }
  }
  if (typeof nvSync === 'function'){ try{ nvSync(); }catch(e){ console.warn('nvSync', e); } }
  syncHash(); saveState();
}
function setDev(k){ S.dev = k; render(); }
function resetAll(){ try{ sessionStorage.removeItem(SS); }catch(e){} S = SEED(); location.hash = ''; render(); }
document.addEventListener('keydown', e => {
  const t = document.activeElement?.tagName;
  if (t==='INPUT' || t==='TEXTAREA' || t==='SELECT') return;
  if (e.key==='1') setDev('admin'); else if (e.key==='2') setDev('app');
});
if (!FRAME) loadState();
applyHash();
if (FRAME) applyFlags(Object.fromEntries(QS));
render();

/* ---------- 右下の切替 ---------- */
const nvSw=document.getElementById('nvSw'), nvFab=document.getElementById('nvFab'), nvPanel=document.getElementById('nvPanel');
function nvOpen(v){ const o = v===undefined ? nvPanel.hidden : v;
  nvPanel.hidden=!o; nvSw.classList.toggle('open',o); nvFab.setAttribute('aria-expanded',String(o)); }
nvFab.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); nvOpen(); });
document.getElementById('nvX').addEventListener('click', e=>{ e.stopPropagation(); nvOpen(false); });
document.addEventListener('click', e=>{ if(!e.target.closest('#nvSw')) nvOpen(false); });
document.addEventListener('keydown', e=>{
  if (e.key!=='Escape') return;
  if (S.ad.dlg || S.ad.dl || S.app.dlg || S.app.picker || S.app.ngDlg || S.app.filt){ e.stopPropagation(); closeDlg(); return; }
  if (!nvPanel.hidden){ e.stopPropagation(); nvOpen(false); }
}, true);
var NVDEV=[['admin','管理画面'],['app','アプリ']];
var NVSTATE=[['off','オフライン','送信できず未送信のまま残る'],['empty','データが無い','記録がまだ 1 件も無い'],['err','送信エラー','送信に失敗した状態'],['session','セッション終了','放置して自動ログアウトされた']];
function nvSync(){
  const st = document.getElementById('nvState');
  if (st) st.innerHTML = NVSTATE.map(([k,l,d])=>
    `<button class="nvit" aria-current="${!!S[k]}" onclick="S.${k}=!S.${k};render()"><span class="nvr"></span><span class="tx"><b class="t1">${l}</b><span class="t2">${d}</span></span></button>`).join('');
  const ro = document.getElementById('nvRole');
  if (ro) ro.innerHTML = Object.entries(ROLES).map(([k,r])=>
    `<button class="nvit" aria-current="${S.role===k}" onclick="setRole('${k}')"><span class="nvr"></span><span class="tx"><b class="t1">${r.name}</b><span class="t2">${r.desc}</span></span></button>`).join('');
  const dev = document.getElementById('nvDev');
  if (dev) dev.innerHTML = NVDEV.map(([k,l])=>`<button class="nvit" aria-current="${S.dev===k}" onclick="setDev('${k}')"><span class="nvr"></span><span class="tx"><b class="t1">${l}</b></span></button>`).join('');
  const sb=document.getElementById('nvSub'); if(sb) sb.textContent = (NVDEV.find(d=>d[0]===S.dev)||[])[1]||'';
}
document.getElementById('nvReset').onclick = () => {
  if (!confirm('操作した内容をすべて元に戻します。よろしいですか？')) return;
  resetAll(); nvOpen(false); say('最初の状態に戻しました');
};
nvSync();
try{ if(!FRAME && !sessionStorage.getItem('nqSeen')){ nvOpen(true); sessionStorage.setItem('nqSeen','1'); setTimeout(()=>nvOpen(false), 6000); } }catch(e){}
</script>
</body>
</html>
