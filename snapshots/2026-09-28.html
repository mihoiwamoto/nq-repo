<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NQリポ（食品工場管理システム）のプロトタイプ。アプリで点検して提出 → 管理画面で確認 → 承認 → データ検索、がひとつの状態でつながって動く。">
<title>NQリポ プロトタイプ</title>
<style>
/* ===========================================================
   NQリポ プロトタイプ（管理画面＝PC 1280×760 ／ アプリ＝タブレット 768×1024）
   見た目は NQrepo（React 実装）の Tailwind クラスをそのまま CSS に写している。
   色は src/index.css の --semantic-* と同じ値。文字は body で bold（React の body と同じ）。
   =========================================================== */
:root{
  --g:#009944; --dn:#f34949; --page:#f1efea; --sf:#ffffff;
  --ink:#333333; --mute:#808080; --dis:#b5b5b5;
  --caution:#dcaa14; --done:#4b9ff8; --err:#f85c5c; --ok:#19c95f;
  --line:#d0d0d0;
  --s1:0 2px 2px rgba(51,51,51,.16); --s2:0 2px 2px rgba(51,51,51,.24); --s3:0 2px 3px rgba(51,51,51,.24);
  --s4:0 2px 4px rgba(51,51,51,.16); --s5:0 2px 4px rgba(51,51,51,.24); --s6:0 2px 6px rgba(51,51,51,.24);
  --t-ui:.14s;
}
*{box-sizing:border-box;border-width:0;border-style:solid;border-color:var(--line)}
html,body{margin:0;height:100%}
body{background:#dfe3e8;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px;line-height:1.5;font-weight:700;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,dl,dd,dt,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;padding:0;text-align:center}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
input::placeholder,textarea::placeholder{color:var(--mute);font-weight:400}
img{max-width:100%;display:block}
input,textarea{outline:none;background:#fff}

/* ---------- Tailwind と同じ寸法のユーティリティ（使う分だけ） ---------- */
.f{display:flex}.fc{flex-direction:column}.ic{align-items:center}.is{align-items:flex-start}.ie{align-items:flex-end}.ib{align-items:baseline}
.jb{justify-content:space-between}.jc{justify-content:center}.je{justify-content:flex-end}
.f1{flex:1 1 0%;min-width:0}.mn0{min-width:0}.sh0{flex-shrink:0}.wrap{flex-wrap:wrap}.wf{width:100%}.hf{height:100%}.wfit{width:fit-content}
.rel{position:relative}.abs{position:absolute}.ovh{overflow:hidden}.ovy{overflow-y:auto;overflow-x:hidden}.ovx{overflow-x:auto}
.g0{gap:0}.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g5{gap:20px}.g6{gap:24px}.g8{gap:32px}.g10{gap:40px}.g20{gap:80px}
.p2{padding:8px}.p3{padding:12px}.p4{padding:16px}.p6{padding:24px}
.px2{padding-left:8px;padding-right:8px}.px3{padding-left:12px;padding-right:12px}.px4{padding-left:16px;padding-right:16px}.px6{padding-left:24px;padding-right:24px}.px8{padding-left:32px;padding-right:32px}
.py1{padding-top:4px;padding-bottom:4px}.py2{padding-top:8px;padding-bottom:8px}.py3{padding-top:12px;padding-bottom:12px}.py4{padding-top:16px;padding-bottom:16px}.py6{padding-top:24px;padding-bottom:24px}.py8{padding-top:32px;padding-bottom:32px}.py10{padding-top:40px;padding-bottom:40px}
.tx{font-size:12px;line-height:16px}.ts{font-size:14px;line-height:20px}.tb{font-size:16px;line-height:24px}.tl{font-size:18px;line-height:28px}.txl{font-size:20px;line-height:28px}.t2xl{font-size:24px;line-height:32px}
.w3{font-weight:300}.w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.ci{color:var(--ink)}.cm{color:var(--mute)}.cg{color:var(--g)}.cd{color:var(--dn)}.cw{color:#fff}.cok{color:var(--ok)}.cerr{color:var(--err)}
.bw{background:#fff}.bg{background:var(--g)}.bp{background:var(--page)}.bdn{background:var(--dn)}.bline{background:var(--line)}
.r8{border-radius:8px}.rf{border-radius:9999px}.r6{border-radius:6px}.r4{border-radius:4px}
.s1{box-shadow:var(--s1)}.s2{box-shadow:var(--s2)}.s3{box-shadow:var(--s3)}.s4{box-shadow:var(--s4)}.s5{box-shadow:var(--s5)}.s6{box-shadow:var(--s6)}
.bd{border-width:1px}.bd2{border-width:2px}.bt{border-top-width:1px}.bb{border-bottom-width:1px}.bb2{border-bottom-width:2px}
.bcg{border-color:var(--g)}.bci{border-color:var(--ink)}.bcm{border-color:var(--mute)}.bcd{border-color:var(--dn)}.bcerr{border-color:var(--err)}.bct{border-color:transparent}
.tc{text-align:center}.tr{text-align:right}.tlf{text-align:left}.nw{white-space:nowrap}.tr1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hv:hover{background:rgba(255,255,255,.1)}
.pe{pointer-events:none}
.mask{display:inline-block;flex:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.sq{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ln1{line-height:1}.ln14{line-height:1.4}.ln16{line-height:1.6}

/* ---------- 置き場（端末の枡） ---------- */
.rig{min-height:100%;display:flex;flex-direction:column}
.hold{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 20px 90px;min-height:100vh}
.hold.wide{align-items:flex-start}
/* タブレット枡。中の座標は常に 768×1024（React 側の .app-viewport-frame と同じ） */
.tab{width:768px;height:1024px;background:var(--g);border-radius:26px;border:11px solid #1c2226;box-shadow:0 26px 60px rgba(0,0,0,.30);overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none}
/* PC 枡（ブラウザ風） */
.win{width:1280px;height:760px;background:var(--page);border-radius:12px;box-shadow:0 26px 60px rgba(0,0,0,.24);overflow:hidden;position:relative;display:flex;flex:none}
/* ---- 画面設計（nqrepo-screen-design.html）から ?frame=1 で呼ばれるとき ----
   枡は呼び出し側が描くので、中身だけを iframe いっぱいに出す */
html.frame body{background:var(--page)}
html.frame .hold{padding:0;align-items:stretch;min-height:100vh}
html.frame .tab,html.frame .win{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}
html.frame .nvsw{display:none}

/* ---------- 管理画面（AdminLayout / AdminSidebar / AdminHeader） ---------- */
.ad{display:flex;width:100%;height:100%;background:var(--page)}
.snav{width:256px;flex:none;background:var(--g);box-shadow:var(--s3);padding:0 8px;display:flex;flex-direction:column;justify-content:space-between;height:100%;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:transparent transparent}
.snav:hover{scrollbar-color:rgba(255,255,255,.4) transparent}
.nvi{display:flex;align-items:center;gap:12px;height:48px;padding:8px 24px;border-radius:8px;width:100%}
.nvi:hover{background:rgba(255,255,255,.1)}
.nvi.on{background:#fff}
.nvi.sub{padding:8px 16px 8px 40px;gap:8px}
.nvi span{text-align:left}
.cbadge{height:20px;min-width:30px;padding:0 6px;border-radius:9999px;background:var(--dn);color:#fff;font-size:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cbadge.cp{min-width:20px}
.admain{flex:1;min-width:0;display:flex;flex-direction:column;width:100%}
.ahd{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;height:64px;background:var(--g);box-shadow:var(--s4);flex:none;z-index:5}
.logo{width:40px;height:40px;border-radius:6.4px;background:#fff;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.acct{height:40px;padding:0 80px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:var(--ink);box-shadow:var(--s5)}
.umenu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:50;background:#fff;box-shadow:var(--s6);border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;padding:8px 0}
.umenu button{width:100%;padding:12px 24px;font-size:18px;line-height:28px;color:var(--g);text-align:left}
.umenu button:hover{background:var(--page)}
.mbk{position:fixed;inset:0;z-index:4}
.abody{flex:1;min-height:0;overflow:auto;width:100%}
.ptb{background:var(--page);box-shadow:var(--s1);display:flex;align-items:center;justify-content:space-between;padding:32px 24px}
.ptb.p6{padding:24px}
.h28{font-size:28px;line-height:1.4;font-weight:600;color:var(--ink)}
/* ボタン（React の className をそのまま） */
.bp1{background:var(--g);box-shadow:var(--s2);height:40px;width:120px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:16px;line-height:24px}
.bo1{background:#fff;border:1px solid var(--g);box-shadow:var(--s2);height:40px;width:80px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:var(--g)}
.brs{background:#fff;border:1px solid var(--mute);height:40px;width:80px;border-radius:8px;font-size:14px;line-height:20px;color:var(--mute)}
.inp{background:#fff;border:1px solid var(--line);height:48px;padding:0 16px;border-radius:8px;font-size:16px;line-height:24px;color:var(--ink)}
.chip6{height:24px;width:80px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:#fff;flex:none}
.chip8{height:32px;width:80px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:#fff;flex:none}
.stag{height:28px;width:88px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:#fff;flex:none}
.tabs2{display:flex;align-items:center;border-bottom:2px solid var(--line);width:100%}
.tabs2 button{position:relative;height:48px;width:156px;display:flex;align-items:center;justify-content:center;gap:8px;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:20px;line-height:28px;color:var(--mute)}
.tabs2 button[aria-selected="true"]{border-color:var(--g);color:var(--g)}
.tabs2 .cbadge{position:absolute;top:-8px;left:122px}
/* 一覧の表（flex で組む。React と同じ） */
.thd{background:#f6f6f6;display:flex;height:40px;align-items:center;width:100%}
.thd.h50{height:50px}.thd.h14{height:56px}
.trw{display:flex;height:56px;align-items:center;width:100%}
.trw.alt{background:#ddf3e7}.trw.wh{background:#fff}
.tcl{height:100%;display:flex;align-items:center;padding:0 8px}
.tcl p{font-size:14px;line-height:20px}
.tcc{display:flex;align-items:center;justify-content:center;padding:8px;height:100%;flex:none;font-size:14px;line-height:20px;color:var(--ink);text-align:center}
.tcc.ng{background:#f85c5c}
.pgb{background:#fff;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:var(--ink)}
.pgb:disabled{opacity:.4}
.pgb.on{background:var(--g);color:#fff}
/* プルダウン（Pulldown.tsx） */
.pdw{position:relative}
.pdb{display:flex;align-items:center;gap:8px}
.pdb:disabled{cursor:not-allowed}
.pdl{position:absolute;top:100%;left:0;margin-top:4px;background:#fff;box-shadow:0 0 3px rgba(51,51,51,.24);border-radius:8px;padding:8px;min-width:100%;width:max-content;max-height:290px;overflow-y:auto;z-index:50}
.pdl button{display:flex;height:42px;align-items:center;padding:0 8px;border-radius:8px;width:100%;text-align:left;font-size:16px;line-height:24px;white-space:nowrap;color:var(--ink)}
.pdl button:hover{background:var(--page)}
.pdl button.on,.pdl button.on:hover{background:var(--g);color:#fff}
/* 日付（DateFilterInput.tsx） */
.dtw{position:relative;width:200px}
.dtw .ph{position:absolute;left:16px;font-weight:700;font-size:16px;line-height:24px;color:var(--mute);pointer-events:none}
.dtw input{background:#fff;border:1px solid var(--line);height:48px;padding:0 48px 0 16px;border-radius:8px;font-size:16px;line-height:24px;color:var(--ink);width:100%;cursor:pointer}
.dtw .cal{position:absolute;right:16px;width:20px;height:20px;cursor:pointer}
.dtp{position:absolute;top:100%;right:0;margin-top:8px;background:#fff;border-radius:8px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);z-index:50;padding:16px;width:280px}
.dtp .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dtp .dy{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;border-radius:9999px;color:var(--ink)}
.dtp .dy:hover{background:var(--g);color:#fff}
.dtp .dy.on{background:var(--g);color:#fff}
.dtp .dy:disabled{color:#d1d5db;background:none}
.mpk{position:absolute;top:100%;margin-top:8px;left:50%;transform:translateX(-50%);z-index:50;background:#fff;box-shadow:var(--s6);border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:16px;width:392px}
.mpk .mo{height:48px;width:120px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;color:var(--ink)}
.mpk .mo.on{background:var(--g);color:#fff}
.mnb{background:#fff;border:1px solid var(--g);box-shadow:var(--s2);width:40px;height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
/* ダイアログ */
.ov{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.ov .bg40{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.ov .bg50{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.ov .bg33{position:absolute;inset:0;background:rgba(51,51,51,.5)}
.dlg{position:relative;background:var(--page);box-shadow:var(--s3);border-radius:8px;display:flex;flex-direction:column;gap:40px;align-items:center;padding:40px 24px;width:640px;max-width:100%}
.dlgw{position:relative;background:#fff;box-shadow:var(--s3);border-radius:8px;display:flex;flex-direction:column;gap:24px;align-items:center;padding:32px}
.b48{height:48px;width:200px;border-radius:8px;font-size:16px;line-height:24px;display:inline-flex;align-items:center;justify-content:center}
.b64{height:64px;width:240px;border-radius:8px;font-size:20px;line-height:28px;display:inline-flex;align-items:center;justify-content:center}
.toast{position:absolute;bottom:24px;right:0;z-index:50}
.toast .in img{filter:brightness(0) invert(1)}
.toast .in{color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;max-width:384px;background:#22c55e;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:190;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:var(--ink);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;line-height:1.6;font-weight:400;box-shadow:var(--s6);max-width:380px;animation:up .22s cubic-bezier(.2,1,.3,1)}
.tst b{color:#7fe0b2;font-weight:600}
@keyframes up{from{transform:translateY(10px)}to{transform:none}}
/* 「全て異常なし」「全て清掃済み」（React の LineInspectionPage / RecordingPage と同じ。押すと緑に光る all-ok-glow） */
.aok{height:48px;width:160px;border:1px solid #d0d0d0;transition:all .2s}
.aok.on{border-color:var(--g);background:#f0faf3;box-shadow:0 0 0 3px rgba(255,255,255,.65),0 0 14px 4px rgba(25,201,95,.95);animation:aokp .45s ease-out}
@keyframes aokp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65),0 0 0 0 rgba(25,201,95,.95)}60%{box-shadow:0 0 0 5px rgba(255,255,255,.75),0 0 22px 10px rgba(25,201,95,1)}100%{box-shadow:0 0 0 3px rgba(255,255,255,.65),0 0 14px 4px rgba(25,201,95,.95)}}
@media (prefers-reduced-motion:reduce){.aok.on{animation:none}}
/* チェックボックス（accent） */
.ckb{width:16px;height:16px;accent-color:var(--g);margin:0}
/* ログイン（AdminLoginPage） */
.lg-ad{min-height:100%;width:100%;background:var(--page);overflow:auto}
.lg-ad header{height:64px;display:flex;align-items:center;background:var(--g);box-shadow:var(--s2);width:100%}
.lg-ad .fm{display:flex;justify-content:center;padding:144px 24px 40px}
.lg-ad .inp0{background:#fff;height:48px;padding:0 16px;border-radius:8px;font-size:16px;line-height:24px;color:var(--ink);width:100%}
.lg-ad .inp0.err{border:1px solid var(--err)}
/* ヘルプ */
.faq{background:#fff;box-shadow:var(--s5);border-radius:8px;overflow:hidden;width:100%}

/* ---------- アプリ（AppLayout / AppRail / AppHeader） ---------- */
.ap{display:flex;width:100%;height:100%;background:var(--g)}
/* テキストサイズ（TextSizeContext.tsx）。React は html の font-size を 87.5%／100%／112.5% にして rem の画面をまとめて伸縮させる。プロトタイプは px なので、端末の枡の中身を zoom で同じ倍率にする */
.tab.ts-small>*{zoom:.875}.tab.ts-large>*{zoom:1.125}
.rail{width:64px;flex:none;background:var(--g);display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0}
.rail .grp{display:flex;flex-direction:column;gap:20px;align-items:center;width:100%}
.rail .it{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.rail .it .bx{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.rail .it.on .bx{background:rgba(255,255,255,.24)}
.rail .it .lb{font-size:12px;line-height:1;color:#fff}
.rail .it .bdg{position:absolute;top:-6px;left:42px;width:16px;height:16px;border-radius:9999px;background:var(--dn);color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center}
.apbody{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 8px 8px 0;height:100%;width:100%}
.apane{flex:1;min-height:0;border-radius:8px;background:var(--page);overflow:hidden;display:flex;flex-direction:column;min-width:0;width:100%}
.aphd{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--s1);flex:none}
.aphd h1{font-size:24px;line-height:32px;font-weight:600;color:var(--ink)}
.band{height:56px;display:flex;align-items:center;gap:4px;padding:8px 16px;border-radius:8px 8px 0 0;flex:none}
.band.jb{justify-content:space-between;gap:16px}
.band.off{height:64px}
.band p{font-size:16px;line-height:24px;font-weight:600;color:#fff}
.band .send{background:#fff;height:40px;width:104px;border-radius:8px;font-size:16px;line-height:24px;font-weight:600;color:var(--err);flex:none}
.ledgrid{display:grid;grid-template-columns:repeat(4,auto);justify-items:start;align-content:start;align-items:start;column-gap:32px;row-gap:24px;justify-content:start}
.ledbtn{width:144px;height:144px;background:#fff;box-shadow:var(--s3);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.ledbtn span{font-size:16px;line-height:1.4;color:var(--g);text-align:center}
.okng{display:flex;align-items:center;border-radius:8px;overflow:hidden;flex:none}
.okng button{height:48px;width:80px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:var(--line)}
.okng button.ng.on{background:var(--err)}
.okng button.ok.on{background:var(--ok)}
.frow{display:flex;flex-direction:column;gap:4px;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.frow.g2{gap:8px}
.frow .lb{font-size:18px;line-height:28px;color:var(--ink);display:flex;align-items:center;gap:4px}
.frow .lb i{color:var(--dn);font-size:12px;line-height:16px;font-style:normal}
.tsr{font-size:14px;line-height:20px;font-weight:400;color:var(--mute);text-align:right;width:100%}
.ninp{background:#fff;height:48px;padding:0 8px;text-align:right;border-radius:8px;font-size:16px;line-height:24px;color:var(--ink);width:200px;border:1px solid var(--line)}

録","slug":""},{"at":"2025-04-05 08:33:47","kind":"アプリ画面","fac":"㈱西原食品 第二工場","who":"山田太郎","role":"実施者","what":"ガラス・プラスチック管理を記録","slug":"glass-plastic"},{"at":"2025-04-05 09:56:24","kind":"アプリ画面","fac":"㈱西原食品 本社工場","who":"佐藤花子","role":"確認者","what":"使用水の点検を確認","slug":"water-inspection"}],"help":[["使用水の点検はどうやって記録しますか？","帳票管理から「使用水の点検」を選択し、工場と点検場所を選んで記録してください。アプリからは実施者が、管理画面からは管理者が内容を確認・編集できます。"],["帳票の記録項目を工場ごとに変えることはできますか？","工場管理の詳細・編集ページで「点検項目」を工場ごとに選択できます。選択した点検項目のみが、その工場のアプリ画面に表示されます。"],["登録した点検記録を削除できますか？","各帳票の詳細ページ右上にある削除ボタンから削除できます。削除した情報は元に戻せませんので、内容をよくご確認の上、削除してください。"],["企業情報はどこで登録・編集しますか？","左側メニューの「企業管理」から企業の新規登録・編集・削除ができます。工場を新規登録する際にも、企業選択欄から新しい企業をその場で登録できます。"],["工場を新しく追加するにはどうすればいいですか？","「工場管理」一覧画面右上の「+ 新規登録」から、工場名・住所・企業・工場ID・パスワード・点検項目などを入力して登録してください。工場IDとパスワードはアプリのログインに使用されます。"],["工場の休業日はどこで設定しますか？","工場管理の新規登録・編集ページにあるカレンダーから、休業日にしたい日付を選択してください。設定した休業日は工場の詳細ページでも確認できます。"],["1人の職員を複数の工場に所属させることはできますか？","できます。職員の新規登録・編集ページで「+ 工場追加」を押すと、工場と権限の組み合わせを追加できます。2つ目以降の工場は✕ボタンで削除できます。"],["「実施者」「確認者」「承認者」「管理者」の違いは何ですか？","工場ごとに設定できる権限です。実施者は記録の実施、確認者は記録内容の確認、承認者は記録の最終承認、管理者はその工場に関するすべての操作を行える権限です。"],["パスワードを忘れてしまいました。どうすればいいですか？","職員管理または工場管理の編集ページから、管理者がパスワードを再設定できます。編集画面でパスワード欄を空欄のままにすると、既存のパスワードは変更されません。"],["過去の記録を工場や期間で検索できますか？","「データ検索」から帳票の種類を選択し、工場や期間などの条件で記録を絞り込んで検索できます。検索結果からは記録の詳細も確認できます。"],["承認申請の状況はどこで確認できますか？","「承認申請管理」に、承認待ちの申請が一覧で表示されます。サイドメニューのバッジには未処理の件数が表示されるので、対応漏れを防ぐことができます。"],["操作の履歴はどこで確認できますか？","「ログ管理」から、いつ・誰が・どの工場で・どの画面でどんな操作を行ったかを確認できます。日付・種別・工場・帳票・キーワードで絞り込むことができます。"]],"nq":[{"name":"ジェラート ミルク ALVO シングル","qty":"40","unit":"g","fac":"㈱西通りプリン 本社工場","exp":"180"},{"name":"プリン 3種6個セット 85g6入","qty":"510","unit":"g","fac":"㈱西通りプリン 本社工場","exp":"60"},{"name":"生ゆば詰め合わせ","qty":"200","unit":"g","fac":"㈱ゆば将 本社工場","exp":"14"}],"water":{"search":[{"id":"wr1","date":"2025-04-01","time":"09:00","point":"wp1","location":"給湯室","implementer":"田中太郎","confirmer":"佐藤花子","st":"pending","checks":{"taste":"ok","smell":"ok","color":"ok","turb":"ok","fm":"ok"},"ng":{},"   return `<div class="ptb ${p6?'p6':''}"><div class="f ic g2">${back ? `<button type="button" class="sq" style="width:24px;height:24px" onclick="${back}" aria-label="戻る">${im('common/arrow-left.svg',24)}</button>` : ''}<h1 class="h28">${esc(title)}</h1></div>${action||''}</div>`;
}
/* ---- パンくず（Breadcrumb.tsx） ---- */
function crumbs(items){
  return `<div class="f ic g2" style="padding:16px 24px">${items.map((it,i)=>{ const last = i===items.length-1;
    return `<div class="f ic g2">${last ? `<span class="ts ci">${esc(it[0])}</span>` : `<button type="button" class="ts cg" onclick="${it[1]}">${esc(it[0])}</button>${mk('common/arrow-right.svg',12,'var(--g)')}`}</div>`; }).join('')}</div>`;
}
const fchip = name => `<div class="bw f ic r8" style="padding:8px 16px"><p class="txl ci">${esc(name)}</p></div>`;
/* 「+ 新規登録」など見出し右のボタン */
const actBtn = (label, onclick) => `<button type="button" class="bp1" onclick="${onclick}">${label}</button>`;

function adView(){
  if (!S.auth.admin) return adLogin();
  const sc = S.ad.sc;
  if (sc==='logoutDone') return adLogoutDone();
  const V = {home:adHome, approvals:adApprovals, apprList:()=>adRecordList('appr'), apprDetail:()=>adDetail('appr'),
    confirms:adConfirms, confFactories:()=>adFactorySel('conf'), confList:()=>adRecordList('conf'), confDetail:()=>adDetail('conf'),
    search:adSearch, searchFactories:()=>adFactorySel('search'), searchPoints:adSearchPoints, searchList:()=>adRecordList('search'), searchDetail:()=>adDetail('search'),
    ledgers:adLedgers, ledgerFactories:()=>adFactorySel('ledger'), ledgerPoints:adPoints, ledgerPoint:adPointDetail, ledgerPointDone:adPointDone, ledgerPointEdit:adPointEdit, lx:lxView, rxFac:rxView, rxList:rxView, rxDetail:rxView,
    staff:adStaff, account:adAccount, products:adProducts, company:adCompany, factory:adFactory, storage:adStorage, logs:adLogs, devices:adDevices, guide:adGuide, help:adHelp};
  const body = (V[sc] || adHome)();
  return `<div class="ad">${adSide()}<div class="admain">${adHead()}<main class="abody">${body}</main></div></div>${adDlg()}${S.ad.toast ? adToastHTML() : ''}`;
}
function adToast(m){ S.ad.toast = m; render(); setTimeout(()=>{ if (S.ad.toast===m){ S.ad.toast=''; render(); } }, 3000); }
/* Toast.tsx：右下の緑。チェックは白（images/Icon/check.svg を brightness-0 invert で白くする） */
function adToastHTML(){
  return `<div class="toast"><div class="in">${im('common/check-icon.svg',20)}<span class="ts w5">${esc(S.ad.toast)}</span>

}

    <div class="tabs2" role="tablist">${Object.entries(AP_ST).map(([k,[lb]])=>`<button type="button" role="tab" aria-selected="${tab===k}" onclick="S.ad.tab='${k}';render()">${lb}${k==='pending'&&nAppr()?`<span class="cbadge">${nAppr()}</span>`:''}</button>`).join('')}</div>

  appr:  {root:['承認申請管理','adGo(\'approvals\')'], list:'apprList', detail:'apprDetail', filter:r=>['pending','approved','rejected'].includes(r.st), st:r=>chip(...AP_ST[r.st],'chip6'), minW:1300,

  search:{root:['データ検索','adGo(\'search\')'],      list:'searchList', detail:'searchDetail', filter:r=>r.st==='approved', st:null, minW:1216,
          cols:[['操作',96],['日付',80],['点検時間',72],['点検場所',80]]},

const COLS_REST = [['味',48],['臭い',48],['色',48],['濁り',48],['異物',48],['ph値',48],['残留塩素濃度（mg/ℓ）',100],['UV殺菌灯稼働時間',100],['UV表示灯',100],['異常検出灯',100],['実施者',100],['確認者',100]];
function ymShift(ym, d){ const [y,m] = ym.split('-').map(Number); const n = new Date(y, m-1+d, 1); return `${n.getFullYear()}-${pad2(n.getMonth()+1)}`; }

/* リセット・検索のボタン（画面ごとに影・文字サイズ・アイコンが少し違う） */
function filtBtns(kind, reset){
  if (kind==='appr') return `<div class="f g2 ic"><button type="button" class="brs" onclick="${reset}">リセット</button><button type="button" class="bg r8 ts cw" style="height:40px;width:120px" onclick="render()">検索</button></div>`;
  if (kind==='conf' || kind==='search') return `<div class="f g2 ic"><button type="button" class="brs s2" onclick="${reset}">リセット</button><button type="button" class="bg r8 tb cw f ic jc g1 s2" style="height:40px;width:120px" onclick="render()">${im('common/search.svg',20)}検索</button></div>`;

/* 月送り。確認・検索は年月を押すと月の選択が開く */
function monthNav(kind, ym){
  const [y,m] = ym.split('-'); const M = Number(m);
  const arrow = (d, ic) => `<button type="button" class="mnb" onclick="S.ad.ym=ymShift(S.ad.ym,${d});render()" aria-label="${d<0?'前の月':'次の月'}">${mk(`common/${ic}.svg`,20,'var(--g)')}</button>`;
  if (kind==='appr') return `<div class="f ic jb wf">${arrow(-1,'arrow-left')}<p class="txl ci">${y}年${M}月_使用水の点検</p>${arrow(1,'arrow-right')}</div>`;
  return `<div class="rel f ic jb">${arrow(-1,'arrow-left')}
    <button type="button" class="f ic g1 txl ci" onclick="event.stopPropagation();S.ad.mp=S.ad.mp?null:{y:${y}};render()">${y}年${M}月${mk('common/pulldown.svg',12,'currentColor')}</button>${arrow(1,'arrow-right')}
    ${S.ad.mp ? `<div class="mpk" onclick="event.stopPropagation()"><div class="f ic jb py2 wf">
        <button type="button" class="ci txl" onclick="S.ad.mp.y--;render()">${mk('common/arrow-left.svg',20,'currentColor')}</button><p class="txl ci">${S.ad.mp.y}</p><button type="button" class="ci txl" onclick="S.ad.mp.y++;render()">${mk('common/arrow-right.svg',20,'currentColor')}</button></div>
      <div class="f wrap" style="width:360px">${Array.from({length:12},(_,i)=>`<button type="button" class="mo ${S.ad.mp.y===Number(y)&&i+1===M?'on':''}" onclick="S.ad.ym='${S.ad.mp.y}-'+pad2(${i+1});S.ad.mp=null;render()">${i+1}月</button>`).join('')}</div></div>` : ''}</div>`;
}
function adRecordList(kind){
  const K = KIND[kind];
  const ym = S.ad.ym;
  const rows = waterRows(kind).filter(r => ymOf(r.date)===ym && (!S.ad.fDate || r.date===S.ad.fDate) && (!S.ad.fPoint || r.location===S.ad.fPoint)
      && (kind!=='search' || r.location===S.ad.pt) && (kind!=='conf' || !S.ad.fSt || r.st===S.ad.fSt)
      && (kind!=='appr' || !S.ad.fRej || r.st==='rejected') && (kind==='appr' || !S.ad.fAbn || hasNG(r)))
    .sort((a,b)=> (a.date+a.time) < (b.date+b.time) ? 1 : -1);
  const cols = [...K.cols, ...COLS_REST];
  const cell = (w, inner, cls='', style='') => `<div class="tcc ${cls}" style="width:${w}px;${style}">${inner}</div>`;
  const check = (r,k) => r.checks[k]==='ng'
    ? cell(48, im('common/x-mark.svg',20,'異常あり'), 'ng', kind==='appr'?'':'padding:0')
    : cell(48, kind==='appr' ? `<span class="cg">${CHECK_PATH(24,'currentColor')}</span>` : im('common/checkmark.svg',20,'正常'));
  const chl = r => r.chlorineRep
    ? `<div class="f fc ic jc g1 p2 hf sh0" style="width:100px;background:#f85c5c"><span class="tb w7 cw">${r.chlorine}</span><span class="f ic g1 tx cw">${kind==='appr' ? CHECK_PATH(14,'#fff') : kind==='conf' ? mk('common/checkmark.svg',12,'#fff') : CBOX_SVG}補充</span></div>`
    : cell(100, r.chlorine);
  let lastDate = '', g = -1;
  const reset = kind==='appr' ? "S.ad.fDate='';S.ad.fPoint='';S.ad.fRej=false;render()" : "S.ad.fSt='';S.ad.fDate='';S.ad.fPoint='';S.ad.fAbn=false;render()";
  const ptOpts = [...new Set(waterRows(kind).map(r=>r.location))].map(n=>[n,n]);
  const filt = `<div class="bw f fc g4 is p4 r8 wf">
    <button type="button" class="f ic g2 tb cg" onclick="S.ad.fo['${kind}']=!${fo(kind,true)};render()"><span>絞り込み検索</span>${fo(kind,true) ? mk('common/minus.svg', kind==='appr'?16:20, 'var(--g)') : '<span>+</span>'}</button>
    ${fo(kind,true) ? `<div class="f g6 ${kind==='appr'?'ie jb':'ic je'} wf"><div class="f fc g4 f1"><div class="f g4 ic">
        ${kind==='conf' ? pulldown('fSt', S.ad.fSt, Object.entries(CF_ST).map(([k,[l]])=>[k,l]), 'ステータス', v=>{S.ad.fSt=v;}) : ''}
        ${dateInput('fDate', S.ad.fDate, v=>{S.ad.fDate=v;})}
        ${pulldown('fPoint', S.ad.fPoint, ptOpts, '点検場所', v=>{S.ad.fPoint=v;})}</div>
      <label class="f g2 ic tb cm"><input type="checkbox" class="ckb" ${(kind==='appr'?S.ad.fRej:S.ad.fAbn)?'checked':''} onchange="S.ad.${kind==='appr'?'fRej':'fAbn'}=this.checked;render()">${kind==='appr'?'差し戻しのものだけ表示':'異常があるものだけ表示'}</label></div>

  const top = kind==='search'
    ? `<div class="f ic g4">${fchip(FACTORY)}${fchip(r.location)}</div>`
    : `<div class="f ic jb wf">${fchip(FACTORY)}${pulldown('st', r.st, stOpts, '', v=>adStatus(kind, r.id, v), {cls:'bd r8 tb cw', style:`width:240px;background-color:${stColor}`, white:true, disabled: kind==='appr' && r.st!=='pending'})}</div>`;
  const back = kind==='appr' ? `adGo('apprList')` : kind==='conf' ? `adGo('confList')` : `adGo('searchList')`;

      <div class="f fc g2 ie wf">${kv('UV殺菌灯稼働時間（h）', r.uvHours)}${flag(r.uvRep,'UV殺菌灯交換')}${stamp}</div>${sep}

/* Comments.tsx */
function commentsHTML(list){
  return `<div class="bw r8 wf">${list.length ? list.map((c,i)=>`<div><div class="f fc g2 p4"><div class="f fc g1"><p class="w7 cg" style="font-size:20px;line-height:28px">${esc(c.who)}</p><p class="ts cm">${esc(c.at)}</p></div><p class="ci" style="font-size:18px;line-height:28px">${esc(c.text)}</p></div>${i<list.length-1?'<div class="bt" style="margin:0 16px"></div>':''}</div>`).join('')
    : `<p class="tb cm" style="padding:24px 16px">コメントはありません</p>`}</div>`;
}
function cmtInput(el){ S.ad.cmt = el.value; const b = document.getElementById('cmtBtn'); if (!b) return; const ok = !!el.value.trim(); b.disabled = !ok; b.style.background = ok ? 'var(--g)' : '#d0d0d0'; }
function adComment(id){
  const t = S.ad.cmt.trim(); if (!t) return;
  recOf(id).comments.push({who:ACCOUNT.name, at:`${jpDate(today())} ${nowHM()}`, text:t}); S.ad.cmt = ''; render();
}
function adStatus(kind, id, v){
  const r = recOf(id);
  if (kind==='conf'){ r.st = v; if (v==='pending') r.confirmer = r.confirmer || '田村康平'; render(); return; }
  if (v==='approved'){ if (!canApprove()){ say('確認者は承認できません'); return; } S.ad.dlg = {k:'approve', id}; render(); return; }
  if (v==='rejected'){ S.ad.dlg = {k:'reject', id}; render(); return; }
  r.st = v; render();
}
function doApprove(id){ const r = recOf(id); r.st = 'approved'; S.ad.dlg = null; render(); adToast('承認ステータスを更新しました。'); }
function doApproveAll(){ (S.ad.sc==='rxList' ? rxListRows('appr', S.ad.rx.slug) : waterRows('appr')).filter(r=>r.st==='pending').forEach(r=>r.st='approved'); S.ad.dlg = null; adGo('approvals',{tab:'approved'}); adToast('承認しました。'); }
function doReject(id){
  const t = (document.getElementById('rjIn')?.value||'').trim(); if (!t) return;
  const r = recOf(id); r.st = 'rejected'; r.comments.push({who:ACCOUNT.name, at:`${jpDate(today())} ${nowHM()}`, text:t});
  S.ad.dlg = null; render(); adToast('承認ステータスを更新しました。');
}

/* 列：[見出し, 幅（px か 'f1' か 'f15'）, 見出しの寄せ] */
function ftable(cols, rows, emptyMsg){
  const w = c => c==='f1' ? 'flex:1 1 0%' : c==='f15' ? 'flex:1.5 1 0%' : `width:${c}px;flex:none`;

function pager(k, total, per){

  return `<div class="f g2 ic">${ar(-1,'arrow-left')}${Array.from({length:pages},(_,i)=>`<button type="button" class="pgb ${i+1===pg?'on':''}" onclick="S.ad.pg['${k}']=${i+1};render()">${i+1}</button>`).join('')}${ar(1,'arrow-right')}</div>`;
}
const pageOf = (k, list, per) => { const pages = Math.max(1, Math.ceil(list.length/per)); const pg = Math.min(S.ad.pg[k]||1, pages); return list.slice((pg-1)*per, pg*per); };

function apSubmit(){

function progressEntries(){
  if (S.empty) return [];
  const water = S.records.filter(r=>ymOf(r.date)>='2026-08').map(r=>({id:r.id, date:r.date, slug:LIVE, name:r.location, st:r.st==='inspected'?'inspected':r.st==='rejected'?'rejected':'confirmed', point:r.point, unsent:r.unsent}));
  return [...water, ...S.progressOther].sort((a,b)=> a.date<b.date ? 1 : a.date>b.date ? -1 : 0);
}
function groupRows(list){
  const out = [];
  for (const e of list){ let g = out.find(x=>x.date===e.date); if (!g){ g = {date:e.date, leds:[]}; out.push(g); }
    let l = g.leds.find(x=>x.slug===e.slug); if (!l){ l = {slug:e.slug, items:[]}; g.leds.push(l); } l.items.push(e); }
  return out;
}

  const inner = type==='text' ? `<input class="inp wf lx-name" style="max-width:480px" placeholder="${esc(opt)}" value="${esc(val)}">`
    : type==='select' ? pulldown('lxs'+lb, val || S.ad.lx['s'+lb] || '', opt.map(o=>[o,o]), opt[0] ? `選択してください` : '', v=>{S.ad.lx['s'+lb]=v;}, {style:'width:480px'})

    : type==='freq' ? `<div class="f g2">${FREQ.map((f2,i)=>`<button type="button" class="r8 tb ${(S.ad.lx.fq||'毎日')===f2?'bg cw':'bw bd ci'}" style="height:40px;padding:0 20px" onclick="S.ad.lx.fq='${f2}';render()">${f2}</button>`).join('')}</div>`

      let row = '';

    if (x.ty==='num') return `<div class="frow g2"><div class="f ic jb wf g4"><p class="lb" style="flex:1;min-width:0">${esc(x.lb)}${req(x)}</p><input class="ninp" style="width:280px" value="${esc(f.vals[k]||'')}" placeholder="${esc(x.ph||'')}" oninput="axSet('${k}',this.value)" onblur="render()"></div>${x.note?`<p class="ts ci tr wf">${esc(x.note)}</p>`:''}${tsp(k)}</div>`;

    if (x.ty==='text') return `<div class="frow g2"><div class="f ic jb wf g4"><p class="lb" style="flex:1;min-width:0">${esc(x.lb)}${req(x)}</p><input class="ninp tlf" style="width:280px" value="${esc(f.vals[k]||'')}" placeholder="${esc(x.ph||'')}" oninput="axSet('${k}',this.value)" onblur="render()"></div>${tsp(k)}</div>`;
    if (x.ty==='textarea') return `<div class="frow g2"><div class="f fc g1 wf">${x.lb ? `<p class="lb">${esc(x.lb)}${req(x)}</p>` : ''}<textarea class="bw r8 tb ci wf bd bci" style="min-height:80px;padding:8px" placeholder="${esc(x.ph||'')}" oninput="axSet('${k}',this.value)" onblur="render()">${esc(f.vals[k]||'')}</textarea></div>${tsp(k)}</div>`;
    if (x.ty==='select') return frow(x, x.pills ? pills(k, x.opts) : pull(k, x.opts, x.ph), k);
    if (x.ty==='score') return frow(x, score(k), k);
    if (x.ty==='time') return frow(x, timeIn(k), k);

  }).join('');
  const need = fields.filter(x => x.req && !['grp','note','ro'].includes(x.ty));
  const done = x => { const k = fk(f, x); return x.ty==='okng' ? !!f.checks[k] : x.ty==='check' ? !!f.checks[k] : x.ty==='date' && x.k==='date' ? !!f.date : !!f.vals[k]; };
  const can = f.date && need.length ? need.every(done) : (Object.keys(f.ts).length > 0);

  const confirmList = L.confirmList ? `<div class="bw f fc g1 is r8 wf sh0" style="padding:8px 16px"><p class="tb w6 ci">【確認項目】</p>${L.confirmList.map(c=>`<p class="f ic g1 ts w3 ci">${CHECK_PATH(16,'var(--ok)')}${esc(c)}</p>`).join('')}</div>` : '';

    <div class="bw f fc is r8 wf" style="padding:24px 16px">${rows}</div></div>

/* 保存：秤は途中保存して秤の一覧へ。薬品は記録として登録して一覧へ。添加物は確認画面へ。金属は記録として登録して確認画面へ */
function axSave(){
  const a = S.app.ax, L = axL(), f = S.app.form;
  if (L.subKind==='scales'){ f.saved = true; S.app.axDraft = S.app.axDraft || {}; S.app.axDraft[`${a.slug}/${a.item}/${a.sub||''}`] = f; S.app.form = null; axGo('sub'); return; }
  if (L.saveTo==='confirm'){ axGo('confirm'); return; }
  axPush(f); S.app.form = null; axGo(L.subKind==='machine' ? 'confirm' : 'sub');
}
/* 記録 1 件ぶんの 見出し＋値（確認画面・記録の詳細で使う） */
function axKv(f, L, tab){
  const fields = axFields(f).filter(x => !x.when || x.when(f)).filter(x => !tab || !L.phases || x.tabbed || x.ty==='grp');
  const out = [];
  fields.forEach(x => {
    if (x.ty==='note') return;
    if (x.ty==='grp'){ out.push({grp:x.lb, unit:x.unit ? (f.vals[x.uk]||x.unit[0]) : null}); return; }
    const k = x.tabbed && tab ? `${tab}:${x.k}` : fk(f, x);
    if (x.ty==='date' && x.k==='date') return;
    let v, tag = null;
    if (x.ty==='okng' && x.badge){ tag = GP_BADGE[x.badge][0]; v = tag; }
    else if (x.ty==='okng'){ tag = f.checks[k]==='ng' ? '異常あり' : (f.checks[k] ? '正常' : (x.tag ? '未確認' : '正常')); v = tag; }
    else if (x.ty==='check'){ tag = f.checks[k] ? (x.tag||'正常') : '—'; v = tag; }
    else if (x.ty==='date'){ v = f.vals[k] ? jpDate(f.vals[k]) : '—'; }
    else if (x.ty==='score'){ v = f.vals[k] ? `${f.vals[k]}` : '—'; tag = f.vals[k] ? (Number(f.vals[k])<=2 ? 'low' : 'high') : null; }
    else if (x.ty==='ro'){ v = f.vals[k]||f.content||''; }
    else v = f.vals[k]||'';
    if (x.ty==='textarea' && !x.lb) return;
    out.push({lb:x.lb, v, tag, k, ng: x.ty==='okng' && f.checks[k]==='ng' ? f.ng[k] : null, sub:x.sub, block: x.ty==='textarea'});
  });
  return out;
}
function axKvHTML(f, kv, showTs=true){
  const tsp = k => showTs && k && f.ts && f.ts[k] ? `<p class="tsr">${esc(axWho(f,k))} ${f.ts[k]}</p>` : '';
  const tagEl = t => t==='修理中' || t==='要対応' ? `<span class="r8 f ic jc tx cw sh0" style="height:24px;width:64px;background:${t==='修理中'?'var(--caution)':'var(--err)'}">${t}</span>` : t==='異常あり' ? `<span class="r8 f ic jc tx cw sh0" style="height:24px;width:64px;background:var(--err)">異常あり</span>` : t==='—' ? '<span class="tb ci">—</span>' : t==='未確認' ? `<span class="r8 f ic jc tx cw sh0" style="height:24px;width:64px;background:#808080">未確認</span>` : `<span class="r8 f ic jc tx cw sh0" style="height:24px;min-width:64px;padding:0 8px;background:var(--ok)">${esc(t)}</span>`;
  let lastSub = '';
  return kv.map((r, i) => {
    if (r.grp){ lastSub = ''; return `<div class="bg f ic jb wf r8" style="padding:8px 16px;margin:8px 0"><p class="tl cw">${esc(r.grp)}</p>${r.unit ? `<p class="tb cw">${esc(r.unit)}</p>` : ''}</div>`; }
    const sub = r.sub && r.sub!==lastSub ? `<p class="tb w6 cg wf" style="padding-top:8px">${esc(r.sub)}</p>` : ''; if (r.sub) lastSub = r.sub;
    const val = r.tag==='low' ? `<span class="r8 f ic jc tx cw sh0" style="height:24px;width:48px;background:#f85c5c">${esc(r.v)}</span>` : r.tag==='high' ? `<span class="r8 f ic jc tx cw sh0" style="height:24px;width:48px;background:#19c95f">${esc(r.v)}</span>` : r.tag ? tagEl(r.tag) : `<p class="tb ci tr">${esc(r.v||'—')}</p>`;
    if (r.block) return `${sub}<div class="f fc g1 wf py3 ${i<kv.length-1?'bb':''}"><p class="tb ci">${esc(r.lb)}</p><p class="tb cm">${esc(r.v||'—')}</p></div>`;
    return `${sub}<div class="f fc g1 wf py3 ${i<kv.length-1?'bb':''}"><div class="f ic jb wf g4"><p class="tb ci" style="flex:1;min-width:0">${esc(r.lb)}</p>${val}</div>${r.ng ? `<div class="f fc g1 px2 cm" style="font-size:13px;line-height:1.5"><p>原因：${esc(r.ng.cause||'')}</p><p>対応：${esc(r.ng.action||'')}</p>${r.ng.detail ? `<p class="w5">${esc(r.ng.detail)}</p>` : ''}</div>` : ''}${tsp(r.k)}</div>`;
  }).join('');
}
const axHeadCard = rows => `<div class="bw f fc is r8 wf" style="padding:8px 16px;max-width:640px">${rows.map(([k,v],i)=>`<div class="f ic jb wf py3 ${i<rows.length-1?'bb':''}"><p class="tb ci">${esc(k)}</p><p class="tb ci">${esc(v)}</p></div>`).join('')}</div>`;

/* 記録を RX の行として増やす（管理画面の 確認管理 に「点検済み」で並ぶ）。詳細画面のために入力内容も持たせる */
function axPush(f, sub, post){
  const L = AX[f.slug]; const it = post || axItems(f.slug).find(x=>x.id===f.item) || axItems(f.slug)[0];
  const v = L.toV(f, sub || it, sub ? it : null);
  const tm = ['mdTime','xrTime','wcTime','slTime','abTime'].map(k=>f.vals[k]).find(Boolean) || nowHM();
  const r = rxRow(f.slug, uid(), 'inspected', f.date, tm, v, S.app.actor, '');
  r.note = f.vals.note || f.vals['start:note'] || ''; r.ax = Object.assign({}, f.vals, {content:f.content}); r.kv = axKv(f, L); r.ts = Object.assign({}, f.ts); r.form = JSON.parse(JSON.stringify(f)); r.itemId = f.item;   /* 次に開いたとき、提出した入力をそのまま戻す。itemId は同じ名前の対象（厚焼き玉子 ×3 など）を見分けるため */
  if (S.off || S.err){ r.unsent = true; S.app.unsent = true; }
  rxRows(f.slug).unshift(r); return r;
}
function axSubmit(){
  const a = S.app.ax, L = axL(), it = axItem();
  if (L.subKind==='scales'){ const drafts = S.app.axDraft || {}; L.subItems(it).forEach(s => { const key = `${a.slug}/${a.item}/${s.id}`; if (drafts[key]){ axPush(drafts[key], s, it); delete drafts[key]; } }); }
  else if (L.subKind){ if (L.saveTo==='confirm' && S.app.form && S.app.form.ax){ axPush(S.app.form); S.app.form = null; } /* 薬品・金属は保存のときに増えている */ }
  else { const r = axPush(S.app.form); a.rid = r.id; S.app.form = null; }
  delete (S.app.axSkip||{})[`${a.slug}/${it.name}`];
  if (S.err && !S.off) S.app.errDlg = true;
  axGo('complete');
}
/* ---- 提出完了 ---- */

  /* Figma「使用水の点検_保存完了」（Ver.1.0_初期開発 83:3001）と同じ配置。上詰め・塗りのチェック印・ヘッダーは 帳票名_対象名 */
  const head = C.title ? C.title(it) : L.title + (it?.name ? '_' + it.name : '');

}
window.addEventListener('hashchange', ()=>{ if (hashLock) return; if (applyHash()) render(); });

/* 描き直してもスクロール位置が上へ戻らないように、スクロール中の要素の位置を控えて戻す
   （要素は hold からの子の番号で辿る。チェックを押すと下に入力時刻の行が増えるが、外側の枠は同じ位置に残るので合う） */
function scrollSave(hold){
  const path = el => { const p = []; while (el && el!==hold){ p.unshift([...el.parentNode.children].indexOf(el)); el = el.parentNode; } return p; };
  const out = [];
  hold.querySelectorAll('*').forEach(el => { if (el.scrollTop>0 || el.scrollLeft>0) out.push([path(el), el.scrollTop, el.scrollLeft]); });
  return {els:out, win:[window.scrollX, window.scrollY]};
}
function scrollRestore(hold, sc){
  sc.els.forEach(([p, t, l]) => { let el = hold; for (const i of p){ el = el && el.children[i]; } if (el){ el.scrollTop = t; el.scrollLeft = l; } });
  window.scrollTo(sc.win[0], sc.win[1]);
}
function render(opt={}){
  const hold = document.getElementById('hold');
  const sc = scrollSave(hold), h0 = locHash();   /* 別の画面へ移ったときは戻さない（新しい画面は上から） */
  hold.classList.toggle('wide', S.dev!=='app');
  hold.innerHTML = S.dev==='app' ? `<div class="tab ts-${S.app.size||'medium'}">${appView()}</div>` : `<div class="win">${S.dev==='states' ? statesView() : adView()}</div>`;
  if (!opt.top && locHash()===h0) scrollRestore(hold, sc);
  if (opt.keep && opt.keep.value !== undefined){
    /* 入力中の欄を描き直しても焦点が飛ばないように、同じ位置の input を探す */
    const inputs = [...hold.querySelectorAll('input')]; const same = inputs.find(i => i.value===opt.keep.value && i.placeholder===opt.keep.placeholder);
    if (same){ same.focus(); const n = same.value.length; try{ same.setSelectionRange(n,n); }catch(e){} }
  }
  if (typeof nvSync === 'function'){ try{ nvSync(); }catch(e){ console.warn('nvSync', e); } }
  syncHash(); saveState();
}
function setDev(k){ S.dev = k; render(); }
function resetAll(){ try{ sessionStorage.removeItem(SS); }catch(e){} S = SEED(); location.hash = ''; render(); }
document.addEventListener('keydown', e => {
  const t = document.activeElement?.tagName;
  if (t==='INPUT' || t==='TEXTAREA' || t==='SELECT') return;
  if (e.key==='1') setDev('admin'); else if (e.key==='2') setDev('app');
});
if (!FRAME) loadState();
applyHash();
if (FRAME) applyFlags(Object.fromEntries(QS));
/* 画面設計の「プロトタイプで開く」から来たとき（?kit=1&empty=1&role=…）。状態とロールを写してから、URL は hash だけにする。
   入力中の内容は、画面設計が押す直前に sessionStorage へ保存させたものを上の loadState() が読んでいる */
else if (QS.has('kit')){ applyFlags(Object.fromEntries(QS));
  try{ sessionStorage.setItem('nqKit', JSON.stringify({doc:QS.get('doc')||'画面設計', n:+QS.get('n')||0, demo:QS.get('demo')||'プロトタイプ', demoDesc:QS.get('demoDesc')||''})); }catch(e){}
  try{ history.replaceState(null, '', location.pathname + location.hash); }catch(e){} }
render();

/* ---------- 右下の切替 ---------- */
const nvSw=document.getElementById('nvSw'), nvFab=document.getElementById('nvFab'), nvPanel=document.getElementById('nvPanel');
function nvOpen(v){ const o = v===undefined ? nvPanel.hidden : v;
  nvPanel.hidden=!o; nvSw.classList.toggle('open',o); nvFab.setAttribute('aria-expanded',String(o)); }
nvFab.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); nvOpen(); });
document.getElementById('nvX').addEventListener('click', e=>{ e.stopPropagation(); nvOpen(false); });
document.addEventListener('click', e=>{ if(!e.target.closest('#nvSw')) nvOpen(false); });
document.addEventListener('keydown', e=>{
  if (e.key!=='Escape') return;
  if (S.ad.dlg || S.ad.dl || S.app.dlg || S.app.picker || S.app.ngDlg || S.app.filt || S.app.sdlg){ e.stopPropagation(); closeDlg(); return; }
  if (!nvPanel.hidden){ e.stopPropagation(); nvOpen(false); }
}, true);
var NVDEV=[['admin','管理画面'],['app','アプリ']];
var NVSTATE=[['off','オフライン','送信できず未送信のまま残る'],['empty','データが無い','記録がまだ 1 件も無い'],['err','送信エラー','送信に失敗した状態'],['session','セッション終了','放置して自動ログアウトされた']];
/* 画面設計の「プロトタイプで開く」から来たとき（sessionStorage の nqKit）は、右下を画面設計の右下と同じ中身にする：
   資料（画面設計へ戻る／いま見ているもの）と 権限（管理画面のロール。画面設計の PROJECT.roles と同じ並び・説明） */
const KIT = (()=>{ try{ return JSON.parse(sessionStorage.getItem('nqKit') || 'null'); }catch(e){ return null; } })();
const KIT_ROLES = [['administrator','管理者','全画面にアクセスできる'],['approver','承認者','確認者が確認した確認済みの帳票を承認する'],
  ['checker','確認者','実施者が提出した帳票を確認する'],['approver_checker','承認者・確認者兼任','確認と承認の両方を行う']];
function kitSync(){
  const st = ['off','empty','err','session'].find(k => S[k]);
  const back = 'nqrepo-screen-design.html?' + new URLSearchParams(Object.assign({role:S.role}, st ? {state:st} : {})) + '#' + locHash();
  const it = (t1, t2, cur, attr) => `<${attr ? attr : 'span'} class="nvit" aria-current="${cur}"><span class="nvr"></span><span class="tx"><b class="t1">${esc(t1)}</b><span class="t2">${esc(t2)}</span></span></${attr ? attr.split(' ')[0] : 'span'}>`;
  document.querySelector('#nvPanel .nvbody').innerHTML =
    `<div class="nvsec"><p class="nvh">資料</p>${it(KIT.doc, KIT.n ? `全${KIT.n}画面と決めること` : '全画面と決めること', false, `a href="${esc(back)}"`)}${it(KIT.demo, KIT.demoDesc, true)}</div>
     <div class="nvsec"><p class="nvh">権限（管理画面のロール）</p><div>${KIT_ROLES.map(([k,n,d]) => it(n, d, S.role===k, `button type="button" onclick="event.stopPropagation();setRole('${k}')"`)).join('')}</div></div>`;
  document.querySelector('#nvPanel .nvfoot').innerHTML = '<span class="nvkey" style="margin-left:0"><b>Esc</b> で閉じる</span>';
  document.getElementById('nvX').hidden = true;
  document.querySelector('.nvfab .lb').textContent = KIT.demo;
  const sb = document.getElementById('nvSub'); if (sb) sb.remove();
}
function nvSync(){
  if (KIT) return kitSync();
  const st = document.getElementById('nvState');
  if (st) st.innerHTML = NVSTATE.map(([k,l,d])=>
    `<button class="nvit" aria-current="${!!S[k]}" onclick="S.${k}=!S.${k};render()"><span class="nvr"></span><span class="tx"><b class="t1">${l}</b><span class="t2">${d}</span></span></button>`).join('');
  const ro = document.getElementById('nvRole');
  if (ro) ro.innerHTML = Object.entries(ROLES).map(([k,r])=>
    `<button class="nvit" aria-current="${S.role===k}" onclick="setRole('${k}')"><span class="nvr"></span><span class="tx"><b class="t1">${r.name}</b><span class="t2">${r.desc}</span></span></button>`).join('');
  const dev = document.getElementById('nvDev');
  if (dev) dev.innerHTML = NVDEV.map(([k,l])=>`<button class="nvit" aria-current="${S.dev===k}" onclick="setDev('${k}')"><span class="nvr"></span><span class="tx"><b class="t1">${l}</b></span></button>`).join('');
  const sb=document.getElementById('nvSub'); if(sb) sb.textContent = (NVDEV.find(d=>d[0]===S.dev)||[])[1]||'';
}
if (document.getElementById('nvReset')) document.getElementById('nvReset').onclick = () => {
  if (!confirm('操作した内容をすべて元に戻します。よろしいですか？')) return;
  resetAll(); nvOpen(false); say('最初の状態に戻しました');
};
nvSync();
try{ if(!FRAME && !KIT && !sessionStorage.getItem('nqSeen')){ nvOpen(true); sessionStorage.setItem('nqSeen','1'); setTimeout(()=>nvOpen(false), 6000); } }catch(e){}
</script>
</body>
