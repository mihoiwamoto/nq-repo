<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進捗管理一覧</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background-color: #F3F4F6;
      min-height: 100vh;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 80px;
      background-color: #059669;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 24px;
    }

    .sidebar-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .sidebar-logo, .sidebar-nav-item {
      width: 48px;
      height: 48px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: background-color 0.2s;
    }

    .sidebar-logo {
      background-color: white;
    }

    .sidebar-nav-item:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .sidebar-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background-color: #EF4444;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
    }

    .sidebar-label {
      font-size: 11px;
      color: white;
      margin-top: 4px;
      text-align: center;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .header {
      background-color: #10B981;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s;
    }

    .tab-button.active {
      background-color: #10B981;
      color: white;
    }

    .tab-button.inactive {
      background-color: white;
      color: #374151;
      border: 1px solid #E5E7EB;
    }

    /* Search */
    .search-container {
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      font-size: 14px;
      background-color: #F9FAFB;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: #9CA3AF;
    }

    /* Date */
    .date-section {
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: bold;
      color: #1F2937;
    }

    /* Sections */
    .sections {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section {
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #E5E7EB;
      cursor: pointer;
      background-color: #F9FAFB;
      transition: background-color 0.2s;
    }

    .section-header:hover {
      background-color: #F3F4F6;
    }

    .section-title-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .section-icon {
      font-size: 18px;
    }

    .section-title {
      font-weight: 600;
      color: #059669;
      font-size: 16px;
    }

    .expand-button {
      background-color: #10B981;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .expand-button:hover {
      background-color: #059669;
    }

    .section-items {
      display: flex;
      flex-direction: column;
    }

    .section-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #E5E7EB;
      font-size: 14px;
      color: #6B7280;
    }

    .section-item:last-child {
      border-bottom: none;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      display: inline-block;
      white-space: nowrap;
    }

    .status-unchecked {
      background-color: #9CA3AF;
      color: white;
    }

    .status-checking {
      background-color: #3B82F6;
      color: white;
    }

    .status-checked {
      background-color: #FCD34D;
      color: black;
    }

    .status-confirmed {
      background-color: #10B981;
      color: white;
    }

    .section-footer {
      padding: 12px 20px;
      background-color: #10B981;
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: white;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-item">
        <div class="sidebar-logo">📦</div>
      </div>

      <div class="sidebar-item">
        <div class="sidebar-nav-item">📋</div>
        <div class="sidebar-label">帳票</div>
      </div>

      <div class="sidebar-item">
        <div class="sidebar-nav-item">☰</div>
        <div class="sidebar-badge">00</div>
        <div class="sidebar-label">進捗</div>
      </div>

      <div class="sidebar-item">
        <div class="sidebar-nav-item">✔️</div>
        <div class="sidebar-badge">00</div>
        <div class="sidebar-label">確認待ち</div>
      </div>

      <div class="sidebar-item">
        <div class="sidebar-nav-item">📅</div>
        <div class="sidebar-label">点検予定</div>
      </div>

      <div class="sidebar-item">
        <div class="sidebar-nav-item">🔤</div>
        <div class="sidebar-label">サイズ</div>
      </div>

      <div class="sidebar-item">
        <div class="sidebar-nav-item">❓</div>
        <div class="sidebar-label">ヘルプ</div>
      </div>

      <div class="sidebar-item">
        <div class="sidebar-nav-item">⚙️</div>
        <div class="sidebar-label">設定</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div class="header">
        <span>📦</span>
        <span>進捗一覧</span>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-button active">すべて</button>
        <button class="tab-button inactive">未点検</button>
      </div>

      <!-- Search -->
      <div class="search-container">
        <input type="text" class="search-input" placeholder="絞り込み検索">
      </div>

      <!-- Date -->
      <div class="date-section">04/01</div>

      <!-- Sections -->
      <div class="sections">
        <!-- Section 1 -->
        <div class="section">
          <div class="section-header" onclick="toggleSection(this)">
            <div class="section-title-container">
              <span class="section-icon">🏢</span>
              <span class="section-title">金属/X線探知機記録</span>
            </div>
            <button class="expand-button">±</button>
          </div>
          <div class="section-items" style="display: flex;">
            <div class="section-item">
              <span>XXXXXXX</span>
              <span class="status-badge status-unchecked">未点検</span>
            </div>
            <div class="section-item">
              <span>XXXXXXX</span>
              <span class="status-badge status-checking">点検中</span>
            </div>
            <div class="section-item">
              <span>XXXXXXX</span>
              <span class="status-badge status-checked">点検済み</span>
            </div>
            <div class="section-item">
              <span>XXXXXXX</span>
              <span class="status-badge status-confirmed">確認完了</span>
            </div>
          </div>
          <div class="section-footer">
            <span>確認完了</span>
            <div class="progress-bar">
              <div class="progress-fill" style="width: 50%;"></div>
            </div>
            <span>2/4</span>
          </div>
        </div>

        <!-- Section 2 -->
        <div class="section">
          <div class="section-header" onclick="toggleSection(this)">
            <div class="section-title-container">
              <span class="section-icon">🧬</span>
              <span class="section-title">検体管理</span>
            </div>
            <button class="expand-button">±</button>
          </div>
          <div class="section-items" style="display: flex;">
            <div class="section-item">
              <span>仕出しした巻き玉子 冷凍</span>
              <span class="status-badge status-unchecked">未点検</span>
            </div>
            <div class="section-item">
              <span>厚焼き玉子（本） 500g</span>
              <span class="status-badge status-checked">点検済み</span>
            </div>
            <div class="section-item">
              <span>製品名○○○○○○○</span>
              <span class="status-badge status-confirmed">確認完了</span>
            </div>
            <div class="section-item">
              <span>製品名○○○○○○○</span>
              <span class="status-badge status-confirmed">確認完了</span>
            </div>
          </div>
          <div class="section-footer">
            <span>確認完了</span>
            <div class="progress-bar">
              <div class="progress-fill" style="width: 75%;"></div>
            </div>
            <span>3/4</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleSection(headerElement) {
      const itemsContainer = headerElement.nextElementSibling;
      const footer = itemsContainer.nextElementSibling;
      const button = headerElement.querySelector('.expand-button');

      if (itemsContainer.style.display === 'none') {
        itemsContainer.style.display = 'flex';
        footer.style.display = 'flex';
      } else {
        itemsContainer.style.display = 'none';
        footer.style.display = 'none';
      }
    }

    // Initialize all sections as expanded
    document.querySelectorAll('.section-header').forEach(header => {
      const itemsContainer = header.nextElementSibling;
      const footer = itemsContainer.nextElementSibling;
      itemsContainer.style.display = 'flex';
      footer.style.display = 'flex';
    });
  </script>
</body>
</html>
